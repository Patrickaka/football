name: Deploy

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: SSH 部署到服务器
        id: ssh_deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA
          capture_stdout: true
          script: |
            # 外层负责无论成功失败都回传阶段和状态；真正部署仍在严格子 shell 中。
            # 这样 GitHub 后续步骤能公开显示失败点，而不是只有笼统的 exit code 1。
            set +e
            (
              set -eu
              echo '__DEPLOY_STAGE__=repository'
              cd /root/football

              echo '__DEPLOY_STAGE__=fetch'
              git fetch --prune origin master
              if ! git diff --quiet || ! git diff --cached --quiet; then
                echo '__DEPLOY_STAGE__=stash'
                echo "检测到服务器 tracked 文件有改动，先保存到 git stash 后再部署"
                git stash push -m "auto-deploy-${DEPLOY_SHA}-$(date +%Y%m%d%H%M%S)"
              fi
              echo '__DEPLOY_STAGE__=merge'
              git switch master
              git merge --ff-only "${DEPLOY_SHA}"
              test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"
              grep -Fq '/api/kl8-refresh/start' web/index.html
              grep -Fq 'kl8-dashboard' web/index.html

              echo '__DEPLOY_STAGE__=install'
              # 运行环境是 uv 管理的 /root/football/.venv（旧的 conda 环境已废弃）。
              # 用绝对路径调 uv：非交互 SSH 不加载 ~/.bashrc，PATH 里没有 ~/.local/bin。
              /root/.local/bin/uv pip install --python /root/football/.venv/bin/python -r requirements.txt
              mkdir -p data
              printf '%s\n' "${DEPLOY_SHA}" > data/deployed_revision

              echo '__DEPLOY_STAGE__=restart'
              systemctl restart football
              systemctl is-active --quiet football
              systemctl show football -p MainPID -p ExecStart -p WorkingDirectory

              echo '__DEPLOY_STAGE__=health'
              # 端口以 service 里的 FOOTBALL_PORT 为准（未配置时服务默认 9000）。
              # 写死端口曾让部署每次都停在健康检查上，而服务其实已经起好了。
              health_port="$(systemctl show football -p Environment --value \
                | tr ' ' '\n' | sed -n 's/^FOOTBALL_PORT=//p' | tail -1)"
              health_port="${health_port:-9000}"
              echo "健康检查端口 ${health_port}"
              for attempt in $(seq 1 30); do
                health_json="$(curl -fsS "http://127.0.0.1:${health_port}/healthz" || true)"
                if printf '%s' "${health_json}" | grep -Fq "\"revision\":\"${DEPLOY_SHA}\""; then
                  echo "部署完成，运行版本 ${DEPLOY_SHA}"
                  exit 0
                fi
                sleep 2
              done

              echo "健康检查没有返回目标版本 ${DEPLOY_SHA}"
              systemctl status football --no-pager || true
              exit 1
            )
            deploy_status=$?
            printf '__DEPLOY_STATUS__=%s\n' "${deploy_status}"
            exit 0

      - name: 校验远端部署结果
        if: always()
        shell: bash
        env:
          SSH_OUTCOME: ${{ steps.ssh_deploy.outcome }}
          DEPLOY_OUTPUT: ${{ steps.ssh_deploy.outputs.stdout }}
        run: |
          set -eu
          printf '%s\n' "${DEPLOY_OUTPUT}"

          if [ "${SSH_OUTCOME}" != 'success' ]; then
            echo '::error title=SSH 部署执行器失败::未能正常连接服务器或捕获远端输出'
            exit 1
          fi

          if ! printf '%s\n' "${DEPLOY_OUTPUT}" | grep -Fq '__DEPLOY_STATUS__=0'; then
            deploy_stage="$(printf '%s\n' "${DEPLOY_OUTPUT}" | grep -F '__DEPLOY_STAGE__=' | tail -n 1 || true)"
            error_tail="$(printf '%s\n' "${DEPLOY_OUTPUT}" | tail -n 80 | python3 -c 'import sys; text=sys.stdin.read(); print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            echo "::error title=远端部署失败 ${deploy_stage:-未知阶段}::${error_tail}"
            exit 1
          fi
