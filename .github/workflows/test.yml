name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 新代码必须全绿，不容许任何失败。
      - name: 跑新代码测试
        run: python3 -m pytest tests/foundation/ tests/api/ -q

      # 全量套件里有 9 个重构前就存在的存量失败（依赖网络/历史数据/版本号断言），
      # 逐条排除，使 CI 绿 == 没有新增失败。修好某条后请从这里删掉它。
      # 基线依据见 docs/superpowers/specs/2026-08-25-架构重构-design.md 的验证策略一节。
      - name: 跑全量测试（排除存量失败）
        run: |
          python3 -m pytest -q \
            --deselect tests/test_kelly.py::test_analyze_kelly_structure \
            --deselect tests/test_model.py::test_predict_scores_top1_reasonable \
            --deselect tests/test_result_sync_quality_guard.py::ResultSyncQualityGuardTests::test_audit_prediction_history_repair_marks_unsafe_samples \
            --deselect tests/test_result_sync_quality_guard.py::ResultSyncQualityGuardTests::test_audit_prediction_history_reports_without_repairing_by_default \
            --deselect tests/test_result_sync_quality_guard.py::ResultSyncQualityGuardTests::test_goal_count_calibrator_uses_weighted_effective_samples \
            --deselect tests/test_result_sync_quality_guard.py::ResultSyncQualityGuardTests::test_prediction_records_hide_future_settlement \
            --deselect tests/test_result_sync_quality_guard.py::ResultSyncQualityGuardTests::test_repair_future_settlements_resets_bad_record \
            --deselect tests/test_result_sync_quality_guard.py::ResultSyncQualityGuardTests::test_update_result_rejects_future_match \
            --deselect tests/test_score_scenario_diversity.py::ScoreScenarioDiversityTests::test_prediction_logic_version_invalidates_old_diversified_ranking_cache
