name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # **一步跑完，不再拆两步。**原先是「先跑 tests/foundation + tests/api，
      # 再跑全量」，有两个毛病：
      #
      # 1. `run:` 之间是 `bash -e`，第一步非零退出整个 job 就中断——**第二步
      #    根本不执行**。2026-08-31 就栽在这里：第一步 3 条红下面压着第二步
      #    275 条，修好第一步才发现，而那批红已经潜伏了三天。
      # 2. 第一步那些用例在第二步的全量里又跑一遍，纯属白跑。
      #
      # 存量失败已清零（2026-08-27），**CI 绿 == 全量套件绿**，不再需要心算
      # 「哪些红是允许的」，也就没有再分快慢两档的理由。全量本身 ~70 秒。
      # CI 固定串行运行。该套件包含大量共享缓存/临时文件用例，GitHub runner
      # 上的 xdist worker 偶发被系统终止：同一个提交可能一次绿、下一次几秒内
      # 崩溃。串行约多等几分钟，但结果可复现，也不会再产生假红。
      - name: 跑全量测试
        shell: bash
        run: |
          set +e
          python3 -m pytest -q 2>&1 | tee pytest-output.log
          test_status=${PIPESTATUS[0]}

          if [ "${test_status}" -ne 0 ]; then
            {
              echo '### pytest 失败摘要'
              echo '```text'
              tail -n 120 pytest-output.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"

            error_tail="$(tail -n 40 pytest-output.log | python3 -c 'import sys; text=sys.stdin.read(); print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            echo "::error title=全量测试失败::${error_tail}"
          fi

          exit "${test_status}"
