name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # **一步跑完，不再拆两步。**原先是「先跑 tests/foundation + tests/api，
      # 再跑全量」，有两个毛病：
      #
      # 1. `run:` 之间是 `bash -e`，第一步非零退出整个 job 就中断——**第二步
      #    根本不执行**。2026-08-31 就栽在这里：第一步 3 条红下面压着第二步
      #    275 条，修好第一步才发现，而那批红已经潜伏了三天。
      # 2. 第一步那些用例在第二步的全量里又跑一遍，纯属白跑。
      #
      # 存量失败已清零（2026-08-27），**CI 绿 == 全量套件绿**，不再需要心算
      # 「哪些红是允许的」，也就没有再分快慢两档的理由。全量本身 ~70 秒。
      - name: 跑全量测试
        run: python3 -m pytest -q
