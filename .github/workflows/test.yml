name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # **一步跑完，不再拆两步。**原先是「先跑 tests/foundation + tests/api，
      # 再跑全量」，有两个毛病：
      #
      # 1. `run:` 之间是 `bash -e`，第一步非零退出整个 job 就中断——**第二步
      #    根本不执行**。2026-08-31 就栽在这里：第一步 3 条红下面压着第二步
      #    275 条，修好第一步才发现，而那批红已经潜伏了三天。
      # 2. 第一步那些用例在第二步的全量里又跑一遍，纯属白跑。
      #
      # 存量失败已清零（2026-08-27），**CI 绿 == 全量套件绿**，不再需要心算
      # 「哪些红是允许的」，也就没有再分快慢两档的理由。全量本身 ~70 秒。
      # `-n auto` 按 runner 的核数并行（GitHub 的 ubuntu-latest 是 4 核）。
      # 本机实测 75s → 57s(4 进程) → 53s(8 进程)，**且三者的通过/跳过数完全
      # 一致**——这一点是前提而不是巧合：并行以前会把结果跑成 2416/12 而串行
      # 是 2411/17，差额来自 test_score_prediction 那族 `except: skipTest`
      # 和它掩盖的状态依赖。那两处修掉之后并行才谈得上安全。
      #
      # 并行的天花板是**最慢的单个测试方法**（一个方法再慢也只能待在一个进程
      # 里）。kl8 那两族原本各是一个 20 秒的方法，已按候选池拆开。
      - name: 跑全量测试
        run: python3 -m pytest -q -n auto
