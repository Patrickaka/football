name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 新代码必须全绿，不容许任何失败。
      - name: 跑新代码测试
        run: python3 -m pytest tests/foundation/ tests/api/ -q

      # 存量失败已清零（2026-08-27）：原先排除的 9 条全部修好，`--deselect`
      # 一并删掉。**CI 绿 == 全量套件绿**，不再需要心算「哪些红是允许的」。
      # 那 9 条没有一条是实现 bug：5 条写死了一个当时属于未来的日期、
      # 3 条没跟上实现的有意演进、1 条断言的是版本字符串而不是缓存失效行为。
      - name: 跑全量测试
        run: |
          python3 -m pytest -q
