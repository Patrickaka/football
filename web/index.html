        <div style="color:${status[1]};font-size:13px;font-weight:500">${status[0]}</div></div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px">
          ${spf.available ? `<div><span style="color:var(--muted)">胜平负预测：</span><b>${esc(spf.pick)}</b>${spf.detail ? ` · ${spf.detail}` : ''} ${beidanHitMark(record.hit_spf)}</div>` : ''}
          ${rqspf.available ? `<div style="margin-top:4px"><span style="color:var(--muted)">让球胜平负${handicap ? `（主队 ${esc(handicap)}）` : ''}预测：</span><b>${esc(rqspf.pick)}</b>${rqspf.detail ? ` · ${rqspf.detail}` : ''} ${beidanHitMark(record.hit_rqspf)}</div>` : ''}
          ${zjq.available ? `<div style="margin-top:4px"><span style="color:var(--muted)">总进球预测：</span><b>${esc(zjq.pick)}</b>${zjq.detail ? ` · ${zjq.detail}` : ''} ${beidanHitMark(record.hit_zjq)}</div>` : ''}
          ${record.settled ? `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:7px"><div><span style="color:var(--muted)">赛后比分：</span><b style="color:var(--accent2)">${esc(record.actual_score || '-')}</b></div><div><span style="color:var(--muted)">实际胜平负：</span>${esc(record.actual_spf || '-')}</div>${record.actual_rqspf ? `<div><span style="color:var(--muted)">实际让球赛果：</span>${esc(record.actual_rqspf)}</div>` : ''}${record.actual_zjq ? `<div><span style="color:var(--muted)">实际总进球：</span>${esc(record.actual_zjq)}</div>` : ''}</div>` : ''}
          ${record.sync_status === 'retry' ? `<div style="margin-top:6px;color:var(--warn)">重试原因：${esc(record.last_sync_error || '未找到赛果')}${record.next_sync_at ? ` · 下次 ${esc(record.next_sync_at.replace('T', ' ').slice(0, 16))}` : ''}</div>` : ''}
          ${record.sync_status === 'failed' ? `<div style="margin-top:6px;color:var(--away)">失败原因：${esc(record.last_sync_error || '未找到赛果')}</div>` : ''}
        </div></div>`;
    });
    if (records.length > PREDICTIONS_PAGE_SIZE) html += renderPredictionsPager(records.length, predictionsPage, totalPages, pageStart + 1, pageEnd);
  }
  app.innerHTML = html;
}

async function loadPredictions() {
  const app = document.getElementById('app-predictions');
  app.innerHTML = `<div class="status"><span class="spinner"></span>正在加载预测记录…</div>`;
  
  try {
    if (predictionRecordType === 'beidan') {
      await loadBeidanPredictionRecords();
      return;
    }
    // 预测记录是主数据；同步状态和诊断只是辅助卡片。辅助接口失败时也必须
    // 展示已保存记录，不能因为当前没有赛程或诊断暂不可用把历史一起隐藏。
    const optionalResult = async promise => {
      try {
        const data = await promise;
        return data?.error ? { error: data.error } : data;
      } catch (error) {
        return { error: error.message || String(error) };
      }
    };
    const [recordsData, syncStatus, diagnosticsData] = await Promise.all([
      fetchJson('/api/predictions'),
      optionalResult(fetchJsonWithTimeout('/api/sync/status', 5000)),
      optionalResult(fetchJsonWithTimeout('/api/football/diagnostics', 5000))
    ]);
    if (recordsData.error) throw new Error(recordsData.error);
    
    const sync = syncStatus.result || {};
    const allRecords = recordsData.result?.records || [];
    const availableDates = [...new Set(allRecords.map(predictionRecordDateKey).filter(Boolean))]
      .sort((a, b) => b.localeCompare(a));
    predictionAvailableDates = availableDates;
    predictionDateCounts = allRecords.reduce((counts, record) => {
      const date = predictionRecordDateKey(record);
      if (date) counts[date] = (counts[date] || 0) + 1;
      return counts;
    }, {});
    const calendarAnchor = predictionDateFilter || availableDates[0]
      || new Date().toISOString().slice(0, 10);
    if (!predictionCalendarMonth || predictionDateFilter) {
      predictionCalendarMonth = calendarAnchor.slice(0, 7);
    }
    const records = predictionDateFilter
      ? allRecords.filter(record => predictionRecordDateKey(record) === predictionDateFilter)
      : allRecords;
    const diagnostics = diagnosticsData.result || {};
    const auxiliaryWarnings = [
      syncStatus.error ? `同步状态暂不可用：${syncStatus.error}` : '',
      diagnosticsData.error ? `诊断数据暂不可用：${diagnosticsData.error}` : '',
    ].filter(Boolean);
    predictionExportData = {
      schema_version: 'football-prediction-export-v1',
      exported_at: new Date().toISOString(),
      record_count: allRecords.length,
      settled_count: allRecords.filter(record => record.settled || record.actual_score).length,
      model_versions: [...new Set(allRecords.map(record => record.model_version).filter(Boolean))],
      sync_status: sync,
      diagnostics,
      records: allRecords,
    };
    const settledAt = sync.last_settled_at || '';
    const syncStamp = formatSyncStamp(settledAt);
    
    let html = renderPredictionRecordTypeTabs();
    html += auxiliaryWarnings.length
      ? `<div class="note" style="margin-bottom:12px">${auxiliaryWarnings.map(esc).join(' · ')}；以下预测记录仍可正常查看。</div>`
      : '';

    // 数据库读不到时列表来自本地快照，可能缺最近若干天的记录——必须说出来，
    // 否则用户看到的是「中间的记录莫名消失」。
    const storageDegraded = recordsData.result?.storage_degraded;
    if (storageDegraded) {
      const degradedAt = (storageDegraded.at || '').replace('T', ' ').slice(0, 19);
      html += `<div class="status error" style="margin-bottom:12px">
        ⚠️ 数据库暂不可用，当前列表读自本地快照，可能缺少最近入库的记录。
        原因：${esc(storageDegraded.error || '未知')}${degradedAt ? ` · ${esc(degradedAt)}` : ''}
      </div>`;
    }
    
    // ── 自动同步状态卡片 ──
    html += `<div class="card model-health"><h3>🔄 自动赛果同步</h3>
      <div class="status-grid">
      <div class="status-item">
        <span class="status-dot">✅</span>
        <div>
          <div class="status-name">已回填</div>
          <div class="status-desc">${sync.settled || 0} 场</div>
        </div>
      </div>
      <div class="status-item">
        <span class="status-dot">⏳</span>
        <div>
          <div class="status-name">待同步</div>
          <div class="status-desc">${sync.pending_sync || 0} 场</div>
        </div>
      </div>
      <div class="status-item ${sync.failed > 0 ? '' : ''}">
        <span class="status-dot">${sync.failed > 0 ? '⚠️' : '✅'}</span>
        <div>
          <div class="status-name">同步失败</div>
          <div class="status-desc">${sync.failed || 0} 场</div>
        </div>
      </div>
      <div class="status-item sync-stamp ${syncStamp.state}" data-sync-at="${esc(settledAt)}">
        <span class="status-dot">🕐</span>
        <div>
          <div class="status-name">最近比分回填</div>
          <div class="status-desc" data-sync-age>${esc(syncStamp.text)}</div>
          <div class="status-desc" data-sync-detail style="font-size:11px">${esc(syncStamp.detail)}</div>
        </div>
      </div>
      </div>
    </div>`;
    
    html += renderFootballDiagnostics(diagnostics);

    // ── 操作按钮 ──
    html += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      <button type="button" onclick="exportPredictionRecords()" style="flex:1;min-width:150px;padding:10px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;font-size:14px;cursor:pointer">
        ⬇️ 一键导出 JSON
      </button>
      <button type="button" onclick="triggerSync()" style="flex:1;padding:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer">
        🔁 立即同步一次
      </button>
      <button type="button" onclick="runFootballReview(false)" style="flex:1;padding:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer">
        赛后复盘
      </button>
      <button type="button" onclick="runFootballReview(true)" style="flex:1;padding:10px;background:var(--card2);color:var(--warn);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer">
        复盘+修复
      </button>
      ${sync.failed > 0 ? `<button type="button" onclick="hideFailedRecords()" style="flex:1;padding:10px;background:var(--card2);color:var(--muted);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer">
        🧹 隐藏失败记录
      </button>` : ''}
    </div>`;
    
    // ── 预测记录列表 ──
    html += `<div class="prediction-date-toolbar">
      <span class="prediction-date-label">比赛日期</span>
      <div class="prediction-calendar-wrap">
        <button id="prediction-date-trigger" type="button" class="prediction-date-trigger"
          onclick="togglePredictionCalendar(event)" aria-haspopup="dialog" aria-expanded="false">
          <span>${predictionDateFilter ? esc(predictionDateFilter) : '年 / 月 / 日'}</span>
          <span class="prediction-date-trigger-icon" aria-hidden="true">▣</span>
        </button>
        <div id="prediction-calendar-popover" class="prediction-calendar-popover" role="dialog"
          aria-label="选择比赛日期" onclick="event.stopPropagation()" hidden></div>
      </div>
      <button type="button" class="prediction-date-action" onclick="setPredictionDateToday()">今天</button>
      ${predictionDateFilter ? `<button type="button" class="prediction-date-action" onclick="setPredictionDateFilter('')">查看全部</button>` : ''}
      <span class="prediction-date-result">${predictionDateFilter ? `${esc(predictionDateFilter)} · ${records.length} 场` : `全部日期 · ${records.length} 场`}</span>
    </div>`;
    html += `<div class="section-title">📋 预测记录（共 ${records.length} 条）</div>`;
    
    const totalPages = Math.max(1, Math.ceil(records.length / PREDICTIONS_PAGE_SIZE));
    predictionsPage = Math.max(1, Math.min(predictionsPage, totalPages));
    const pageStart = (predictionsPage - 1) * PREDICTIONS_PAGE_SIZE;
    const pageRecords = records.slice(pageStart, pageStart + PREDICTIONS_PAGE_SIZE);
    const pageEnd = pageStart + pageRecords.length;
    if (records.length > PREDICTIONS_PAGE_SIZE) {
      html += renderPredictionsPager(records.length, predictionsPage, totalPages, pageStart + 1, pageEnd);
    }

    if (records.length === 0) {
      html += `<div class="card">
        <div class="status" style="padding:20px">暂无预测记录。点击足球预测标签页查看比赛并进行预测。</div>
      </div>`;
    } else {
      pageRecords.forEach((record, idx) => {
        const statusMap = {
          'pending': { label: '等待自动同步', color: 'var(--muted)' },
          'ready': { label: '准备同步', color: 'var(--warn)' },
          'synced': { label: '已回填', color: 'var(--accent2)' },
          'retry': { label: '重试中', color: 'var(--warn)' },
          'failed': { label: '同步失败', color: 'var(--away)' },
          'ignored': { label: '已隐藏', color: 'var(--muted)' },
        };
        const status = statusMap[record.sync_status] || statusMap['pending'];
        
        const spfLabels = { H: '胜', D: '平', A: '负', home: '胜', draw: '平', away: '负', '胜': '胜', '平': '平', '负': '负' };
        const marketSummary = (probabilities, labels) => {
          const ranked = Object.entries(probabilities || {})
            .filter(([, probability]) => Number.isFinite(Number(probability)))
            .sort((a, b) => Number(b[1]) - Number(a[1]));
          if (!ranked.length) return { available: false, pick: '', detail: '' };
          return {
            available: true,
            pick: labels[ranked[0][0]] || ranked[0][0],
            detail: ranked.map(([key, probability]) =>
              `${esc(labels[key] || key)} ${(Number(probability) * 100).toFixed(1)}%`
            ).join(' · '),
          };
        };
        const spf = marketSummary(record.predicted_1x2, spfLabels);
        const rqspf = marketSummary(record.predicted_rqspf, {});
        const hasSpf = spf.available;
        const hasRqspf = rqspf.available;
        const lotteryUnverified = record.lottery_offer_matched === false;
        const handicap = record.lottery_handicap;
        const handicapText = handicap === null || handicap === undefined || handicap === ''
          ? '' : `（主队 ${Number(handicap) > 0 ? '+' : ''}${esc(handicap)}）`;
        const actualSpf = spfLabels[record.actual_result] || record.actual_result || '-';
        const marketVerificationNote = lotteryUnverified
          ? `<div style="margin-top:4px;color:var(--warn)">⚠ 竞彩玩法暂未核验，本条不展示未核验的模型赛果；数据源恢复后会自动重算。</div>`
          : (!hasSpf && !hasRqspf
            ? `<div style="margin-top:4px;color:var(--muted)">暂无可核验的竞彩胜平负玩法预测</div>`
            : '');
        
        html += `<div class="card" style="${idx > 0 ? 'margin-top:8px' : ''}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-weight:600;font-size:15px">${record.match_num ? `<span style="display:inline-block;margin-right:7px;padding:2px 6px;border-radius:5px;background:rgba(68,147,248,.14);color:#93c5fd;font-size:12px;vertical-align:1px">${esc(record.match_num)}</span>` : ''}${esc(record.home)} vs ${esc(record.away)}</div>
              <div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(record.league || '')} · ${esc(record.match_time || '')}</div>
            </div>
            <div style="text-align:right">
              <div style="color:${status.color};font-size:13px;font-weight:500">${status.label}</div>
              ${record.sync_attempts > 0 ? `<div style="color:var(--muted);font-size:11px">失败${record.sync_attempts}次</div>` : ''}
            </div>
          </div>`;
        
        if (record.settled) {
          // 已结算
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px">
            ${hasSpf ? `<div><span style="color:var(--muted)">胜平负预测：</span><b>${esc(spf.pick)}</b> · ${spf.detail} ${record.hit_1x2 === true ? '✅' : record.hit_1x2 === false ? '❌' : ''}</div>` : ''}
            ${hasRqspf ? `<div style="margin-top:4px"><span style="color:var(--muted)">让球胜平负${handicapText}预测：</span><b>${esc(rqspf.pick)}</b> · ${rqspf.detail} ${record.hit_rqspf === true ? '✅' : record.hit_rqspf === false ? '❌' : ''}</div>` : ''}
            ${marketVerificationNote}
            <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px">
            <div><span style="color:var(--muted)">赛后比分：</span><b style="color:var(--accent2)">${esc(record.actual_score || '-')}</b></div>
            <div><span style="color:var(--muted)">实际胜平负：</span>${esc(actualSpf)}</div>
            ${record.actual_rqspf ? `<div><span style="color:var(--muted)">实际让球赛果：</span>${esc(record.actual_rqspf)}</div>` : ''}
            </div>
          </div>`;
        } else if (record.sync_status === 'failed') {
          // 同步失败
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px">
            <div style="color:var(--away)">失败原因：${esc(record.last_sync_error || '未知')}</div>
            ${record.next_sync_at ? `<div style="color:var(--muted);margin-top:2px">下次重试：${record.next_sync_at?.replace('T', ' ').slice(0, 16) || '-'}</div>` : ''}
          </div>`;
        } else {
          // 待同步
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px">
            ${hasSpf ? `<div><span style="color:var(--muted)">胜平负预测：</span><b>${esc(spf.pick)}</b> · ${spf.detail}</div>` : ''}
            ${hasRqspf ? `<div style="margin-top:4px"><span style="color:var(--muted)">让球胜平负${handicapText}预测：</span><b>${esc(rqspf.pick)}</b> · ${rqspf.detail}</div>` : ''}
            ${marketVerificationNote}
            ${record.next_sync_at ? `<div style="color:var(--muted);margin-top:2px">预计同步：${record.next_sync_at?.replace('T', ' ').slice(0, 16) || '-'}</div>` : ''}
          </div>`;
        }
        
        html += `</div>`;
      });
      if (records.length > PREDICTIONS_PAGE_SIZE) {
        html += renderPredictionsPager(records.length, predictionsPage, totalPages, pageStart + 1, pageEnd);
      }
    }
    
    app.innerHTML = html;
    updateSyncStampAges(app);
    startSyncStampTimer();
  } catch (e) {
    app.innerHTML = `<div class="status error">加载失败：${esc(e.message)}</div>`;
  }
}

async function exportPredictionRecords() {
  let payload;
  if (predictionRecordType === 'beidan' && predictionExportData) {
    payload = predictionExportData;
  }
  try {
    if (!payload) {
      const data = await fetchJson('/api/predictions/export');
      if (!data.result) throw new Error(data.error || '导出接口未返回数据');
      payload = data.result;
    }
  } catch (error) {
    alert('导出失败：' + error.message);
    return;
  }
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  link.href = url;
  link.download = `${predictionRecordType === 'beidan' ? 'beidan' : 'football'}-predictions-${stamp}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function triggerBeidanSync(clickEvent) {
  const btn = clickEvent?.currentTarget;
  const originalText = btn?.textContent || '';
  if (btn) {
    btn.textContent = '同步中...';
    btn.disabled = true;
  }
  try {
    const data = await fetchJson('/api/beidan/sync', { method: 'POST' });
    if (!data.result) throw new Error(data.error || '未知错误');
    let job = data.result;
    while (job.running) {
      if (btn) {
        const processed = Number(job.processed || 0);
        const total = Number(job.total || 0);
        btn.textContent = total > 0 ? `同步中 ${processed}/${total}...` : '正在准备全量同步...';
      }
      await new Promise(resolve => setTimeout(resolve, 3000));
      const status = await fetchJson('/api/beidan/sync/status');
      if (!status.result) throw new Error(status.error || '无法获取同步进度');
      job = status.result;
    }
    alert(job.message || '北单同步完成');
    await loadPredictions();
  } catch (error) {
    alert('北单同步失败：' + error.message);
  } finally {
    if (btn) {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }
}

async function triggerSync() {
  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = '同步中...';
  btn.disabled = true;
  
  try {
    const data = await fetchJson('/api/sync/trigger');
    if (data.result) {
      alert(`同步完成：${data.result.message || '同步成功'}`);
      loadPredictions();
    } else {
      alert('同步失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('同步失败：' + e.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function runFootballReview(repair = false) {
  if (repair && !confirm('确定执行复盘修复吗？会重置提前回填，并把低可信样本排除出校准。')) return;

  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = repair ? '修复中...' : '复盘中...';
  btn.disabled = true;

  try {
    const data = await fetchJson(`/api/football/review?repair=${repair ? 1 : 0}`);
    if (!data.result) {
      alert('复盘失败：' + (data.error || '未知错误'));
      return;
    }

    const result = data.result || {};
    const audit = result.audit || {};
    const rolling = result.rolling || {};
    const tuning = result.tuning || {};
    const plan = tuning.plan || {};
    const sync = result.sync || {};
    const auditBreakdown = getFootballAuditBreakdown(audit);
    const message = [
      '复盘完成',
      `同步：${sync.message || '-'}`,
      `审计问题：${audit.issue_count || 0}`,
      ...(auditBreakdown.length ? [`问题明细：${auditBreakdown.join('、')}`] : []),
      `已修复：${audit.repaired_count || 0}`,
      `可用样本：${rolling.available_samples || 0}`,
      `调参预案：${plan.reason || tuning.error || '暂无'}`
    ].join('\n');

    alert(message);
    loadPredictions();
  } catch (e) {
    alert('复盘失败：' + e.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function hideFailedRecords() {
  if (!confirm('确定要隐藏所有失败记录吗？')) return;
  
  try {
    const data = await fetchJson('/api/sync/hide_failed');
    if (data.result?.success) {
      alert('已隐藏所有失败记录');
      loadPredictions();
    } else {
      alert('操作失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('操作失败：' + e.message);
  }
}

initPage();

/* ===== 深度报告弹窗 ===== */
function openBayesModal(url, title) {
  let backdrop = document.getElementById('bayes-modal-backdrop');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'bayes-modal-backdrop';
    backdrop.className = 'bayes-modal-backdrop';
    backdrop.innerHTML =
      '<div class="bayes-modal">' +
        '<div class="bayes-modal-header">' +
          '<div class="bayes-modal-title" id="bayes-modal-title">📊 深度报告</div>' +
          '<button class="bayes-modal-close" onclick="closeBayesModal()" title="关闭">×</button>' +
        '</div>' +
        '<iframe class="bayes-modal-iframe" id="bayes-modal-iframe" ' +
          'sandbox="allow-same-origin allow-scripts" referrerpolicy="no-referrer"></iframe>' +
      '</div>';
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeBayesModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBayesModal(); });
  }
  document.getElementById('bayes-modal-title').innerHTML =
    '📊 深度报告 <small>' + esc(title || '') + '</small>';
  const iframe = document.getElementById('bayes-modal-iframe');
  iframe.src = url;
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeBayesModal() {
  const backdrop = document.getElementById('bayes-modal-backdrop');
  if (!backdrop) return;
  backdrop.classList.remove('open');
  const iframe = document.getElementById('bayes-modal-iframe');
  if (iframe) iframe.src = 'about:blank';
  document.body.style.overflow = '';
}
