  basketballSearchFilter = el.value;

}

function fmtPctValue(value) {
  return typeof value === 'number' && Number.isFinite(value) ? `${(value * 100).toFixed(1)}%` : '-';
}

function fmtNumValue(value, digits = 3) {
  return typeof value === 'number' && Number.isFinite(value) ? value.toFixed(digits) : '-';
}

let syncStampTimer = null;

function formatSyncStamp(value) {
  if (!value) {
    return { text: '尚未同步', detail: '点击下方按钮执行一次同步', state: 'missing' };
  }
  const normalized = String(value).replace(' ', 'T');
  const date = new Date(normalized);
  const display = String(value).replace('T', ' ').slice(0, 19);
  if (Number.isNaN(date.getTime())) {
    return { text: display || '-', detail: '时间格式异常', state: 'stale' };
  }
  const diffMs = Date.now() - date.getTime();
  const absMs = Math.abs(diffMs);
  const minutes = Math.floor(absMs / 60000);
  let age = '刚刚';
  if (minutes >= 1440) age = `${Math.floor(minutes / 1440)} 天前`;
  else if (minutes >= 60) age = `${Math.floor(minutes / 60)} 小时前`;
  else if (minutes >= 1) age = `${minutes} 分钟前`;
  const state = diffMs > 24 * 60 * 60 * 1000 ? 'stale' : '';
  return { text: age, detail: display, state };
}

function updateSyncStampAges(root = document) {
  root.querySelectorAll('[data-sync-at]').forEach(el => {
    const stamp = formatSyncStamp(el.dataset.syncAt);
    const textEl = el.querySelector('[data-sync-age]');
    const detailEl = el.querySelector('[data-sync-detail]');
    if (textEl) textEl.textContent = stamp.text;
    if (detailEl) detailEl.textContent = stamp.detail;
    el.classList.toggle('stale', stamp.state === 'stale');
    el.classList.toggle('missing', stamp.state === 'missing');
  });
}

function startSyncStampTimer() {
  if (syncStampTimer) clearInterval(syncStampTimer);
  syncStampTimer = setInterval(() => updateSyncStampAges(), 60000);
}

function getFootballAuditBreakdown(audit = {}) {
  const labels = {
    future_settlement: '提前回填',
    implausible_actual_score: '比分不合理',
    invalid_actual_score: '比分格式错误',
    missing_result_quality: '缺少赛果质量标记',
    result_quality_reject: '赛果来源不合格',
    result_quality_low: '赛果可信度低',
    invalid_half_time_data: '半场比分无效',
    zero_calibration_weight: '校准权重为 0',
  };
  return Object.entries(audit.issue_counts || {})
    .filter(([, count]) => Number(count) > 0)
    .sort((a, b) => Number(b[1]) - Number(a[1]))
    .map(([code, count]) => `${labels[code] || code} ${count} 项`);
}

  const suggestions = diagnostics.diagnostic_suggestions?.suggestions || [];
  const deltas = diagnostics.diagnostic_suggestions?.param_deltas || {};

  const auditBreakdownHtml = auditBreakdown.length
    ? `<div class="diag-line" style="color:var(--warn)">${auditBreakdown.map(esc).join(' · ')}</div>`

    const pageRecords = records.slice(pageStart, pageStart + PREDICTIONS_PAGE_SIZE);
    const pageEnd = pageStart + pageRecords.length;
    if (records.length > PREDICTIONS_PAGE_SIZE) {
      html += renderPredictionsPager(records.length, predictionsPage, totalPages, pageStart + 1, pageEnd);
    }

    if (records.length === 0) {
      html += `<div class="card">
        <div class="status" style="padding:20px">暂无预测记录。点击足球预测标签页查看比赛并进行预测。</div>
      </div>`;
    } else {
      pageRecords.forEach((record, idx) => {
        const statusMap = {
          'pending': { label: '等待自动同步', color: 'var(--muted)' },
          'ready': { label: '准备同步', color: 'var(--warn)' },
          'synced': { label: '已回填', color: 'var(--accent2)' },
          'retry': { label: '重试中', color: 'var(--warn)' },
          'failed': { label: '同步失败', color: 'var(--away)' },
          'ignored': { label: '已隐藏', color: 'var(--muted)' },
        };
        const status = statusMap[record.sync_status] || statusMap['pending'];
        
        // 精确比分单点概率天然集中在常见低比分，同时展示Top3和进球数分布，
        // 避免把1-1这个众数误读为模型只分析了1-1。
        const predictedScores = record.predicted_scores || {};
        const rankedScores = Object.entries(predictedScores).sort((a, b) => b[1] - a[1]);
        const topScore = rankedScores[0];
        const topScoreStr = topScore ? `${topScore[0]} (${(topScore[1] * 100).toFixed(1)}%)` : '-';
        const top3ScoreStr = rankedScores.slice(0, 3)
          .map(([score, probability]) => `${esc(score)} ${(Number(probability) * 100).toFixed(1)}%`)
          .join(' · ') || '-';
        const goalDistribution = {};
        rankedScores.forEach(([score, probability]) => {
          const parts = String(score).split('-').map(Number);
          if (parts.length !== 2 || parts.some(Number.isNaN)) return;
          const goals = parts[0] + parts[1];
          goalDistribution[goals] = (goalDistribution[goals] || 0) + Number(probability || 0);
        });
        const topGoals = Object.entries(goalDistribution).sort((a,b) => b[1] - a[1]).slice(0,3);
        const topGoalsStr = topGoals.map(([goals, probability]) =>
          `${goals}球 ${(Number(probability) * 100).toFixed(1)}%`
        ).join(' · ') || '-';
        const capturedGoalMass = Object.values(goalDistribution).reduce((sum, probability) => sum + Number(probability), 0);
        const expectedGoalsRaw = Object.entries(goalDistribution).reduce(
          (sum,[goals, probability]) => sum + Number(goals) * Number(probability), 0
        );
        const expectedGoals = capturedGoalMass > 0 ? expectedGoalsRaw / capturedGoalMass : 0;
        const actualRank = record.actual_score
          ? rankedScores.findIndex(([score]) => score === record.actual_score) + 1
          : 0;
        const actualProbability = record.actual_score ? Number(predictedScores[record.actual_score] || 0) : 0;
        
        html += `<div class="card" style="${idx > 0 ? 'margin-top:8px' : ''}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-weight:600;font-size:15px">${esc(record.home)} vs ${esc(record.away)}</div>
              <div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(record.league || '')} · ${esc(record.match_time || '')}</div>
            </div>
            <div style="text-align:right">
              <div style="color:${status.color};font-size:13px;font-weight:500">${status.label}</div>
              ${record.sync_attempts > 0 ? `<div style="color:var(--muted);font-size:11px">失败${record.sync_attempts}次</div>` : ''}
            </div>
          </div>`;
        
        if (record.settled) {
          // 已结算
          const hitTop1 = record.hit_top1 ? '✅' : '❌';
          const hitTop3 = record.hit_top3 ? '✅' : '❌';
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px">
            <div><span style="color:var(--muted)">精确比分Top3：</span>${top3ScoreStr}</div>
            <div style="margin-top:4px"><span style="color:var(--muted)">进球数Top3：</span>${topGoalsStr}${expectedGoals ? ` · 期望 ${expectedGoals.toFixed(2)}球` : ''}</div>
            <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:4px">
            <div><span style="color:var(--muted)">实际：</span><b style="color:var(--accent2)">${esc(record.actual_score || '-')}</b></div>
            <div><span style="color:var(--muted)">实际比分模型位置：</span>${actualRank > 0 ? `第${actualRank}位 / ${actualProbability > 0 ? (actualProbability * 100).toFixed(2) + '%' : '极低概率'}` : '未进入候选范围'}</div>
            <div><span style="color:var(--muted)">Top1：</span>${hitTop1}</div>
            <div><span style="color:var(--muted)">Top3：</span>${hitTop3}</div>
            </div>
          </div>`;
        } else if (record.sync_status === 'failed') {
          // 同步失败
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px">
            <div style="color:var(--away)">失败原因：${esc(record.last_sync_error || '未知')}</div>
            ${record.next_sync_at ? `<div style="color:var(--muted);margin-top:2px">下次重试：${record.next_sync_at?.replace('T', ' ').slice(0, 16) || '-'}</div>` : ''}
          </div>`;
        } else {
          // 待同步
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px">
            <div><span style="color:var(--muted)">精确比分Top3：</span>${top3ScoreStr}</div>
            <div style="margin-top:4px"><span style="color:var(--muted)">进球数Top3：</span>${topGoalsStr}${expectedGoals ? ` · 期望 ${expectedGoals.toFixed(2)}球` : ''}</div>
            ${record.next_sync_at ? `<div style="color:var(--muted);margin-top:2px">预计同步：${record.next_sync_at?.replace('T', ' ').slice(0, 16) || '-'}</div>` : ''}
          </div>`;
        }
        
        html += `</div>`;
      });
      if (records.length > PREDICTIONS_PAGE_SIZE) {
        html += renderPredictionsPager(records.length, predictionsPage, totalPages, pageStart + 1, pageEnd);
      }
    }
    
    app.innerHTML = html;
    updateSyncStampAges(app);
    startSyncStampTimer();
  } catch (e) {
    app.innerHTML = `<div class="status error">加载失败：${esc(e.message)}</div>`;
  }
}

async function exportPredictionRecords() {
  let payload;
  try {
    const data = await fetchJson('/api/predictions/export');
    if (!data.result) throw new Error(data.error || '导出接口未返回数据');
    payload = data.result;
  } catch (error) {
    alert('导出失败：' + error.message);
    return;
  }
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  link.href = url;
  link.download = `football-predictions-${stamp}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function triggerSync() {
  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = '同步中...';
  btn.disabled = true;
  
  try {
    const data = await fetchJson('/api/sync/trigger');
    if (data.result) {
      alert(`同步完成：${data.result.message || '同步成功'}`);
      loadPredictions();
    } else {
      alert('同步失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('同步失败：' + e.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function runFootballReview(repair = false) {
  if (repair && !confirm('确定执行复盘修复吗？会重置提前回填，并把低可信样本排除出校准。')) return;

  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = repair ? '修复中...' : '复盘中...';
  btn.disabled = true;

  try {
    const data = await fetchJson(`/api/football/review?repair=${repair ? 1 : 0}`);
    if (!data.result) {
      alert('复盘失败：' + (data.error || '未知错误'));
      return;
    }

    const result = data.result || {};
    const audit = result.audit || {};
    const rolling = result.rolling || {};
    const tuning = result.tuning || {};
    const plan = tuning.plan || {};
    const sync = result.sync || {};
    const auditBreakdown = getFootballAuditBreakdown(audit);
    const message = [
      '复盘完成',
      `同步：${sync.message || '-'}`,
      `审计问题：${audit.issue_count || 0}`,
      ...(auditBreakdown.length ? [`问题明细：${auditBreakdown.join('、')}`] : []),
      `已修复：${audit.repaired_count || 0}`,
      `可用样本：${rolling.available_samples || 0}`,
      `调参预案：${plan.reason || tuning.error || '暂无'}`
    ].join('\n');

    alert(message);
    loadPredictions();
  } catch (e) {
    alert('复盘失败：' + e.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function hideFailedRecords() {
  if (!confirm('确定要隐藏所有失败记录吗？')) return;
  
  try {
    const data = await fetchJson('/api/sync/hide_failed');
    if (data.result?.success) {
      alert('已隐藏所有失败记录');
      loadPredictions();
    } else {
      alert('操作失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('操作失败：' + e.message);
  }
}

initPage();

/* ===== 深度报告弹窗 ===== */
function openBayesModal(url, title) {
  let backdrop = document.getElementById('bayes-modal-backdrop');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'bayes-modal-backdrop';
    backdrop.className = 'bayes-modal-backdrop';
    backdrop.innerHTML =
      '<div class="bayes-modal">' +
        '<div class="bayes-modal-header">' +
          '<div class="bayes-modal-title" id="bayes-modal-title">📊 深度报告</div>' +
          '<button class="bayes-modal-close" onclick="closeBayesModal()" title="关闭">×</button>' +
        '</div>' +
        '<iframe class="bayes-modal-iframe" id="bayes-modal-iframe" ' +
          'sandbox="allow-same-origin allow-scripts" referrerpolicy="no-referrer"></iframe>' +
      '</div>';
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeBayesModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBayesModal(); });
  }
  document.getElementById('bayes-modal-title').innerHTML =
    '📊 深度报告 <small>' + esc(title || '') + '</small>';
  const iframe = document.getElementById('bayes-modal-iframe');
  iframe.src = url;
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeBayesModal() {
  const backdrop = document.getElementById('bayes-modal-backdrop');
  if (!backdrop) return;
  backdrop.classList.remove('open');
  const iframe = document.getElementById('bayes-modal-iframe');
  if (iframe) iframe.src = 'about:blank';
  document.body.style.overflow = '';
}
