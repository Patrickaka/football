  html += renderKL8PerformanceSummary(r.statistics?.recent_settlement_performance);

  // ── 状态1：历史补数中 ──
  if (isBackfilling) {
    html += `<section class="kl8-state-card backfill">`;
    html += `<div class="kl8-state-title">📥 历史样本补充中</div>`;
    html += `<div class="kl8-state-value">${esc(currentPeriods)} / ${esc(targetPeriods)} <small>期</small></div>`;
    html += `<div class="kl8-progress-track"><div class="kl8-progress-bar" style="width:${esc(progressPct)}%"></div></div>`;
    html += `<div class="kl8-state-copy">已完成 ${esc(progressPct)}% · 系统每10分钟自动补充一批历史数据，达到 ${esc(targetPeriods)} 期后自动开始策略验证。</div>`;
    html += `</section>`;
  }

  // ── 状态2：验证中（历史已满800期，但尚无通过验证的策略）───
  if (!isBackfilling && (signalStatus === 'verification_pending' || signalStatus === 'unknown')) {
    // 检查是否有任何玩法已验证
    const allModes = selectTypes.map(st => r[`select_${st}`]?.prediction_mode);
    for (const f of fushiTypes) allModes.push(r[f.key]?.prediction_mode);
    const anyValidated = allModes.some(m => m === 'validated');

    if (!anyValidated) {
      // 检查是否全部都未发现可验证策略（所有候选均未通过）
      const allNotVerified = allModes.every(m => m === 'not_verified' || m === undefined);
      const anyWarning = selectTypes.some(st => r[`select_${st}`]?.warning) || fushiTypes.some(f => r[f.key]?.warning);

      if (allNotVerified && anyWarning) {
        // 验证失败状态
        html += `<section class="kl8-state-card failed">`;
        html += `<div class="kl8-state-title">未发现可验证策略</div>`;
        html += `<div class="kl8-state-copy">当前候选均未超过随机基线 · 历史数据 ${esc(currentPeriods)} / ${esc(targetPeriods)} 期 · 本玩法不输出号码。</div>`;
        html += `</section>`;
      } else {
        // 验证中状态
        html += `<section class="kl8-state-card verifying">`;
        html += `<div class="kl8-state-title">⏳ 策略验证中</div>`;
        html += `<div class="kl8-state-copy">历史数据已达到 ${esc(currentPeriods)} 期，正在运行训练、验证与封存测试。当前暂无通过验证的推荐策略。</div>`;
        html += `</section>`;
      }
    }
  }

  // ── 状态3：已验证（至少一个玩法有validated策略）───
  if (signalStatus === 'validated') {
    html += `<section class="kl8-state-card" style="--state-accent:#42d392"><div class="kl8-state-title">✓ 策略验证通过</div><div class="kl8-state-copy">当前启用策略已通过严格回测验证。</div></section>`;
  }

  // 最近开奖结果（始终显示）
  if (r.recent_results && r.recent_results.length > 0) {
    const isMobile = window.innerWidth <= 768;
    const showCount = isMobile ? 3 : 5;
    html += `<section class="card kl8-panel kl8-recent-panel">`;
    html += `<div class="kl8-panel-head"><div><div class="kl8-panel-kicker">Draw history</div><h3>最近开奖结果</h3></div><span class="kl8-panel-count">近 ${esc(showCount)} 期</span></div>`;
    for (const rec of r.recent_results.slice(0, showCount)) {
      const isLatestDraw = String(rec.issue) === String(basedOnIssue);
      html += `<div class="draw-row kl8-draw-row ${isLatestDraw ? 'is-latest' : ''}">`;
      html += `<span class="draw-issue">${esc(rec.issue)}</span>`;
      html += `<span class="draw-numbers kl8-draw-balls" style="font-size:13px;letter-spacing:1px;gap:4px">`;
      const nums = rec.numbers || [];
      const lastSet = new Set(r.statistics?.last_numbers || []);
      for (const n of nums) {
        const isHighlight = lastSet.has(n);
        html += `<span class="kl8-ball small-ball ${isHighlight ? 'highlight-ball' : ''}" style="width:26px;height:26px;font-size:10px;display:inline-flex">${String(n).padStart(2,'0')}</span>`;
      }
      html += `</span>`;
      html += `<span class="draw-date">${esc(rec.date)}</span>`;
      html += `</div>`;
    }
    html += `</section>`;
  }

  // ── 本期变化对比信息（仅在有已验证策略时显示）───
  const changeInfo = r.change_info || {};
  if (changeInfo.has_previous && signalStatus === 'validated') {
    html += `<div class="card kl8-panel" style="padding:12px 15px;border-left:3px solid #63a4ff">`;
    html += `<div style="font-size:13px;font-weight:600;margin-bottom:6px;color:#4493f8">📊 本期相较上期变化</div>`;
    html += `<div style="font-size:11px;color:#8b949e;margin-bottom:8px">`;
    html += `本期基准: ${esc(changeInfo.current_based_on)} · 上期基准: ${esc(changeInfo.previous_based_on)}`;
    html += `</div>`;
    const poolChanges = changeInfo.pool_changes || {};
    if (poolChanges.changed === 0) {
      html += `<div style="font-size:12px;color:#8b949e;margin-bottom:6px">候选池延续：当前数据更新后，前20排名未发生变化</div>`;
    } else {
      html += `<div style="font-size:12px;margin-bottom:6px">`;
      html += `<span style="color:#4493f8">候选池变化</span>: `;
      html += `<span style="color:#da3633;font-weight:600">${poolChanges.changed}</span>`;
      html += ` / <span style="color:#8b949e">${poolChanges.total_pool_size}</span>`;
      html += ` 号号替换`;
      html += `</div>`;
    }
    const playChanges = changeInfo.play_changes || {};
    for (const st of selectTypes) {
      const key = `select_${st}`;
      const pc = playChanges[key];
      if (!pc || pc.changed_count === 0) continue;
      html += `<div style="font-size:11px;margin-bottom:4px">`;
      html += `<span style="color:#4493f8">选${st}</span>: `;
      if (pc.removed && pc.removed.length > 0) {
        html += `<span style="color:#da3633">-${pc.removed.map(n=>String(n).padStart(2,'0')).join(',')}</span> `;
      }
      if (pc.added && pc.added.length > 0) {
        html += `<span style="color:#2ea043">+${pc.added.map(n=>String(n).padStart(2,'0')).join(',')}</span>`;
      }
      html += `</div>`;
    }
    for (const f of fushiTypes) {
      const fpc = playChanges[f.key];
      if (fpc && fpc.changed_count > 0) {
        html += `<div style="font-size:11px;margin-bottom:4px">`;
        html += `<span style="color:#4493f8">${esc(f.label)}</span>: `;
        if (fpc.removed && fpc.removed.length > 0) {
          html += `<span style="color:#da3633">-${fpc.removed.map(n=>String(n).padStart(2,'0')).join(',')}</span> `;
        }
        if (fpc.added && fpc.added.length > 0) {
          html += `<span style="color:#2ea043">+${fpc.added.map(n=>String(n).padStart(2,'0')).join(',')}</span>`;
        }
        html += `</div>`;
      }
    }
    html += `<div style="font-size:11px;color:#8b949e;margin-top:4px">变化原因: ${esc(changeInfo.change_reason || '数据更新')}</div>`;
    html += `<div style="font-size:11px;margin-top:4px">置信等级: <span style="font-weight:600;color:${changeInfo.confidence_level==='低'?'#9a6700':'#2ea043'}">${esc(changeInfo.confidence_level || '低')}</span> · 策略状态: ${esc(changeInfo.strategy_status || '验证中')}</div>`;
    html += `</div>`;
  }

  // 候选池（仅在有已验证策略时显示）
  if (signalStatus === 'validated') {
    const candidatePlays = [
      { key: 'select_5', label: '选5' },
      { key: 'select_6', label: '选6' },
      { key: 'select_10', label: '选10' },
    ].filter(item => r[item.key]?.candidates?.length > 0);

    if (candidatePlays.length > 0) {
      html += `<div class="card kl8-panel" style="padding:14px 16px">`;
      html += `<div style="font-size:13px;font-weight:600;margin-bottom:8px">候选号码池 <span style="font-size:11px;color:#8b949e">(按玩法独立展示)</span></div>`;
      html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">`;
      for (const play of candidatePlays) {
        const selectedSet = new Set(r[play.key]?.numbers || []);
        html += `<div style="padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card2)">`;
        html += `<div style="font-size:12px;font-weight:700;margin-bottom:6px">${esc(play.label)} Top15</div>`;
        html += `<div style="display:flex;flex-wrap:wrap;gap:4px;line-height:1.6">`;
        for (const item of r[play.key].candidates.slice(0, 15)) {
          const num = typeof item === 'object' ? item[0] : item;
          if (selectedSet.has(num)) {
            html += `<span class="kl8-ball highlight-ball" style="width:28px;height:28px;font-size:11px">${String(num).padStart(2,'0')}</span> `;
          } else {
            html += `<span class="kl8-ball small-ball">${String(num).padStart(2,'0')}</span> `;
          }
        }
        html += `</div></div>`;
      }
      html += `</div>`;
      html += `<div style="font-size:11px;color:var(--muted);margin-top:6px">高亮球为该玩法最终推荐号。</div>`;
      html += `</div>`;
    }
  }

  // 各玩法推荐号码 — v9.2: verification_pending状态不显示号码
  const hasAnyNumbers = selectTypes.some(st => {
    const sel = r[`select_${st}`];
    return sel && sel.numbers && sel.numbers.length > 0;
  });

  if (hasAnyNumbers) {
    html += `<section class="card kl8-panel kl8-picks-panel">`;
    html += `<div class="kl8-panel-head"><div><div class="kl8-panel-kicker">Number selections</div><h3>本期统计参考号码</h3></div><span class="kl8-panel-count">固定策略输出</span></div>`;
    html += `<div class="kl8-picks-grid">`;

    for (const st of selectTypes) {
      const key = `select_${st}`;
      const sel = r[key];
      if (!sel || !sel.numbers || sel.numbers.length === 0) continue;

      const isRef = sel.prediction_mode === 'reference_unvalidated';
      const isCoverage = sel.baseline_type === 'fair_deterministic_coverage';
      const borderColor = isRef ? '#f6bd55' : '#42d392';
      const badgeText = isCoverage ? '公平覆盖' : (isRef ? '参考' : '已验证');

      // 主推号码：每个玩法只输出一组。
      const kl8MinWin = { 3: 3, 4: 4, 5: 3, 6: 4, 7: 4, 8: 4, 9: 4, 10: 5 };
      const winTh = kl8MinWin[st] || st;
      html += `<article class="kl8-select-card" style="--kl8-card-accent:${borderColor}">`;
      html += `<div class="kl8-select-head"><div class="kl8-select-title"><strong>${esc(sel.desc)}</strong> · 主推 ${esc(sel.numbers.length)} 码</div><span class="kl8-mode-badge">${esc(badgeText)}</span></div>`;
      html += `<div class="kl8-strategy-line" title="${esc(sel.strategy_id || '')}">strategy / ${esc(sel.strategy_id || '-')}</div>`;
      if (sel.strategy_evidence) {
        const ev = sel.strategy_evidence;
        html += `<div class="kl8-inline-warning">单号弱信号：${(Number(ev.empirical_next_hit_rate || 0) * 100).toFixed(2)}% vs 随机 ${(Number(ev.random_baseline || 0) * 100).toFixed(2)}% · 未通过显著性验证</div>`;
      }
      html += `<div class="kl8-numbers-row">`;
      const playChangeInfo = (changeInfo.play_changes || {})[key];
      const addedSet = new Set(playChangeInfo ? playChangeInfo.added : []);
      for (const n of sel.numbers) {
        if (addedSet.has(n)) {
          html += `<span class="kl8-ball highlight-ball" style="border:2px solid #2ea043;box-shadow:0 0 3px #2ea043">${String(n).padStart(2,'0')}</span>`;
        } else {
          html += `<span class="kl8-ball highlight-ball">${String(n).padStart(2,'0')}</span>`;
        }
      }
      html += `</div>`;
      const kl8WR = (kl8HypergeomPGe(st, winTh) * 100).toFixed(1);          // 单注参考率
      html += `<div class="kl8-probability-line">中${esc(winTh)}+ 约 <b style="color:${kl8WR >= 15 ? '#42d392' : '#f6bd55'}">${esc(kl8WR)}%</b>/期 · 期望中 ${esc((sel.numbers.length * 0.25).toFixed(2))} 个</div>`;
      html += renderKL8ShapeProfile(sel.shape_profile, sel.numbers);
      if (sel.repeat_profile) {
        const actualRepeats = sel.numbers.filter(n => (r.statistics?.last_numbers || []).includes(n)).length;
        const repeatRule = sel.repeat_profile.constraint_applied
          ? ` · 策略约束至少 ${esc(sel.repeat_profile.configured_minimum || 0)} 个`
          : ' · 仅统计观察，不强制换入重号';
        html += `<div class="kl8-inline-note">重号结构：本组 ${esc(actualRepeats)} 个 · 近${esc(sel.repeat_profile.sample_size || 0)}期相邻开奖平均 ${esc(sel.repeat_profile.mean_draw_overlap || 0)} 个${repeatRule}</div>`;
      }
      html += renderKL8AccuracyProfile(sel.accuracy_profile);
      if (isRef && sel.warning) {
        html += `<div class="kl8-inline-warning">⚠ ${esc(sel.warning)}</div>`;
      }
      html += `</article>`;
    }
    html += `</div></section>`;
  }

  // 复式玩法 — 仅在有号码时显示
  for (const f of fushiTypes) {
    const fushi = r[f.key];
    const coreNumbers = fushi ? (fushi[f.field] || fushi.core_numbers || []) : [];
    if (!fushi || coreNumbers.length === 0) continue;

    const isRef = fushi.prediction_mode === 'reference_unvalidated';
    const isCoverage = fushi.baseline_type === 'fair_deterministic_coverage';
    const border = isRef ? '#f6bd55' : '#42d392';
    const badge = isCoverage ? '公平覆盖' : (isRef ? '参考' : '已验证');
    const comboPick = fushi.combo_pick || (f.key === 'fu_shi_10_11' ? 10 : 5);
    const poolSize = fushi.pool_size || coreNumbers.length;

    html += `<section class="card kl8-panel kl8-fushi-card" style="--kl8-card-accent:${border}">`;
    html += `<div class="kl8-fushi-header"><span>${esc(f.label)}</span><span class="kl8-mode-badge">${esc(badge)} · ${esc(fushi.total_combinations)} 组</span></div>`;
    if (fushi.strategy_id) {
      html += `<div class="kl8-strategy-line" title="${esc(fushi.strategy_id)}">strategy / ${esc(fushi.strategy_id)}</div>`;
    }
    const fushiBasePick = f.comboPick || f.basePick || (f.key === 'fu_shi_10_11' ? 10 : 5);
    const fushiWinTh = fushiBasePick <= 4 ? 2 : (fushiBasePick <= 7 ? 3 : 5);
    const fushiExpWins = (fushi.total_combinations * kl8HypergeomPGe(fushiBasePick, fushiWinTh)).toFixed(1);
    html += `<div class="kl8-fushi-summary">${esc(f.coreLabel)} · 每注中奖门槛中 ${esc(fushiWinTh)} 个 · 期望中奖注数约 <b style="color:#42d392">${esc(fushiExpWins)}</b> 注（共 ${esc(fushi.total_combinations)} 注）</div>`;
    html += `<div class="kl8-fushi-top7">`;
    for (const n of coreNumbers) {
      html += `<span class="kl8-ball highlight-ball" style="width:44px;height:44px;font-size:18px">${String(n).padStart(2,'0')}</span>`;
    }
    html += `</div>`;
    html += renderKL8ShapeProfile(fushi.shape_profile, coreNumbers);
    if (isRef && fushi.warning) {
      html += `<div class="kl8-inline-warning">⚠ ${esc(fushi.warning)}</div>`;
    }
    html += `</section>`;
  }

  // 号码排名Top20（仅在有已验证策略时显示）
  if (signalStatus === 'validated' && r.ranking && r.ranking.length > 0) {
    html += `<section class="card kl8-panel">`;
    html += `<div class="kl8-panel-head"><div><div class="kl8-panel-kicker">Heuristic ranking</div><h3>号码排名 Top20</h3></div><span class="kl8-panel-count">非开出概率</span></div>`;
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px">`;
    for (const item of r.ranking) {
      const rankingScore = item.ranking_score?.toFixed(3) || item.score?.toFixed(3) || '0';
      html += `<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--card);border-radius:6px;font-size:13px">`;
      html += `<span class="kl8-ball" style="width:28px;height:28px;font-size:11px">${String(item.num).padStart(2,'0')}</span>`;
      html += `<span style="color:var(--muted)">排序: ${rankingScore}</span>`;
      html += `</div>`;
    }
    html += `</div>`;
    html += `</section>`;
  }

  // 刷新按钮
  html += `<div id="kl8-parameter-search-result"></div>`;
  html += `<section class="kl8-action-dock">`;
  html += `<div class="kl8-action-copy"><strong>数据与策略工具</strong><span>所有原有操作保持不变</span></div>`;
  html += `<div class="kl8-action-buttons">`;
  html += `<button type="button" class="kl8-refresh-btn" onclick="refreshKL8()">↻ 重新计算</button>`;
  html += `<button type="button" class="kl8-refresh-btn action-warn" onclick="openKL8ExcludeModal()">⊖ 剔除号码重算</button>`;
  html += `<button type="button" class="kl8-refresh-btn action-danger" onclick="openKL8KillModal()">⌫ 杀号计算</button>`;
  html += `<button type="button" class="kl8-refresh-btn action-info" onclick="fetchKL8Data()">↻ 抓取最新开奖</button>`;
  html += `<button type="button" class="kl8-refresh-btn action-success" onclick="openKL8RecordsModal()">▦ 预测记录</button>`;
  html += `</div></section>`;
  html += `</div>`;
  html += `<div id="kl8-exclude-modal"></div>`;
  html += `<div id="kl8-records-modal"></div>`;

  appKL8.innerHTML = html;
}

function getKL8ExcludeOptions() {
  const r = kl8LastData || {};
  const statistics = r.statistics || {};
  const snapshotFile = String(r.snapshot_file || '').split(/[\\/]/).pop();
  const sourceContext = {
    sourceSnapshotId: snapshotFile.replace(/^snapshot_/, '').replace(/\.json$/, ''),
    sourceVersion: statistics.version || r.version || '',
    sourceTargetIssue: statistics.target_issue || r.target_issue || '',
    sourceBasedOnIssue: statistics.based_on_issue || r.based_on_issue || '',
    sourceConfigFingerprint: r.strategy_config_fingerprint || statistics.strategy_config_fingerprint || '',
  };
  return [
    { ...sourceContext, key: 'select_5', label: '选5', numbers: r.select_5?.numbers || [], resultField: 'numbers' },
    { ...sourceContext, key: 'select_6', label: '选6', numbers: r.select_6?.numbers || [], resultField: 'numbers' },
    { ...sourceContext, key: 'select_10', label: '选10', numbers: r.select_10?.numbers || [], resultField: 'numbers' },
    {
      ...sourceContext,
      key: 'fu_shi_7',
      label: '选5复式7码',
      numbers: r.fu_shi_7?.top7_numbers || r.fu_shi_7?.core_numbers || [],
      // 7码复式由选6主号顺序补1码而来；后续杀号必须只累计选6的6个
      // 主号，否则补充号会被多杀一次，下一轮就会与选6轨迹分叉。
      recalculationNumbers: r.fu_shi_7?.select_6_numbers || r.select_6?.numbers || [],
      resultField: 'top7_numbers',
    },
  ].filter(item => item.numbers && item.numbers.length > 0);
}

function buildKL8SourceContextQuery(option) {
  return '&source_snapshot_id=' + encodeURIComponent(option.sourceSnapshotId || '')
    + '&source_version=' + encodeURIComponent(option.sourceVersion || '')
    + '&source_target_issue=' + encodeURIComponent(option.sourceTargetIssue || '')
    + '&source_based_on_issue=' + encodeURIComponent(option.sourceBasedOnIssue || '')
    + '&source_config_fingerprint=' + encodeURIComponent(option.sourceConfigFingerprint || '');
}

function renderPredictionsPager(total, page, totalPages, start, end) {
  const prevDisabled = page <= 1;
  const nextDisabled = page >= totalPages;
  const pageButtons = [];
  const from = Math.max(1, page - 2);
  const to = Math.min(totalPages, page + 2);
  for (let p = from; p <= to; p++) {
    const active = p === page;
    pageButtons.push(`<button type="button" onclick="setPredictionsPage(${p})" style="padding:6px 10px;border:1px solid ${active ? 'var(--accent2)' : 'var(--line)'};background:${active ? 'var(--accent2)' : 'var(--card2)'};color:${active ? '#fff' : 'var(--text)'};border-radius:6px;cursor:pointer">${p}</button>`);
  }

  return `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0;padding:10px 12px">
    <div style="font-size:12px;color:var(--muted)">显示 ${esc(start)}-${esc(end)} / ${esc(total)} 条 · 第 ${esc(page)} / ${esc(totalPages)} 页</div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <button type="button" onclick="setPredictionsPage(${page - 1})" ${prevDisabled ? 'disabled' : ''} style="padding:6px 10px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:6px;cursor:${prevDisabled ? 'not-allowed' : 'pointer'};opacity:${prevDisabled ? '.5' : '1'}">上一页</button>
      ${pageButtons.join('')}
      <button type="button" onclick="setPredictionsPage(${page + 1})" ${nextDisabled ? 'disabled' : ''} style="padding:6px 10px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:6px;cursor:${nextDisabled ? 'not-allowed' : 'pointer'};opacity:${nextDisabled ? '.5' : '1'}">下一页</button>
    </div>
  </div>`;
}

function setPredictionsPage(page) {
  predictionsPage = Math.max(1, Number(page) || 1);
  loadPredictions().then(() => {
    document.getElementById('app-predictions')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function renderKL8Balls(numbers, size = 36) {
  return (numbers || []).map(n =>
    `<span class="kl8-ball highlight-ball" style="width:${size}px;height:${size}px;font-size:${size >= 40 ? 16 : 13}px">${String(n).padStart(2,'0')}</span>`
  ).join('');
}

function renderKL8AccuracyProfile(profile) {
  if (!profile || typeof profile !== 'object') return '';
  const expected = Number(profile.expected_hits_random || 0).toFixed(2);
  const zero = pct(Number(profile.zero_hit_probability_random || 0));
  const probs = profile.theoretical_probabilities || {};
  const keys = Array.isArray(profile.key_thresholds) ? profile.key_thresholds : [];
  const keyText = keys.map(k => `${esc(k)} ${pct(Number(probs[k] || 0))}`).join(' | ');
  const targetText = profile.target_hits
    ? ` | target ${esc(profile.target_hits)} hit=${pct(Number(profile.target_probability_random || 0))}`
    : '';
  const mode = profile.selected_mode ? ` | mode ${esc(profile.selected_mode)}` : '';
  return `<div class="kl8-inline-note kl8-accuracy-line">
    random E=${expected} | P(0 hit)=${zero}${targetText}${keyText ? ` | ${keyText}` : ''}${mode}
  </div>`;
}

function renderKL8PerformanceSummary(performance) {
  const available = Number(performance?.available_count || 0);
  if (!available) {
    return `<div class="kl8-inline-warning kl8-performance-note">实际效果等待下一期开奖自动结算；当前页面概率均为随机理论值，不代表模型准确率。</div>`;
  }
  const windows = Array.isArray(performance.windows) ? performance.windows : [];
  const current = windows.find(w => Number(w.settled_count || 0) > 0) || {};
  const rows = Object.values(current.play_stats || {}).filter(x => /^select_(5|6)$/.test(x.play_type || ''));
  if (!rows.length) return '';
  const cells = rows.map(stat => {
    const delta = Number(stat.hit_delta_vs_random || 0);
    const color = delta > 0 ? '#2ea043' : delta < 0 ? '#f85149' : '#8b949e';
    let line = `<span style="margin-right:18px">${esc(stat.label)}：实际均中 <b>${Number(stat.avg_hits || 0).toFixed(2)}</b>，随机 ${Number(stat.random_expected_hits || 0).toFixed(2)}，<b style="color:${color}">${delta >= 0 ? '+' : ''}${delta.toFixed(2)}</b></span>`;
    // v9.6: 同时展示多注组合层面的实际命中率
    const ms = stat.multi_slip;
    if (ms && ms.settled_count > 0) {
      line += `<span style="margin-right:18px">${esc(stat.label)}多注：最佳组均中 <b>${Number(ms.avg_best_hits || 0).toFixed(2)}</b> · ≥3 <b>${(ms.ge3_rate * 100).toFixed(0)}%</b> · ≥4 <b>${(ms.ge4_rate * 100).toFixed(0)}%</b> · ≥5 <b>${(ms.ge5_rate * 100).toFixed(0)}%</b></span>`;
    }
    return line;
  }).join('');
  return `<div class="card kl8-panel" style="padding:12px 15px;border-left:3px solid #63a4ff">
    <div style="font-size:12px;color:#8b949e;margin-bottom:5px">最近 ${esc(current.settled_count || available)} 期实际结算（与随机基线比较）</div>

  </div>`;
}

// 多注覆盖方案（v9.6）：渲染 N 组覆盖最大化号码，诚实展示组合层面命中率
function renderKL8MultiSlips(sel, st) {
  const slips = sel.multi_slips;
  if (!Array.isArray(slips) || slips.length === 0) return '';
  const nSlips = slips.length;
  const pick = slips[0].length || sel.pick || st;
  const coverage = sel.multi_slip_coverage || {};
  const unique = Number(coverage.unique_number_count || 0);
  const maxOverlap = coverage.max_pair_overlap != null ? coverage.max_pair_overlap : '-';
  const sims = coverage.simulations || 0;

  // 每组多少注 = C(pick, st)
  const betsPerGroup = combCount(pick, st);
  const cost = nSlips * betsPerGroup * 2;
  const playLabel = `选${st}`;

  // 不同玩法关注的中奖档位
  const thresholds = [];
  if (st >= 5) thresholds.push({ k: 3, label: '中3+', val: Number(coverage.at_least_one_ge3 || 0) * 100 });
  if (st >= 4) thresholds.push({ k: 4, label: '中4+', val: Number(coverage.at_least_one_ge4 || 0) * 100 });
  if (st >= 5) thresholds.push({ k: 5, label: '中5+', val: Number(coverage.at_least_one_ge5 || 0) * 100 });
  if (st >= 6) thresholds.push({ k: 6, label: '中6+', val: Number(coverage.at_least_one_ge6 || 0) * 100 });
  const probLine = thresholds.map(t => `${t.label} <b style="color:#2ea043">${t.val.toFixed(1)}%</b>`).join(' · ');

  let cards = '';
  slips.forEach((s, i) => {
    cards += `<div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">`;
    cards += `<span style="font-size:11px;color:#8b949e;min-width:34px">第${i + 1}组</span>`;
    for (const n of s) {
      cards += `<span class="kl8-ball highlight-ball" style="width:28px;height:28px;font-size:11px">${String(n).padStart(2,'0')}</span>`;
    }
    cards += `</div>`;
  });

  return `<div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:8px">
    <div style="font-size:12px;font-weight:700;color:#4493f8;margin-bottom:5px">🎯 多注覆盖方案（${nSlips}组 × ${pick}码，打${playLabel}）</div>
    <div style="font-size:11px;color:#8b949e;margin-bottom:7px;line-height:1.6">
      每组 ${pick} 个号打${playLabel} = C(${pick},${st})=${betsPerGroup} 注，共 ${nSlips} 组。v9.6 起采用“覆盖最大化”结构：12 组号码互不重复，最多覆盖 72/80 个号码，组间最大重复 ${esc(maxOverlap)} 个。
      按实际重叠结构模拟 ${esc(sims)} 次公平开奖，${playLabel} 组合层面：${probLine}。每期成本约 <b>${cost}</b> 元。
    </div>
    ${cards}
    <div style="font-size:11px;color:#9a6700;margin-top:6px">⚠ 这是“多买几组”的覆盖率杠杆，不保证单组必中；单注期望命中仍为 ${(pick * 0.25).toFixed(2)} 个。请理性投注。</div>
  </div>`;
}

function parseKL8NumberInput(value) {
  const invalid = [];
  const seen = new Set();
  const numbers = [];
  String(value || '')
    .split(/[\s,，、;；]+/)
    .map(x => x.trim())
    .filter(Boolean)
    .forEach(raw => {
      if (!/^\d+$/.test(raw)) {
        invalid.push(raw);
        return;
      }
      const num = Number(raw);
      if (num < 1 || num > 80) {
        invalid.push(raw);
        return;
      }
      if (!seen.has(num)) {
        seen.add(num);
        numbers.push(num);
      }
    });
  numbers.sort((a, b) => a - b);
  return { numbers, invalid };
}

let kl8RecordsPage = 1;
let kl8RecordsCache = [];
let kl8RecordsMeta = { count: 0, settled_count: 0, pending_count: 0, total_pages: 1 };
const KL8_RECORDS_PAGE_SIZE = 8;
const KL8_RECORDS_CACHE_TTL = 30000;
const kl8RecordsPageCache = new Map();
let kl8RecordsRequest = null;
let kl8RecordsMaintenanceTimer = null;

function invalidateKL8RecordsCache() {
  kl8RecordsPageCache.clear();
  kl8RecordsCache = [];
  kl8RecordsMeta = { count: 0, settled_count: 0, pending_count: 0, total_pages: 1 };
}

async function openKL8RecordsModal() {
  const target = document.getElementById('kl8-records-modal');
  if (!target) return;
  target.innerHTML = `<div class="kl8-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="kl8-records-title">

      </div>
      <div id="kl8-records-body" class="kl8-modal-body" style="flex:1;min-height:0;overflow:auto">
        <div id="kl8-records-summary" class="kl8-soft-badge" style="display:inline-flex;margin-bottom:12px"></div>

  });

  if (kl8RecordsMaintenanceTimer) clearTimeout(kl8RecordsMaintenanceTimer);
  kl8RecordsMaintenanceTimer = null;
  const target = document.getElementById('kl8-records-modal');
  if (target) target.innerHTML = '';
}

async function loadKL8RecordsPage(page, options = {}) {
  const force = Boolean(options.force);
  const maintenanceRetry = Number(options.maintenanceRetry || 0);
  const requestedPage = Math.max(1, Number(page) || 1);
  const cacheKey = String(requestedPage);
  const cached = kl8RecordsPageCache.get(cacheKey);
  if (!force && cached && Date.now() - cached.loadedAt < KL8_RECORDS_CACHE_TTL) {
    kl8RecordsPage = requestedPage;
    kl8RecordsCache = cached.result.records || [];
    kl8RecordsMeta = cached.result;
    renderKL8RecordsPage();
    return;
  }

  kl8RecordsPage = requestedPage;
  const list = document.getElementById('kl8-records-list');
  if (list && !options.silent) {
    list.innerHTML = `<div class="status"><span class="spinner"></span>正在加载第 ${requestedPage} 页…</div>`;
  }

  let promise;
  if (kl8RecordsRequest && kl8RecordsRequest.key === cacheKey) {
    promise = kl8RecordsRequest.promise;
  } else {
    promise = fetchJson('/api/kl8/records?page=' + requestedPage
      + '&page_size=' + KL8_RECORDS_PAGE_SIZE);
    kl8RecordsRequest = { key: cacheKey, promise };
  }

  try {
    const data = await promise;
    if (data.error) throw new Error(data.error);
    const result = data.result || {};
    kl8RecordsPageCache.set(cacheKey, { loadedAt: Date.now(), result });
    if (kl8RecordsPage !== requestedPage || !document.getElementById('kl8-records-list')) return;
    kl8RecordsCache = result.records || [];
    kl8RecordsMeta = result;
    renderKL8RecordsPage();

    // 首屏不等待遗漏结算/旧奖金修复；后台完成后静默刷新当前页，最多重试两次。
    if (result.maintenance_running && maintenanceRetry < 2) {
      if (kl8RecordsMaintenanceTimer) clearTimeout(kl8RecordsMaintenanceTimer);
      kl8RecordsMaintenanceTimer = setTimeout(() => {
        if (document.getElementById('kl8-records-list') && kl8RecordsPage === requestedPage) {
          loadKL8RecordsPage(requestedPage, {
            force: true,
            silent: true,
            maintenanceRetry: maintenanceRetry + 1,
          });
        }
      }, 1800 * (maintenanceRetry + 1));
    }
  } catch (e) {
    if (kl8RecordsPage === requestedPage) {
      const currentList = document.getElementById('kl8-records-list');
      if (currentList) currentList.innerHTML = `<div class="status error">加载失败: ${esc(e.message || e)}</div>`;
    }
  } finally {
    if (kl8RecordsRequest && kl8RecordsRequest.promise === promise) kl8RecordsRequest = null;
  }
}

async function setKL8RecordsPage(p) {
  const totalPages = Math.max(1, Number(kl8RecordsMeta.total_pages) || 1);
  kl8RecordsPage = Math.max(1, Math.min(Number(p) || 1, totalPages));
  await loadKL8RecordsPage(kl8RecordsPage);
  const body = document.getElementById('kl8-records-body');
  if (body) body.scrollTop = 0;
}

  const list = document.getElementById('kl8-records-list');
  const pager = document.getElementById('kl8-records-pager');
  const summaryNode = document.getElementById('kl8-records-summary');
  if (!list) return;
  const pageRecords = kl8RecordsCache;
  const total = Number(kl8RecordsMeta.count) || 0;
  const totalPages = Math.max(1, Number(kl8RecordsMeta.total_pages) || 1);
  kl8RecordsPage = Math.max(1, Math.min(kl8RecordsPage, totalPages));
  const start = (kl8RecordsPage - 1) * KL8_RECORDS_PAGE_SIZE;

  if (summaryNode) {
    const summary = `共 ${total} 条 · 已结算 ${Number(kl8RecordsMeta.settled_count) || 0} · 待开奖 ${Number(kl8RecordsMeta.pending_count) || 0}`;
    summaryNode.innerHTML = `${esc(summary)}${kl8RecordsMeta.maintenance_running ? ' · <span style="color:var(--accent2)">后台同步结算中</span>' : ''}`;
  }
  list.innerHTML = pageRecords.length
    ? pageRecords.map(renderKL8RecordCard).join('')
    : `<div class="note">暂无预测记录。每期开奖后系统会自动生成预测快照并结算，记录会自动累积在这里。</div>`;

  if (totalPages > 1) {
    const prevDisabled = kl8RecordsPage <= 1;
    const nextDisabled = kl8RecordsPage >= totalPages;
    let btns = '';
    const from = Math.max(1, kl8RecordsPage - 2);
    const to = Math.min(totalPages, kl8RecordsPage + 2);
    for (let p = from; p <= to; p++) {
      const active = p === kl8RecordsPage;
      btns += `<button type="button" onclick="setKL8RecordsPage(${p})" style="padding:5px 9px;border:1px solid ${active ? '#2ea043' : 'var(--line)'};background:${active ? '#2ea043' : 'var(--card2)'};color:${active ? '#fff' : 'var(--text)'};border-radius:6px;cursor:pointer">${p}</button>`;
    }
    pager.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px">
      <div style="font-size:12px;color:var(--muted)">显示 ${pageRecords.length ? start + 1 : 0}-${start + pageRecords.length} / ${total} 条 · 第 ${kl8RecordsPage}/${totalPages} 页</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" onclick="setKL8RecordsPage(${kl8RecordsPage - 1})" ${prevDisabled ? 'disabled' : ''} style="padding:5px 9px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:6px;cursor:${prevDisabled ? 'not-allowed' : 'pointer'};opacity:${prevDisabled ? '.5' : '1'}">上一页</button>
        ${btns}

}

function renderKL8RecordCard(rec) {
  const st = rec.settlement;
  const settled = rec.has_settlement && st;
  const statusBadge = settled
    ? `<span class="kl8-record-badge">已结算</span>`
    : `<span class="kl8-record-badge pending">待开奖</span>`;

  let html = `<article class="kl8-record-card ${settled ? '' : 'pending'}">`;
  html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <div style="font-weight:720;font-size:15px">第 ${esc(rec.target_issue || '?')} 期预测</div>
    <div style="display:flex;gap:8px;align-items:center">
      ${statusBadge}
      <span style="font-size:11px;color:var(--muted)">${esc(rec.predicted_at || '')}</span>
    </div>
  </div>`;
  html += `<div style="font-size:11px;color:var(--muted);margin:2px 0 8px">基于第 ${esc(rec.based_on_issue || '?')} 期 · 模型 ${esc(rec.version || '?')}</div>`;

  // 预测主推号码
  const plays = [['select_5', '选5'], ['select_6', '选6'], ['select_10', '选10'], ['fu_shi_7', '选5复式7码']];
  let predHtml = '';
  for (const [key, label] of plays) {
    const pool = rec.main_pool && rec.main_pool[key];
    const nums = (rec.predicted && rec.predicted[key]) || pool || [];
    if (nums && nums.length) {
      predHtml += `<div class="kl8-record-play"><span>${label}</span><div class="kl8-numbers-row">${renderKL8Balls(nums, 26)}</div></div>`;
    }
  }
  if (predHtml) {
    html += `<div style="font-size:12px;color:#8b949e;margin:6px 0 2px">预测主推</div>${predHtml}`;
  }

  const recalculations = Array.isArray(rec.exclude_recalculations) ? rec.exclude_recalculations : [];
  const recalculationGroups = [
    { key: 'select_6', label: '选6', required: 6 },
    { key: 'fu_shi_7', label: '选5复式7码', required: 7 },
  ];
  for (const group of recalculationGroups) {
    const rounds = recalculations.filter(row => row.play_type === group.key);
    if (rounds.length) {
      html += `<div style="font-size:12px;color:#d29922;margin:10px 0 4px">${group.label} · 主推为第0轮 → 累计删除后重新计算并保存</div>`;
      for (const row of rounds) {
        const exhausted = row.status === 'exhausted';
        const hitText = row.hits === null || row.hits === undefined ? '' : ` · 命中 <b style="color:${row.hits >= 3 ? '#2ea043' : '#f85149'}">${esc(row.hits)}</b> 个`;
        const numsText = exhausted
          ? `候选剩余 ${esc(row.remaining_count ?? 0)} 个，不足 ${esc(row.required_count ?? group.required)} 个，重算终止`
          : (row.numbers || []).map(p2).join(' ');
        html += `<div style="font-size:12px;line-height:1.7;margin-top:3px">
          <span style="color:var(--muted);display:inline-block;min-width:52px">第 ${esc(row.round)} 轮</span>
          <span style="${exhausted ? 'color:var(--warn)' : ''}">${numsText}</span>${hitText}
        </div>`;
      }
    }
  }

  if (settled) {
    html += `<div style="font-size:12px;color:#8b949e;margin:10px 0 4px">开奖号码（第 ${esc(st.actual_issue || rec.target_issue)} 期）</div>`;
    html += `<div class="kl8-numbers-row">${renderKL8Balls(st.actual_numbers || [], 28)}</div>`;

    const ps = st.prize_settlement || {};
    const fs = st.fushi_settlement || {};
    const rows = [];
    for (const [key, label] of [['select_5', '选5'], ['select_6', '选6'], ['select_10', '选10']]) {
      const p = ps[key];
      if (p) rows.push(`${label}：中 <b>${p.hits}</b> 个${p.placed ? ` · 投 ${p.bet} 元 / 奖 ${p.prize} 元` : ' · 未投注'}`);
    }
    const f7 = fs['fu_shi_7'];
    if (f7 && f7.placed) {
      rows.push(`选5复式7码：池命中 <b>${f7.pool_hits}</b> 个 → 最高单组 ${f7.max_combo_hits} 个 · 投 ${f7.total_bet} 元 / 奖 ${f7.total_prize} 元`);
    }
    if (rows.length) {
      html += `<div style="margin-top:8px;font-size:13px;line-height:1.7">${rows.map(r => `<div>${r}</div>`).join('')}</div>`;
    }

    const roi = st.cumulative_profit_roi || 0;
    const roiColor = roi >= 0 ? '#2ea043' : '#f85149';
    html += `<div style="margin-top:8px;font-size:13px;border-top:1px dashed var(--line);padding-top:8px">
      累计投注 <b>${st.cumulative_bet || 0}</b> 元 · 奖金 <b>${st.cumulative_prize || 0}</b> 元 ·
      ROI <b style="color:${roiColor}">${(roi * 100).toFixed(1)}%</b>
    </div>`;
  } else {
    html += `<div class="note" style="margin-top:10px">该期尚未开奖，开奖后系统会自动结算并在此显示中奖情况。</div>`;
  }

  html += `</article>`;
  return html;
}

async function runKL8KillRecalculate() {
  const resultTarget = document.getElementById('kl8-kill-result');
  const selected = document.querySelector('input[name="kl8-kill-play"]:checked');
  if (!resultTarget || !selected) return;
  const option = getKL8KillOption(selected.value);
  if (!option) return;

  const parsed = parseKL8NumberInput(document.getElementById('kl8-kill-input')?.value || '');
  if (parsed.invalid.length) {
    resultTarget.innerHTML = `<div class="status error">杀号格式错误或超出1-80: ${esc(parsed.invalid.join(', '))}</div>`;
    return;
  }
  if (!option.initialized && !parsed.numbers.length) {
    resultTarget.innerHTML = `<div class="status error">请先输入至少1个杀号</div>`;
    return;
  }

  const removeNow = option.initialized
    ? [...(option.currentRecalculationNumbers || option.currentNumbers || [])]
    : [];
  if (option.initialized && (
    !removeNow.length || removeNow.length < option.requiredRecalculationPick
  )) {
    resultTarget.innerHTML = `<div class="status error">${esc(option.label)} 剩余号码不足，不能继续杀号计算</div>`;
    refreshKL8KillCards(option.key);
    return;
  }

  const manualKillNumbers = option.initialized ? option.manualKillNumbers : parsed.numbers;
  const excludeNumbers = [...new Set([
    ...(option.excludedNumbers || []),
    ...manualKillNumbers,
    ...removeNow,
  ])].sort((a, b) => a - b);

  resultTarget.innerHTML = `<div class="status"><span class="spinner"></span>正在排除杀号并重新计算 ${esc(option.label)}...</div>`;
  try {
    const url = '/api/kl8/exclude-recalculate?play_type='
      + encodeURIComponent(option.key)
      + '&numbers=' + encodeURIComponent(excludeNumbers.join(','))
      + buildKL8SourceContextQuery(option)
      + '&_=' + Date.now();
    const data = await fetchJson(url);
    if (data.error) throw new Error(data.error);
    const result = data.result || {};
    if (result.error) throw new Error(result.error);
    invalidateKL8RecordsCache();
    const newNumbers = result.numbers || result.top7_numbers || result.core_numbers || [];
    const quality = result.quality || {};
    if (!newNumbers.length || newNumbers.length < option.requiredPick) {
      option.currentNumbers = [];
      option.excludedNumbers = result.excluded_numbers || excludeNumbers;
      option.manualKillNumbers = manualKillNumbers;
      option.initialized = true;
      refreshKL8KillCards(option.key);
      throw new Error(`${option.label} 候选号码不足，已停止输出新结果`);
    }

    option.currentNumbers = newNumbers;
    option.currentRecalculationNumbers = result.next_exclude_numbers || result.select_6_numbers || newNumbers;
    option.excludedNumbers = result.excluded_numbers || excludeNumbers;
    option.manualKillNumbers = manualKillNumbers;
    option.initialized = true;
    option.round = (option.round || 0) + 1;
    const candidates = (result.candidates || []).map(item => Array.isArray(item) ? item[0] : item).slice(0, 12);
    refreshKL8KillCards(option.key);

    let html = `<div class="kl8-select-card" style="border-color:#f85149">`;
    html += `<div class="kl8-select-title">${esc(option.label)} 杀号计算第 ${option.round} 次结果</div>`;
    html += `<div style="font-size:12px;color:#f85149;margin-bottom:8px">杀号: ${manualKillNumbers.map(n => String(n).padStart(2,'0')).join(', ')}</div>`;
    if (removeNow.length) {
      html += `<div style="font-size:12px;color:var(--muted);margin-bottom:8px">本次继续排除: ${removeNow.map(n => String(n).padStart(2,'0')).join(', ')}</div>`;
    }
    html += `<div style="font-size:12px;color:var(--muted);margin-bottom:8px">累计排除: ${option.excludedNumbers.map(n => String(n).padStart(2,'0')).join(', ')}</div>`;
    html += `<div class="kl8-numbers-row">${renderKL8Balls(newNumbers, 40)}</div>`;
    html += renderKL8ShapeProfile(quality.shape_profile, newNumbers);
    if (quality.quality_score !== undefined) {
      const modeLabels = { concentrated: '高分集中', balanced: '均衡分散', repeat_follow: '适度跟重', zone_spread: '区间扩散', shape_balanced: '形态均衡', prize_floor: '奖级冲击' };
      html += `<div style="font-size:12px;color:var(--muted);margin-top:8px">质量分: ${esc(quality.quality_score)} · 模式: ${esc(modeLabels[quality.selection_mode] || quality.selection_mode || '-')} · 重号: ${esc(quality.repeat_count ?? '-')} / ${esc(quality.repeat_cap ?? '-')} · 区间: ${esc(quality.zone_count ?? '-')} · 路数: ${esc(quality.road_count ?? '-')}</div>`;
    }
    if (candidates.length) {
      html += `<div style="font-size:12px;color:var(--muted);margin-top:8px">候补池: ${candidates.map(n => String(n).padStart(2,'0')).join(', ')}</div>`;
    }
    if (result.total_combinations) {
      html += `<div style="font-size:12px;color:var(--muted);margin-top:6px">组合数: ${esc(result.total_combinations)}</div>`;
    }
    html += `</div>`;
    resultTarget.innerHTML = html;
  } catch (e) {
    resultTarget.innerHTML = `<div class="status error">${esc(e.message)}</div>`;
  }
}

function renderKL8ParameterSearch(result) {
  const target = document.getElementById('kl8-parameter-search-result');
  if (!target) return;

  if (!result || result.error) {
    target.innerHTML = `<div class="status error" style="margin-top:16px">${esc(result?.error || '参数搜索失败')}</div>`;
    return;
  }

  const bestByPlay = result.best_by_play || {};
  const playTypes = result.play_types || Object.keys(bestByPlay);
  let html = `<div class="card" style="margin-top:16px;margin-bottom:16px">`;
  html += `<div class="section-title" style="font-size:15px;margin-bottom:10px">快乐8参数搜索结果</div>`;
  html += `<div class="note" style="margin-bottom:10px">用途: 自动回测不同窗口、重号方向、候选池分散等参数，按玩法找历史表现更好的候选策略；它不直接预测开奖，也不会自动激活。</div>`;
  html += `<div class="note" style="margin-bottom:10px">候选数: ${esc(result.candidate_count || 0)} · 数据期数: ${esc(result.total_periods || '-')} · 两阶段快速搜索：先验证段筛选，再给优先候选补封存测试</div>`;
  if (result.honest_note) {
    html += `<div class="note" style="margin-bottom:10px;color:var(--accent2);border-left:3px solid var(--accent2);padding-left:8px">⚠ ${esc(result.honest_note)}</div>`;
  }
  if (result.any_significant === false) {
    html += `<div class="note" style="margin-bottom:10px;color:#8b949e">本轮无任一候选在验证段显著高于随机基线（与随机不可区分）——属公平摇奖的预期结果，排名仅供参考。</div>`;
  }
  if (result.report_file) {
    html += `<div class="note" style="margin-bottom:10px">报告文件: ${esc(result.report_file)}</div>`;
  }
  html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">`;

  for (const playType of playTypes) {
    const item = bestByPlay[playType];
    if (!item) continue;
    const strategy = item.strategy || {};
    const label = playType.startsWith('select_') ? `选${playType.replace('select_', '')}` : playType;
    const valLift = Number(item.validation_lift || 0);
    const finalLift = Number(item.final_test_lift || 0);
    const valHitScore = Number(item.validation_hit_rate_score || 0);
    const finalHitScore = Number(item.final_test_hit_rate_score || 0);
    const formatHitLifts = (lifts) => {
      if (!lifts || typeof lifts !== 'object') return '-';
      return Object.entries(lifts)
        .map(([k, v]) => `${esc(k)}:${Number(v || 0).toFixed(3)}`)
        .join(' / ') || '-';
    };
    // 公平摇奖下正 lift 多为噪声：仅当验证段显著高于随机才标绿，否则一律按噪声呈现(灰色)。
    const isSignificant = item.validation_is_significant === true;
    const liftColor = isSignificant ? '#2ea043' : '#8b949e';
    const noiseTag = (item.likely_noise !== false && !isSignificant)
      ? `<span style="font-size:10px;color:#8b949e;border:1px solid #8b949e;border-radius:3px;padding:0 4px;margin-left:6px">≈随机噪声</span>`
      : '';
    html += `<div class="kl8-select-card" style="border-color:${liftColor}">`;
    html += `<div class="kl8-select-title">${esc(label)} · ${esc(item.candidate || '-')}${noiseTag}</div>`;
    html += `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">score ${esc(item.score ?? '-')} · window ${esc(strategy.window_size || '-')} · 显著: ${isSignificant ? '是' : '否'}</div>`;
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px">`;
    html += `<div>命中率评分: <span style="color:#2ea043;font-weight:700">${valHitScore.toFixed(4)}</span></div>`;
    html += `<div>封存命中率: <span style="color:${finalHitScore > 0 ? '#2ea043' : '#8b949e'};font-weight:700">${finalHitScore.toFixed(4)}</span></div>`;
    html += `<div style="grid-column:1/-1;color:var(--muted)">验证关键档: ${formatHitLifts(item.validation_hit_rate_lifts)}</div>`;
    html += `<div style="grid-column:1/-1;color:var(--muted)">封存关键档: ${formatHitLifts(item.final_test_hit_rate_lifts)}</div>`;
    html += `<div>验证Lift: <span style="color:${liftColor};font-weight:700">${valLift.toFixed(4)}</span></div>`;
    html += `<div>封存Lift: <span style="color:${finalLift > 0 && isSignificant ? '#2ea043' : '#8b949e'};font-weight:700">${finalLift.toFixed(4)}</span></div>`;
    html += `<div>均值命中: ${esc(item.validation_mean_hits ?? '-')}</div>`;
    html += `<div>随机基线: ${esc(item.expected_random ?? '-')}</div>`;
    html += `<div>重号方向: ${esc(strategy.repeat_direction || 'neutral')}</div>`;
    html += `<div>重号上限: ${esc(strategy.pool_max_last_numbers ?? 'auto')}</div>`;
    html += `<div>候选池分散: ${strategy.pool_diversify === false ? '关闭' : '开启'}</div>`;
    html += `<div>ROI: ${esc(item.validation_profit_roi ?? '-')}</div>`;
    html += `</div>`;
    html += `</div>`;
  }

  html += `</div></div>`;
  target.innerHTML = html;
}

async function pollKL8ParameterSearch(jobId) {
  const target = document.getElementById('kl8-parameter-search-result');
  for (let attempt = 0; attempt < 900; attempt++) {
    const data = await fetchJson('/api/kl8/parameter-search/status?job_id=' + encodeURIComponent(jobId) + '&_=' + Date.now());
    if (data.error) {
      renderKL8ParameterSearch({ error: data.error });
      return;
    }

    const job = data.result || {};
    if (job.status === 'completed') {
      const result = job.result || {};
      result.report_file = job.report_file;
      renderKL8ParameterSearch(result);
      return;
    }

    if (job.status === 'failed') {
      renderKL8ParameterSearch({ error: job.error || job.message || '参数搜索失败' });
      return;
    }

    if (target) {
      target.innerHTML = `<div class="status" style="margin-top:16px"><span class="spinner"></span>参数搜索${esc(job.status || 'running')} · 已用 ${esc(job.elapsed_seconds ?? 0)} 秒</div>`;
    }
    await new Promise(resolve => setTimeout(resolve, 2000));
  }
  renderKL8ParameterSearch({ error: '参数搜索超时' });
}

async function runKL8ParameterSearch() {
  const target = document.getElementById('kl8-parameter-search-result');
  if (target) {
    target.innerHTML = `<div class="status" style="margin-top:16px"><span class="spinner"></span>正在启动快乐8参数搜索...</div>`;
  }

  try {
    const data = await fetchJson('/api/kl8/parameter-search/start?max_candidates=24&top_n=3&_=' + Date.now());
    if (data.error) {
      renderKL8ParameterSearch({ error: data.error });
      return;
    }
    const job = data.result || {};
    if (!job.job_id) {
      renderKL8ParameterSearch({ error: '未返回任务ID' });
      return;
    }
    await pollKL8ParameterSearch(job.job_id);
  } catch (e) {
    const errText = String(e.message || '');
    const msg = errText.includes('504') || errText.includes('Gateway Time-out') || errText.includes('接口不存在')
      ? `${e.message}；请确认后端服务已重启到最新版本，然后再点参数搜索`
      : e.message;
    renderKL8ParameterSearch({ error: msg });
  }
}

async function fetchKL8Data() {
  const appKL8 = document.getElementById('app-kl8');
  const originalContent = appKL8.innerHTML;
  appKL8.innerHTML = `<div class="status"><span class="spinner"></span>正在抓取最新快乐8开奖数据…</div>`;

  try {
    const data = await fetchJson('/api/kl8/fetch');
    if (data.error) {
      appKL8.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    invalidateKL8RecordsCache();

    const success = data.success || false;
    const message = data.message || '';
    const latestIssue = data.latest_issue || '';

    if (data.result) {
      renderKL8(data.result);
    }

    // Toast
    const toast = document.createElement('div');
    toast.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:${success ? '#2ea043' : '#f85149'};color:white;padding:12px 24px;border-radius:8px;font-size:14px;z-index:1000;`;
    toast.innerHTML = `${success ? '✅' : '❌'} ${message}${latestIssue ? ' · 最新期号: ' + latestIssue : ''}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  } catch (e) {
    appKL8.innerHTML = `<div class="status error">抓取失败: ${esc(e.message)}</div>`;
    setTimeout(() => { appKL8.innerHTML = originalContent; }, 2000);
  }
}

let basketballLoaded = false;
let basketballLastResult = null;
let basketballPage = 1;
let basketballPageSize = 12;
let basketballSearchFilter = '';
let basketballSource = 'zgzcw';

function switchBasketballSource(source) {
  basketballSource = source || 'zgzcw';
  basketballLoaded = false;
  basketballLastResult = null;
  loadBasketball(true);
}

async function loadBasketball(force) {
  if (!force && basketballLoaded && basketballLastResult) {
    renderBasketball(basketballLastResult);
    return;
  }
  appBasketball.innerHTML = '<div class="status">加载中…</div>';
  try {
    const qs = new URLSearchParams({
      _: Date.now().toString(),
      source: basketballSource || 'zgzcw',
    });
    const data = await fetchJson('/api/basketball?' + qs.toString());
    if (data.error) {
      appBasketball.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    basketballLoaded = true;
    renderBasketball(data.result);
  } catch (e) {
    appBasketball.innerHTML = `<div class="status error">网络请求失败：${esc(e.message)}</div>`;
  }
}

function basketballMatchPassesSearch(m) {
  const kw = (basketballSearchFilter || '').trim().toLowerCase();
  if (!kw) return true;
  return [
    m.home,
    m.away,
    m.league,
    m.time,
    m.spf?.prediction,
    m.rqspf?.prediction,
    m.daxiao?.prediction,
  ].filter(Boolean).join(' ').toLowerCase().includes(kw);
}

function setBasketballPage(page) {
  basketballPage = Math.max(1, Number(page) || 1);
  if (basketballLastResult) renderBasketball(basketballLastResult);
  scrollPageListToTop('panel-basketball');
}

function setBasketballPageSize(size) {
  basketballPageSize = Math.max(5, Number(size) || 12);
  basketballPage = 1;
  if (basketballLastResult) renderBasketball(basketballLastResult);
}

function attachBasketballSearchListeners() {
  const input = document.getElementById('basketball-search');
  if (!input) return;
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('compositionstart', () => {
    input.dataset.composing = '1';
  });
  input.addEventListener('compositionend', () => {
    delete input.dataset.composing;
    handleBasketballSearch({ target: input });
  });
  input.addEventListener('input', handleBasketballSearch);
}

function handleBasketballSearch(e) {
  const el = e.target;
  if (el.dataset && el.dataset.composing) return;
  basketballSearchFilter = el.value;
  basketballPage = 1;
  if (basketballLastResult) renderBasketball(basketballLastResult);
}

function fmtPctValue(value) {
  return typeof value === 'number' && Number.isFinite(value) ? `${(value * 100).toFixed(1)}%` : '-';
}

function fmtNumValue(value, digits = 3) {
  return typeof value === 'number' && Number.isFinite(value) ? value.toFixed(digits) : '-';
}

let syncStampTimer = null;

function formatSyncStamp(value) {
  if (!value) {
    return { text: '尚未同步', detail: '点击下方按钮执行一次同步', state: 'missing' };
  }
  const normalized = String(value).replace(' ', 'T');
  const date = new Date(normalized);
  const display = String(value).replace('T', ' ').slice(0, 19);
  if (Number.isNaN(date.getTime())) {
    return { text: display || '-', detail: '时间格式异常', state: 'stale' };
  }
  const diffMs = Date.now() - date.getTime();
  const absMs = Math.abs(diffMs);
  const minutes = Math.floor(absMs / 60000);
  let age = '刚刚';
  if (minutes >= 1440) age = `${Math.floor(minutes / 1440)} 天前`;
  else if (minutes >= 60) age = `${Math.floor(minutes / 60)} 小时前`;
  else if (minutes >= 1) age = `${minutes} 分钟前`;
  const state = diffMs > 24 * 60 * 60 * 1000 ? 'stale' : '';
  return { text: age, detail: display, state };
}

function updateSyncStampAges(root = document) {
  root.querySelectorAll('[data-sync-at]').forEach(el => {
    const stamp = formatSyncStamp(el.dataset.syncAt);
    const textEl = el.querySelector('[data-sync-age]');
    const detailEl = el.querySelector('[data-sync-detail]');
    if (textEl) textEl.textContent = stamp.text;
    if (detailEl) detailEl.textContent = stamp.detail;
    el.classList.toggle('stale', stamp.state === 'stale');
    el.classList.toggle('missing', stamp.state === 'missing');
  });
}

function startSyncStampTimer() {
  if (syncStampTimer) clearInterval(syncStampTimer);
  syncStampTimer = setInterval(() => updateSyncStampAges(), 60000);
}

function predictionRecordDateKey(record) {
  const directDate = String(record?.date || '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(directDate)) return directDate;
  const matchTime = String(record?.match_time || '').trim();
  const fullDate = matchTime.match(/^(\d{4}-\d{2}-\d{2})/);
  if (fullDate) return fullDate[1];
  const shortDate = matchTime.match(/^(\d{2}-\d{2})/);
  if (!shortDate) return '';
  const createdYear = String(record?.created_at || '').match(/^(\d{4})/);
  return `${createdYear ? createdYear[1] : new Date().getFullYear()}-${shortDate[1]}`;
}

function setPredictionDateFilter(value) {
  predictionDateFilter = value || '';
  predictionsPage = 1;
  loadPredictions();
}

function setPredictionDateToday() {
  const now = new Date();
  const localToday = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
  setPredictionDateFilter(localToday);
}

function predictionCalendarMonthShift(monthKey, delta) {
  const match = String(monthKey || '').match(/^(\d{4})-(\d{2})$/);
  const base = match
    ? new Date(Number(match[1]), Number(match[2]) - 1, 1)
    : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  base.setMonth(base.getMonth() + delta);
  return `${base.getFullYear()}-${pad2(base.getMonth() + 1)}`;
}

function renderPredictionCalendar() {
  const panel = document.getElementById('prediction-calendar-popover');
  if (!panel) return;
  const monthMatch = String(predictionCalendarMonth || '').match(/^(\d{4})-(\d{2})$/);
  const now = new Date();
  const year = monthMatch ? Number(monthMatch[1]) : now.getFullYear();
  const month = monthMatch ? Number(monthMatch[2]) : now.getMonth() + 1;
  predictionCalendarMonth = `${year}-${pad2(month)}`;

  const firstDayOffset = (new Date(year, month - 1, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month, 0).getDate();
  const today = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
  const minDate = predictionAvailableDates.length
    ? predictionAvailableDates[predictionAvailableDates.length - 1] : '';
  const maxDate = predictionAvailableDates.length ? predictionAvailableDates[0] : '';
  const minMonth = minDate.slice(0, 7);
  const maxMonth = maxDate.slice(0, 7);
  const previousMonth = predictionCalendarMonthShift(predictionCalendarMonth, -1);
  const nextMonth = predictionCalendarMonthShift(predictionCalendarMonth, 1);

  let daysHtml = '<div class="prediction-calendar-weekdays">' +
    ['一', '二', '三', '四', '五', '六', '日'].map(day => `<span>${day}</span>`).join('') +
    '</div><div class="prediction-calendar-grid">';
  daysHtml += '<span class="prediction-calendar-empty"></span>'.repeat(firstDayOffset);
  for (let day = 1; day <= daysInMonth; day += 1) {
    const date = `${year}-${pad2(month)}-${pad2(day)}`;
    const count = Number(predictionDateCounts[date] || 0);
    const outsideRange = Boolean(minDate && maxDate && (date < minDate || date > maxDate));
    const classes = [
      'prediction-calendar-day',
      count ? 'has-records' : '',
      date === today ? 'today' : '',
      date === predictionDateFilter ? 'selected' : '',
    ].filter(Boolean).join(' ');
    daysHtml += `<button type="button" class="${classes}" ${outsideRange ? 'disabled' : ''}
      onclick="choosePredictionCalendarDate('${date}')" aria-label="${date}${count ? `，${count}场比赛` : ''}">${day}</button>`;
  }
  daysHtml += '</div>';
  panel.innerHTML = `<div class="prediction-calendar-head">
      <button type="button" class="prediction-calendar-nav" onclick="shiftPredictionCalendar(-1)"
        ${minMonth && previousMonth < minMonth ? 'disabled' : ''} aria-label="上个月">‹</button>
      <div class="prediction-calendar-title">${year} 年 ${month} 月</div>
      <button type="button" class="prediction-calendar-nav" onclick="shiftPredictionCalendar(1)"
        ${maxMonth && nextMonth > maxMonth ? 'disabled' : ''} aria-label="下个月">›</button>
    </div>${daysHtml}
    <div class="prediction-calendar-foot">蓝点表示该日期有预测记录</div>`;
}

function togglePredictionCalendar(clickEvent) {
  if (clickEvent) clickEvent.stopPropagation();
  const panel = document.getElementById('prediction-calendar-popover');
  const trigger = document.getElementById('prediction-date-trigger');
  if (!panel || !trigger) return;
  const willOpen = panel.hidden;
  panel.hidden = !willOpen;
  trigger.setAttribute('aria-expanded', String(willOpen));
  if (willOpen) renderPredictionCalendar();
}

function shiftPredictionCalendar(delta) {
  predictionCalendarMonth = predictionCalendarMonthShift(predictionCalendarMonth, delta);
  renderPredictionCalendar();
}

function choosePredictionCalendarDate(value) {
  setPredictionDateFilter(value);
}

document.addEventListener('click', event => {
  const calendar = document.querySelector('.prediction-calendar-wrap');
  if (!calendar || calendar.contains(event.target)) return;
  const panel = document.getElementById('prediction-calendar-popover');
  const trigger = document.getElementById('prediction-date-trigger');
  if (panel) panel.hidden = true;
  if (trigger) trigger.setAttribute('aria-expanded', 'false');
});

document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  const panel = document.getElementById('prediction-calendar-popover');
  const trigger = document.getElementById('prediction-date-trigger');
  if (panel) panel.hidden = true;
  if (trigger) trigger.setAttribute('aria-expanded', 'false');

});

function getFootballAuditBreakdown(audit = {}) {
  const labels = {
    future_settlement: '提前回填',
    implausible_actual_score: '比分不合理',
    invalid_actual_score: '比分格式错误',
    missing_result_quality: '缺少赛果质量标记',
    result_quality_reject: '赛果来源不合格',
    result_quality_low: '赛果可信度低',
    invalid_half_time_data: '半场比分无效',
    zero_calibration_weight: '校准权重为 0',
  };
  return Object.entries(audit.issue_counts || {})
    .filter(([, count]) => Number(count) > 0)
    .sort((a, b) => Number(b[1]) - Number(a[1]))
    .map(([code, count]) => `${labels[code] || code} ${count} 项`);
}

function renderFootballDiagnostics(diagnostics) {
  if (!diagnostics || !diagnostics.windows) return '';

  const windows = diagnostics.windows || {};
  const availableSamples = diagnostics.available_samples || 0;
  const latestKey = diagnostics.latest_window && windows[diagnostics.latest_window]
    ? diagnostics.latest_window
    : Object.keys(windows)[0];
  const latest = latestKey ? windows[latestKey] : null;
  const summary = latest?.summary || {};
  const notes = latest?.diagnostics?.notes || [];
  const suggestions = diagnostics.diagnostic_suggestions?.suggestions || [];
  const deltas = diagnostics.diagnostic_suggestions?.param_deltas || {};
  const audit = diagnostics.audit || {};
  const auditBreakdown = getFootballAuditBreakdown(audit);
  const auditBreakdownHtml = auditBreakdown.length
    ? `<div class="diag-line" style="color:var(--warn)">${auditBreakdown.map(esc).join(' · ')}</div>`
    : '';
  const sync = diagnostics.sync || {};
  const hasDeltas = Object.keys(deltas).length > 0;

  if (availableSamples <= 0) {
    return `<div class="card model-health">
      <h3>预测诊断与赛后复盘</h3>
      <div class="diag-panels">
        <div class="diag-panel">
          <div class="diag-title">复盘状态</div>
          <div class="diag-main empty">暂无可复盘样本</div>
          <div class="diag-line">已回填 ${sync.settled || 0} 场，待同步 ${sync.pending_sync || 0} 场</div>
          <div class="diag-line">审计问题 ${audit.issue_count || 0} 项</div>
          ${auditBreakdownHtml}
        </div>
        <div class="diag-panel">
          <div class="diag-title">下一步</div>
          <div class="diag-line">先点击“立即同步一次”更新已完赛比分</div>
          <div class="diag-line">若仍有大量审计问题，再执行“复盘+修复”</div>
        </div>
      </div>
    </div>`;
  }

  const windowRows = Object.entries(windows).map(([key, report]) => {
    const item = report.summary || {};
    return `<tr>
      <td style="padding:6px 8px;color:var(--muted)">${esc(key)}</td>
      <td style="padding:6px 8px;text-align:right">${report.sample_count || 0}</td>
      <td style="padding:6px 8px;text-align:right">${fmtPctValue(item.top1_hit_rate)}</td>
      <td style="padding:6px 8px;text-align:right">${fmtPctValue(item.top3_hit_rate)}</td>
      <td style="padding:6px 8px;text-align:right">${fmtPctValue(item.hit_rate_total)}</td>
      <td style="padding:6px 8px;text-align:right">${fmtPctValue(item.htf_top3_hit_rate)}</td>
      <td style="padding:6px 8px;text-align:right">${fmtNumValue(item.goal_logloss)}</td>
    </tr>`;
  }).join('');

  const deltaText = Object.keys(deltas).length
    ? Object.entries(deltas).map(([key, value]) => `${esc(key)} ${value > 0 ? '+' : ''}${fmtNumValue(value, 2)}`).join(' / ')
    : '暂无稳定调参项';

  const noteHtml = notes.length
    ? notes.slice(0, 4).map(note => `<div style="color:var(--muted);font-size:12px;margin-top:4px">${esc(note)}</div>`).join('')
    : '<div style="color:var(--muted);font-size:12px;margin-top:4px">暂无明显偏差</div>';

  const suggestionHtml = suggestions.length
    ? suggestions.slice(0, 4).map(item => `<div class="diag-line">${esc(item)}</div>`).join('')
    : '<div class="diag-line">建议先继续积累样本</div>';

  return `<div class="card model-health">
    <h3>预测诊断与赛后复盘</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px">
      <div class="status-item"><span class="status-dot">N</span><div><div class="status-name">可用样本</div><div class="status-desc">${availableSamples} 场</div></div></div>
      <div class="status-item"><span class="status-dot">1</span><div><div class="status-name">Top1</div><div class="status-desc">${fmtPctValue(summary.top1_hit_rate)}</div></div></div>
      <div class="status-item"><span class="status-dot">3</span><div><div class="status-name">Top3</div><div class="status-desc">${fmtPctValue(summary.top3_hit_rate)}</div></div></div>
      <div class="status-item"><span class="status-dot">G</span><div><div class="status-name">进球数</div><div class="status-desc">${fmtPctValue(summary.hit_rate_total)}</div></div></div>
      <div class="status-item"><span class="status-dot">H</span><div><div class="status-name">半全场</div><div class="status-desc">${fmtPctValue(summary.htf_top3_hit_rate)}</div></div></div>
      <div class="status-item"><span class="status-dot">!</span><div><div class="status-name">审计问题</div><div class="status-desc">${audit.issue_count || 0} 项</div></div></div>
      <div class="status-item"><span class="status-dot">S</span><div><div class="status-name">待同步</div><div class="status-desc">${sync.pending_sync || 0} 场</div></div></div>
    </div>
    ${auditBreakdownHtml ? `<div class="diag-panel" style="margin-bottom:12px"><div class="diag-title">审计问题明细</div>${auditBreakdownHtml}</div>` : ''}
    <div style="overflow:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:12px">
      <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:560px">
        <thead style="color:var(--muted);background:var(--card2)">
          <tr>
            <th style="padding:6px 8px;text-align:left">窗口</th>
            <th style="padding:6px 8px;text-align:right">样本</th>
            <th style="padding:6px 8px;text-align:right">Top1</th>
            <th style="padding:6px 8px;text-align:right">Top3</th>
            <th style="padding:6px 8px;text-align:right">进球数</th>
            <th style="padding:6px 8px;text-align:right">半全场</th>
            <th style="padding:6px 8px;text-align:right">Goal LL</th>
          </tr>
        </thead>
        <tbody>${windowRows || `<tr><td colspan="7" style="padding:10px;color:var(--muted);text-align:center">暂无可用样本</td></tr>`}</tbody>
      </table>
    </div>
    <div class="diag-panels">
      <div class="diag-panel">
        <div class="diag-title">偏差提示</div>
        ${noteHtml}
      </div>
      <div class="diag-panel">
        <div class="diag-title">调参建议</div>
        <div class="diag-main ${hasDeltas ? '' : 'empty'}">${deltaText}</div>
        ${suggestionHtml}
      </div>
    </div>
  </div>`;
}

}

}

function openBeidanPredictionRecords() {

function renderPredictionDateToolbar(records) {
  return `<div class="prediction-date-toolbar">
    <span class="prediction-date-label">比赛日期</span>
    <div class="prediction-calendar-wrap">
      <button id="prediction-date-trigger" type="button" class="prediction-date-trigger" onclick="togglePredictionCalendar(event)" aria-haspopup="dialog" aria-expanded="false">
        <span>${predictionDateFilter ? esc(predictionDateFilter) : '年 / 月 / 日'}</span><span class="prediction-date-trigger-icon" aria-hidden="true">▣</span>
      </button>

}

function preparePredictionCalendar(records) {
  const dates = [...new Set(records.map(predictionRecordDateKey).filter(Boolean))].sort((a, b) => b.localeCompare(a));
  predictionAvailableDates = dates;
  predictionDateCounts = records.reduce((counts, record) => {
    const date = predictionRecordDateKey(record);
    if (date) counts[date] = (counts[date] || 0) + 1;
    return counts;
  }, {});
  const anchor = predictionDateFilter || dates[0] || new Date().toISOString().slice(0, 10);
  if (!predictionCalendarMonth || predictionDateFilter) predictionCalendarMonth = anchor.slice(0, 7);
}

function beidanMarketSummary(section, labels = {}) {
  const ranked = Object.entries(section?.probabilities || {}).filter(([, value]) => Number.isFinite(Number(value))).sort((a, b) => Number(b[1]) - Number(a[1]));
  return {
    available: Boolean(section && (ranked.length || section.prediction)),
    pick: labels[section?.prediction] || section?.prediction || (ranked[0] ? labels[ranked[0][0]] || ranked[0][0] : ''),
    detail: ranked.map(([key, value]) => `${esc(labels[key] || key)} ${(Number(value) * 100).toFixed(1)}%`).join(' · '),
  };
}

function beidanHitMark(value) {
  return value === true ? '✅' : value === false ? '❌' : '';
}

async function loadBeidanPredictionRecords() {
  const app = document.getElementById('app-predictions');
  const data = await fetchJson('/api/beidan/records');
  if (data.error) throw new Error(data.error);
  const allRecords = data.result?.records || [];
  const sync = data.result?.sync || {};
  preparePredictionCalendar(allRecords);
  const records = predictionDateFilter ? allRecords.filter(record => predictionRecordDateKey(record) === predictionDateFilter) : allRecords;
  predictionExportData = {
    schema_version: 'beidan-prediction-export-v1', exported_at: new Date().toISOString(),
    record_count: allRecords.length, settled_count: allRecords.filter(record => record.settled).length,
    sync_status: sync, records: allRecords,
  };

  let html = renderPredictionRecordTypeTabs();
  html += `<div class="card model-health"><h3>🔄 北单自动赛果同步</h3><div class="status-grid">
    <div class="status-item"><span class="status-dot">✅</span><div><div class="status-name">已回填</div><div class="status-desc">${sync.settled || 0} 场</div></div></div>
    <div class="status-item"><span class="status-dot">⏳</span><div><div class="status-name">待同步</div><div class="status-desc">${sync.pending_sync || 0} 场</div></div></div>
    <div class="status-item"><span class="status-dot">↻</span><div><div class="status-name">重试中</div><div class="status-desc">${sync.retry || 0} 场</div></div></div>
    <div class="status-item"><span class="status-dot">${sync.failed ? '⚠️' : '✅'}</span><div><div class="status-name">同步失败</div><div class="status-desc">${sync.failed || 0} 场</div></div></div>
  </div></div>`;
  html += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <button type="button" onclick="exportPredictionRecords()" style="flex:1;min-width:150px;padding:10px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;font-size:14px;cursor:pointer">⬇️ 一键导出 JSON</button>
    <button type="button" onclick="triggerBeidanSync(event)" style="flex:1;min-width:150px;padding:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer">🔁 立即同步一次</button>
  </div>`;
  html += renderPredictionDateToolbar(records);
  html += `<div class="section-title">📋 北单预测记录（共 ${records.length} 条）</div>`;

  const totalPages = Math.max(1, Math.ceil(records.length / PREDICTIONS_PAGE_SIZE));
  predictionsPage = Math.max(1, Math.min(predictionsPage, totalPages));
  const pageStart = (predictionsPage - 1) * PREDICTIONS_PAGE_SIZE;
  const pageRecords = records.slice(pageStart, pageStart + PREDICTIONS_PAGE_SIZE);
  const pageEnd = pageStart + pageRecords.length;
  if (records.length > PREDICTIONS_PAGE_SIZE) html += renderPredictionsPager(records.length, predictionsPage, totalPages, pageStart + 1, pageEnd);
  if (!records.length) {
    html += '<div class="card"><div class="status" style="padding:20px">暂无北单预测记录。打开北单页面后，系统会自动保存赛前预测。</div></div>';
  } else {
    const statusMap = { pending: ['等待自动同步', 'var(--muted)'], ready: ['准备同步', 'var(--warn)'], synced: ['已回填', 'var(--accent2)'], retry: ['重试中', 'var(--warn)'], failed: ['同步失败', 'var(--away)'], ignored: ['已隐藏', 'var(--muted)'] };
    pageRecords.forEach((record, idx) => {
      const status = statusMap[record.sync_status] || statusMap.pending;
      const spf = beidanMarketSummary(record.spf);

      const zjq = beidanMarketSummary(record.zjq);
