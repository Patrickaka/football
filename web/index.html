    html += `<div class="row"><span class="k">❄ 后区冷门</span><span class="v">${(result.cold_back || []).map(x => String(x).padStart(2, '0')).join(' · ') || '-'}</span></div>`;
    html += `<div class="row"><span class="k">📈 后区升温</span><span class="v">${(result.rising_back || []).map(x => String(x).padStart(2, '0')).join(' · ') || '-'}</span></div>`;
    html += `<div class="row"><span class="k">📉 后区降温</span><span class="v">${(result.falling_back || []).map(x => String(x).padStart(2, '0')).join(' · ') || '-'}</span></div>`;
    
    cyclesDiv.innerHTML = html;
  } catch (e) {
    cyclesDiv.innerHTML = `<div class="status error">分析周期失败：${esc(e.message)}</div>`;
  }
}

async function getLotteryContribution() {
  const contribDiv = document.getElementById('lottery-contribution-result');
  contribDiv.innerHTML = `<div class="status"><span class="spinner"></span>正在分析贡献度…</div>`;
  try {
    const data = await fetchJson('/api/lottery/contribution');
    if (data.error) {
      contribDiv.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    const result = data.result || {};
    const weights = result.weights || {};
    
    let html = '';
    html += `<div class="row"><span class="k">频率特征</span><span class="v">权重: ${(weights.frequency || 0).toFixed(3)}</span></div>`;
    html += `<div class="row"><span class="k">遗漏特征</span><span class="v">权重: ${(weights.gap || 0).toFixed(3)}</span></div>`;
    html += `<div class="row"><span class="k">位置特征</span><span class="v">权重: ${(weights.position || 0).toFixed(3)}</span></div>`;
    html += `<div class="row"><span class="k">012路特征</span><span class="v">权重: ${(weights.road || 0).toFixed(3)}</span></div>`;
    
    // 特征重要性条形图
    html += `<div class="section-title" style="font-size:13px;margin:12px 0 8px">特征重要性</div>`;
    const maxWeight = Math.max(...Object.values(weights), 1);
    for (const [name, weight] of Object.entries(weights)) {
      const percent = (weight / maxWeight * 100).toFixed(0);
      const label = { frequency: '频率', gap: '遗漏', position_residual: '区位残差', road_residual: '路数残差', repeat: '重号', odd_even: '奇偶', big_small: '大小' }[name] || name;
      html += `<div class="zhixuan">
        <span class="rank">${label}</span>
        <span class="num">${weight.toFixed(3)}</span>
        <span class="bar"><i style="width:${percent}%"></i></span>
        <span class="score">${percent}%</span>
      </div>`;
    }
    
    contribDiv.innerHTML = html;
  } catch (e) {
    contribDiv.innerHTML = `<div class="status error">分析贡献度失败：${esc(e.message)}</div>`;
  }
}

async function getLotteryEnsemble() {
  const ensembleDiv = document.getElementById('lottery-ensemble-result');
  ensembleDiv.style.display = 'block';
  ensembleDiv.innerHTML = `<div class="status"><span class="spinner"></span>正在进行多模型集成投票…</div>`;
  try {
    const data = await fetchJson('/api/lottery/ensemble?method=voting');
    if (data.error) {
      ensembleDiv.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    const result = data.result || {};
    const front = (result.front || []).map(n => String(n).padStart(2, '0')).join(' ');
    const back = (result.back || []).map(n => String(n).padStart(2, '0')).join(' ');
    
    let html = '';
    
    // 预测号码
    html += `<div class="highlight">
      <div style="display:flex;justify-content:center;align-items:center;gap:12px">
        <span class="big" style="letter-spacing:4px;color:#f85149">${front}</span>
        <span style="color:var(--muted);font-size:24px">+</span>
        <span class="big" style="letter-spacing:4px;color:#4493f8">${back}</span>
      </div>
      <div class="sub">投票策略：${result.method || 'voting'}</div>
    </div>`;
    
    // 候选号码
    if (result.front_candidates?.length || result.back_candidates?.length) {
      html += `<div class="section-title" style="font-size:13px;margin:12px 0 8px">候选号码</div>`;
      html += `<div class="card">`;
      if (result.front_candidates?.length) {
        html += `<div class="row"><span class="k">前区候选</span><span class="v">${result.front_candidates.slice(0, 8).map(x => String(x.number).padStart(2, '0') + '(' + x.score.toFixed(2) + ')').join(' · ')}</span></div>`;
      }
      if (result.back_candidates?.length) {
        html += `<div class="row"><span class="k">后区候选</span><span class="v">${result.back_candidates.slice(0, 6).map(x => String(x.number).padStart(2, '0') + '(' + x.score.toFixed(2) + ')').join(' · ')}</span></div>`;
      }
      html += `</div>`;
    }
    
    // 周期状态
    if (result.cycle_info) {
      const ci = result.cycle_info;
      html += `<div class="section-title" style="font-size:13px;margin:12px 0 8px">周期状态</div>`;
      html += `<div class="blend-row">`;
      if (ci.hot_front?.length) html += `<span>🔥前区热门: ${ci.hot_front.map(x => String(x).padStart(2, '0')).join(' ')}</span>`;
      if (ci.hot_back?.length) html += `<span>🔥后区热门: ${ci.hot_back.map(x => String(x).padStart(2, '0')).join(' ')}</span>`;
      html += `</div>`;
    }
    
    ensembleDiv.innerHTML = html;
  } catch (e) {
    ensembleDiv.innerHTML = `<div class="status error">集成投票失败：${esc(e.message)}</div>`;
  }
}

async function fetchLotteryData() {
  const appLottery = document.getElementById('app-lottery');
  const originalContent = appLottery.innerHTML;
  
  appLottery.innerHTML = `<div class="status"><span class="spinner"></span>正在抓取最新开奖号码并重新分析…</div>`;
  
  try {
    const data = await fetchJson('/api/lottery/fetch');
    if (data.error) {
      appLottery.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    
    const result = data.result || {};
    const success = result.success || false;
    const message = result.message || '';
    const latestIssue = result.latest_issue || '';
    
    // 如果服务器返回了重新分析的数据，直接渲染分析结果
    if (result.analysis) {
      lotteryLoaded = true;
      renderLottery(result.analysis);
      
      // 显示抓取结果提示
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: ${success ? '#2ea043' : '#f85149'};
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 1000;
        animation: fadeInUp 0.3s ease;
      `;
      toast.innerHTML = `${success ? '✅' : '❌'} ${message}${latestIssue ? ' · 最新期号: ' + latestIssue : ''}`;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'fadeOutDown 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
      return;
    }
    
    // 备用：重新加载页面
    lotteryLoaded = false;
    await loadLottery();
    
    // 显示抓取结果提示
    const toast = document.createElement('div');
    toast.style.cssText = `
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: ${success ? '#2ea043' : '#f85149'};
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1000;
      animation: fadeInUp 0.3s ease;
    `;
    toast.innerHTML = `${success ? '✅' : '❌'} ${message}${latestIssue ? ' · 最新期号: ' + latestIssue : ''}`;
    document.body.appendChild(toast);
    
    setTimeout(() => {
      toast.style.animation = 'fadeOutDown 0.3s ease';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  } catch (e) {
    appLottery.innerHTML = `<div class="status error">抓取失败：${esc(e.message)}</div>`;
    setTimeout(() => {
      appLottery.innerHTML = originalContent;
    }, 2000);
  }
}

// ── 快乐8相关函数 ──

let kl8Loaded = false;

async function loadKL8() {
  if (kl8Loaded) return;
  const appKL8 = document.getElementById('app-kl8');
  appKL8.innerHTML = `<div class="status"><span class="spinner"></span>正在加载快乐8数据…</div>`;

  try {
    const data = await fetchJson('/api/kl8?_=' + Date.now());
    if (data.error) {
      appKL8.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    kl8Loaded = true;
    renderKL8(data.result);

    appKL8.innerHTML = `<div class="status error">加载失败：${esc(e.message)}</div>`;

}

async function refreshKL8() {

  appKL8.innerHTML = `<div class="status"><span class="spinner"></span>正在刷新快乐8数据…</div>`;

  } catch (e) {

function renderKL8(r) {
  const appKL8 = document.getElementById('app-kl8');
  let html = '';
  const selectTypes = [3, 4, 5, 6, 7, 8, 9, 10];
  const fushiTypes = [
    { key: 'fu_shi_7', label: '选5复式 — 7码复式', field: 'top7_numbers', coreLabel: '7个核心号码' },
    { key: 'fu_shi_10_11', label: '选10复式 — 11码复式', field: 'top11_numbers', coreLabel: '11个核心号码' },
  ];

  html += `<div class="section-title">【快乐8数据分析】</div>`;
  html += `<div class="note" style="color:var(--accent2);margin-bottom:12px">⚠ 快乐8开奖具有随机性，以上分析仅为历史统计参考，不构成任何投注建议。请理性对待！</div>`;

  // v9.2: 三种状态 — 补数中 / 验证中 / 已验证
  const signalStatus = r.statistics?.signal_status || 'unknown';
  const backfillProgress = r.statistics?.backfill_progress || {};
  const isBackfilling = !backfillProgress.is_complete;
  const currentPeriods = backfillProgress.current_periods || r.statistics?.total_periods || 0;
  const targetPeriods = backfillProgress.target_periods || 800;
  const progressPct = backfillProgress.progress_pct || 0;

  // 版本信息 + 补数进度
  html += `<div class="note" style="margin-bottom:8px">版本: ${esc(r.statistics?.version || 'unknown')} · 分析期数: ${currentPeriods} · 信号状态: ${esc(signalStatus)}</div>`;
  html += `<div class="note" style="margin-bottom:8px">基于期号: ${esc(r.based_on_issue || r.statistics?.based_on_issue || '-')} · 预测期号: ${esc(r.target_issue || r.statistics?.target_issue || '-')} · 生成时间: ${esc(r.prediction_generated_at || r.statistics?.prediction_generated_at || '-')}</div>`;

  // ── 状态1：历史补数中 ──
  if (isBackfilling) {
    html += `<div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,#1a2230,#1a2a3a);border:1px solid #4493f8;padding:16px 18px">`;
    html += `<div style="font-size:15px;font-weight:700;color:#4493f8;margin-bottom:10px">📥 历史补数中</div>`;
    html += `<div style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px">${currentPeriods} / ${targetPeriods} 期</div>`;
    // 进度条
    html += `<div style="width:100%;height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-bottom:8px">`;
    html += `<div style="width:${progressPct}%;height:100%;background:linear-gradient(90deg,#4493f8,#3fb950);border-radius:4px;transition:width .3s"></div>`;
    html += `</div>`;
    html += `<div style="font-size:12px;color:var(--muted)">进度: ${progressPct}% · 系统正在分批抓取历史数据，每10分钟自动补一批</div>`;
    html += `<div style="font-size:12px;color:var(--muted);margin-top:4px">达到${targetPeriods}期后将自动开始策略验证</div>`;
    html += `</div>`;
  }

  // ── 状态2：验证中（历史已满800期，但尚无通过验证的策略）───
  if (!isBackfilling && (signalStatus === 'verification_pending' || signalStatus === 'unknown')) {
    // 检查是否有任何玩法已验证
    const allModes = selectTypes.map(st => r[`select_${st}`]?.prediction_mode);
    for (const f of fushiTypes) allModes.push(r[f.key]?.prediction_mode);
    const anyValidated = allModes.some(m => m === 'validated');

    if (!anyValidated) {
      // 检查是否全部都未发现可验证策略（所有候选均未通过）
      const allNotVerified = allModes.every(m => m === 'not_verified' || m === undefined);
      const anyWarning = selectTypes.some(st => r[`select_${st}`]?.warning) || fushiTypes.some(f => r[f.key]?.warning);

      if (allNotVerified && anyWarning) {
        // 验证失败状态
        html += `<div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,#2a1a1a,#1a2230);border:1px solid #f85149;padding:16px 18px">`;
        html += `<div style="font-size:15px;font-weight:700;color:#f85149;margin-bottom:10px">❌ 未发现可验证策略</div>`;
        html += `<div style="font-size:13px;color:var(--muted);margin-bottom:6px">当前候选均未超过随机基线</div>`;
        html += `<div style="font-size:12px;color:var(--muted);margin-top:6px">历史数据: ${currentPeriods} / ${targetPeriods} 期 · 本玩法不输出号码</div>`;
        html += `</div>`;
      } else {
        // 验证中状态
        html += `<div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,#1a2230,#2a2a1a);border:1px solid #d29922;padding:16px 18px">`;
        html += `<div style="font-size:15px;font-weight:700;color:#d29922;margin-bottom:10px">⏳ 验证中</div>`;
        html += `<div style="font-size:13px;color:var(--text);margin-bottom:6px">历史数据已达到 ${currentPeriods} 期，正在运行训练、验证、封存测试</div>`;
        html += `<div style="font-size:12px;color:var(--muted);margin-top:6px">当前状态: 暂不输出推荐 · 原因: 尚无通过验证的策略</div>`;
        html += `</div>`;
      }
    }
  }

  // ── 状态3：已验证（至少一个玩法有validated策略）───
  if (signalStatus === 'validated') {
    html += `<div class="note" style="color:#2ea043;margin-bottom:12px;font-weight:700">✅ 已验证策略：当前启用策略已通过严格回测验证。</div>`;
  }

  // 最近开奖结果（始终显示）
  if (r.recent_results && r.recent_results.length > 0) {
    const isMobile = window.innerWidth <= 768;
    const showCount = isMobile ? 3 : 5;
    html += `<div class="card" style="margin-bottom:16px">`;
    html += `<div class="section-title" style="font-size:14px;margin-bottom:8px">最近开奖结果 ${isMobile ? '(近' + showCount + '期)' : ''}</div>`;
    for (const rec of r.recent_results.slice(0, showCount)) {
      html += `<div class="lottery-row kl8-lottery-row">`;
      html += `<span class="lottery-issue">${esc(rec.issue)}</span>`;
      html += `<span class="lottery-numbers kl8-lottery-balls" style="font-size:13px;letter-spacing:1px;gap:4px">`;
      const nums = rec.numbers || [];
      const lastSet = new Set(r.statistics?.last_numbers || []);
      for (const n of nums) {
        const isHighlight = lastSet.has(n);
        html += `<span class="kl8-ball small-ball ${isHighlight ? 'highlight-ball' : ''}" style="width:26px;height:26px;font-size:10px;display:inline-flex">${String(n).padStart(2,'0')}</span>`;
      }
      html += `</span>`;
      html += `<span class="lottery-date">${esc(rec.date)}</span>`;
      html += `</div>`;
    }
    html += `</div>`;
  }

  // ── 本期变化对比信息（仅在有已验证策略时显示）───
  const changeInfo = r.change_info || {};
  if (changeInfo.has_previous && signalStatus === 'validated') {
    html += `<div class="card" style="margin-bottom:12px;padding:10px 14px;border-left:3px solid #4493f8">`;
    html += `<div style="font-size:13px;font-weight:600;margin-bottom:6px;color:#4493f8">📊 本期相较上期变化</div>`;
    html += `<div style="font-size:11px;color:#8b949e;margin-bottom:8px">`;
    html += `本期基准: ${esc(changeInfo.current_based_on)} · 上期基准: ${esc(changeInfo.previous_based_on)}`;
    html += `</div>`;
    const poolChanges = changeInfo.pool_changes || {};
    if (poolChanges.changed === 0) {
      html += `<div style="font-size:12px;color:#8b949e;margin-bottom:6px">候选池延续：当前数据更新后，前20排名未发生变化</div>`;
    } else {
      html += `<div style="font-size:12px;margin-bottom:6px">`;
      html += `<span style="color:#4493f8">候选池变化</span>: `;
      html += `<span style="color:#da3633;font-weight:600">${poolChanges.changed}</span>`;
      html += ` / <span style="color:#8b949e">${poolChanges.total_pool_size}</span>`;
      html += ` 号号替换`;
      html += `</div>`;
    }
    const playChanges = changeInfo.play_changes || {};
    for (const st of selectTypes) {
      const key = `select_${st}`;
      const pc = playChanges[key];
      if (!pc || pc.changed_count === 0) continue;
      html += `<div style="font-size:11px;margin-bottom:4px">`;
      html += `<span style="color:#4493f8">选${st}</span>: `;
      if (pc.removed && pc.removed.length > 0) {
        html += `<span style="color:#da3633">-${pc.removed.map(n=>String(n).padStart(2,'0')).join(',')}</span> `;
      }
      if (pc.added && pc.added.length > 0) {
        html += `<span style="color:#2ea043">+${pc.added.map(n=>String(n).padStart(2,'0')).join(',')}</span>`;
      }
      html += `</div>`;
    }
    for (const f of fushiTypes) {
      const fpc = playChanges[f.key];
      if (fpc && fpc.changed_count > 0) {
        html += `<div style="font-size:11px;margin-bottom:4px">`;
        html += `<span style="color:#4493f8">${esc(f.label)}</span>: `;
        if (fpc.removed && fpc.removed.length > 0) {
          html += `<span style="color:#da3633">-${fpc.removed.map(n=>String(n).padStart(2,'0')).join(',')}</span> `;
        }
        if (fpc.added && fpc.added.length > 0) {
          html += `<span style="color:#2ea043">+${fpc.added.map(n=>String(n).padStart(2,'0')).join(',')}</span>`;
        }
        html += `</div>`;
      }
    }
    html += `<div style="font-size:11px;color:#8b949e;margin-top:4px">变化原因: ${esc(changeInfo.change_reason || '数据更新')}</div>`;
    html += `<div style="font-size:11px;margin-top:4px">置信等级: <span style="font-weight:600;color:${changeInfo.confidence_level==='低'?'#9a6700':'#2ea043'}">${esc(changeInfo.confidence_level || '低')}</span> · 策略状态: ${esc(changeInfo.strategy_status || '验证中')}</div>`;
    html += `</div>`;
  }

  // 候选池（仅在有已验证策略时显示）
  if (signalStatus === 'validated') {
    const sel5 = r.select_5;
    if (sel5 && sel5.candidates && sel5.candidates.length > 0) {
      html += `<div class="card" style="margin-bottom:12px;padding:10px 14px">`;
      html += `<div style="font-size:13px;font-weight:600;margin-bottom:8px">候选号码池 <span style="font-size:11px;color:#8b949e">(基于选5策略)</span></div>`;
      html += `<div style="display:flex;flex-wrap:wrap;gap:4px;line-height:1.6">`;
      for (const item of sel5.candidates.slice(0, 15)) {
        const num = typeof item === 'object' ? item[0] : item;
        const isAnyPick = selectTypes.some(st => (r[`select_${st}`]?.numbers || []).includes(num));
        if (isAnyPick) {
          html += `<span class="kl8-ball highlight-ball" style="width:28px;height:28px;font-size:11px">${String(num).padStart(2,'0')}</span> `;
        } else {
          html += `<span class="kl8-ball small-ball">${String(num).padStart(2,'0')}</span> `;
        }
      }
      html += `</div>`;
      html += `<div style="font-size:11px;color:var(--muted);margin-top:6px">以上号码为候选池排名前15，高亮球为任一玩法的推荐号</div>`;
      html += `</div>`;
    }
  }

  // 各玩法推荐号码 — v9.2: verification_pending状态不显示号码
  const hasAnyNumbers = selectTypes.some(st => {
    const sel = r[`select_${st}`];
    return sel && sel.numbers && sel.numbers.length > 0;
  });

  if (hasAnyNumbers) {
    html += `<div class="card" style="margin-bottom:16px">`;
    html += `<div class="section-title" style="font-size:15px;margin-bottom:12px">推荐号码</div>`;
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">`;

    for (const st of selectTypes) {
      const key = `select_${st}`;

      if (!sel || !sel.numbers || sel.numbers.length === 0) continue;

      const isRef = sel.prediction_mode === 'reference_unvalidated';

      const badgeText = isRef ? '参考' : '已验证';

      html += `<div class="kl8-numbers-row">`;

        if (addedSet.has(n)) {

    const isRef = fushi.prediction_mode === 'reference_unvalidated';
    const border = isRef ? '#ffcc02' : '#2ea043';
    const badge = isRef ? '参考' : '已验证';
    const badgeColor = isRef ? '#9a6700' : '#2ea043';
    const comboPick = fushi.combo_pick || (f.key === 'fu_shi_10_11' ? 10 : 5);

    if (fushi.strategy_id) {
      html += `<div style="font-size:11px;color:#8b949e;margin-bottom:4px">策略: ${esc(fushi.strategy_id)}</div>`;
    }
    html += `<div class="section-title" style="font-size:14px;margin-bottom:8px">${esc(f.coreLabel)}</div>`;
    html += `<div class="kl8-fushi-top7">`;
    for (const n of coreNumbers) {
      html += `<span class="kl8-ball highlight-ball" style="width:44px;height:44px;font-size:18px">${String(n).padStart(2,'0')}</span>`;

    html += `</div>`;
    html += `<div class="section-title" style="font-size:14px;margin-bottom:8px">全部 C(${poolSize},${comboPick}) = ${fushi.total_combinations} 组组合</div>`;
    html += `<div class="kl8-fushi-grid">`;
    for (const combo of fushi.combinations || []) {
      html += `<div class="kl8-combo-item">`;
      for (const n of combo) {
        html += `<span>${String(n).padStart(2,'0')}</span> `;
      }
      html += `</div>`;
    }
    html += `</div>`;
    if (isRef && fushi.warning) {
      html += `<div style="font-size:11px;color:#9a6700;margin-top:6px">⚠ ${esc(fushi.warning)}</div>`;
    }
    html += `</div>`;
  }

  // 号码排名Top20（仅在有已验证策略时显示）
  if (signalStatus === 'validated' && r.ranking && r.ranking.length > 0) {
    html += `<div class="card" style="margin-bottom:16px">`;
    html += `<div class="section-title" style="font-size:14px;margin-bottom:8px">号码排名 (Top20) — 启发式排序值，非开出概率</div>`;

function renderKL8ParameterSearch(result) {
  const target = document.getElementById('kl8-parameter-search-result');
  if (!target) return;

  if (!result || result.error) {
    target.innerHTML = `<div class="status error" style="margin-top:16px">${esc(result?.error || '参数搜索失败')}</div>`;
    return;
  }

  const bestByPlay = result.best_by_play || {};
  const playTypes = result.play_types || Object.keys(bestByPlay);
  let html = `<div class="card" style="margin-top:16px;margin-bottom:16px">`;
  html += `<div class="section-title" style="font-size:15px;margin-bottom:10px">快乐8参数搜索结果</div>`;
  html += `<div class="note" style="margin-bottom:10px">候选数: ${esc(result.candidate_count || 0)} · 数据期数: ${esc(result.total_periods || '-')} · 仅展示候选，不自动激活</div>`;
  if (result.report_file) {
    html += `<div class="note" style="margin-bottom:10px">报告文件: ${esc(result.report_file)}</div>`;
  }
  html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">`;

  for (const playType of playTypes) {
    const item = bestByPlay[playType];
    if (!item) continue;
    const strategy = item.strategy || {};
    const label = playType.startsWith('select_') ? `选${playType.replace('select_', '')}` : playType;
    const valLift = Number(item.validation_lift || 0);
    const finalLift = Number(item.final_test_lift || 0);
    const liftColor = valLift > 0 ? '#2ea043' : '#f85149';
    html += `<div class="kl8-select-card" style="border-color:${liftColor}">`;
    html += `<div class="kl8-select-title">${esc(label)} · ${esc(item.candidate || '-')}</div>`;
    html += `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">score ${esc(item.score ?? '-')} · window ${esc(strategy.window_size || '-')}</div>`;
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px">`;
    html += `<div>验证Lift: <span style="color:${liftColor};font-weight:700">${valLift.toFixed(4)}</span></div>`;
    html += `<div>封存Lift: <span style="color:${finalLift > 0 ? '#2ea043' : '#8b949e'};font-weight:700">${finalLift.toFixed(4)}</span></div>`;
    html += `<div>均值命中: ${esc(item.validation_mean_hits ?? '-')}</div>`;
    html += `<div>随机基线: ${esc(item.expected_random ?? '-')}</div>`;
    html += `<div>重号方向: ${esc(strategy.repeat_direction || 'neutral')}</div>`;
    html += `<div>重号上限: ${esc(strategy.pool_max_last_numbers ?? 'auto')}</div>`;
    html += `<div>候选池分散: ${strategy.pool_diversify === false ? '关闭' : '开启'}</div>`;
    html += `<div>ROI: ${esc(item.validation_profit_roi ?? '-')}</div>`;
    html += `</div>`;
    html += `</div>`;
  }

  html += `</div></div>`;
  target.innerHTML = html;
}

async function pollKL8ParameterSearch(jobId) {
  const target = document.getElementById('kl8-parameter-search-result');
  for (let attempt = 0; attempt < 900; attempt++) {
    const data = await fetchJson('/api/kl8/parameter-search/status?job_id=' + encodeURIComponent(jobId) + '&_=' + Date.now());
    if (data.error) {
      renderKL8ParameterSearch({ error: data.error });
      return;
    }

    const job = data.result || {};
    if (job.status === 'completed') {
      const result = job.result || {};
      result.report_file = job.report_file;
      renderKL8ParameterSearch(result);
      return;
    }

    if (job.status === 'failed') {
      renderKL8ParameterSearch({ error: job.error || job.message || '参数搜索失败' });
      return;
    }

    if (target) {
      target.innerHTML = `<div class="status" style="margin-top:16px"><span class="spinner"></span>参数搜索${esc(job.status || 'running')} · 已用 ${esc(job.elapsed_seconds ?? 0)} 秒</div>`;
    }
    await new Promise(resolve => setTimeout(resolve, 2000));
  }
  renderKL8ParameterSearch({ error: '参数搜索超时' });
}

async function runKL8ParameterSearch() {
  const target = document.getElementById('kl8-parameter-search-result');
  if (target) {
    target.innerHTML = `<div class="status" style="margin-top:16px"><span class="spinner"></span>正在启动快乐8参数搜索...</div>`;
  }

  try {
    const data = await fetchJson('/api/kl8/parameter-search/start?max_candidates=80&top_n=5&_=' + Date.now());
    if (data.error) {
      renderKL8ParameterSearch({ error: data.error });
      return;
    }
    const job = data.result || {};
    if (!job.job_id) {
      renderKL8ParameterSearch({ error: '未返回任务ID' });
      return;
    }
    await pollKL8ParameterSearch(job.job_id);
  } catch (e) {
    const msg = /504|Gateway Time-out|接口不存在/.test(e.message)
      ? `${e.message}；请确认后端服务已重启到最新版本，然后再点参数搜索`
      : e.message;
    renderKL8ParameterSearch({ error: msg });
  }
}

async function fetchKL8Data() {
  const appKL8 = document.getElementById('app-kl8');
  const originalContent = appKL8.innerHTML;
  appKL8.innerHTML = `<div class="status"><span class="spinner"></span>正在抓取最新快乐8开奖数据…</div>`;

  try {
    const data = await fetchJson('/api/kl8/fetch');
    if (data.error) {
      appKL8.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }

    const success = data.success || false;
    const message = data.message || '';
    const latestIssue = data.latest_issue || '';

    if (data.result) {
      renderKL8(data.result);
    }

    // Toast

    toast.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:${success ? '#2ea043' : '#f85149'};color:white;padding:12px 24px;border-radius:8px;font-size:14px;z-index:1000;`;
    toast.innerHTML = `${success ? '✅' : '❌'} ${message}${latestIssue ? ' · 最新期号: ' + latestIssue : ''}`;

    appKL8.innerHTML = `<div class="status error">抓取失败: ${esc(e.message)}</div>`;

function fmtPctValue(value) {
  return typeof value === 'number' && Number.isFinite(value) ? `${(value * 100).toFixed(1)}%` : '-';
}

function fmtNumValue(value, digits = 3) {
  return typeof value === 'number' && Number.isFinite(value) ? value.toFixed(digits) : '-';
}

let syncStampTimer = null;

function formatSyncStamp(value) {
  if (!value) {
    return { text: '尚未同步', detail: '点击下方按钮执行一次同步', state: 'missing' };
  }
  const normalized = String(value).replace(' ', 'T');
  const date = new Date(normalized);
  const display = String(value).replace('T', ' ').slice(0, 19);
  if (Number.isNaN(date.getTime())) {
    return { text: display || '-', detail: '时间格式异常', state: 'stale' };
  }
  const diffMs = Date.now() - date.getTime();
  const absMs = Math.abs(diffMs);
  const minutes = Math.floor(absMs / 60000);
  let age = '刚刚';
  if (minutes >= 1440) age = `${Math.floor(minutes / 1440)} 天前`;
  else if (minutes >= 60) age = `${Math.floor(minutes / 60)} 小时前`;
  else if (minutes >= 1) age = `${minutes} 分钟前`;
  const state = diffMs > 24 * 60 * 60 * 1000 ? 'stale' : '';
  return { text: age, detail: display, state };
}

function updateSyncStampAges(root = document) {
  root.querySelectorAll('[data-sync-at]').forEach(el => {
    const stamp = formatSyncStamp(el.dataset.syncAt);
    const textEl = el.querySelector('[data-sync-age]');
    const detailEl = el.querySelector('[data-sync-detail]');
    if (textEl) textEl.textContent = stamp.text;
    if (detailEl) detailEl.textContent = stamp.detail;
    el.classList.toggle('stale', stamp.state === 'stale');
    el.classList.toggle('missing', stamp.state === 'missing');
  });
}

function startSyncStampTimer() {
  if (syncStampTimer) clearInterval(syncStampTimer);
  syncStampTimer = setInterval(() => updateSyncStampAges(), 60000);
}

    html += renderFootballDiagnostics(diagnostics);

    // ── 操作按钮 ──
    html += `<div style="display:flex;gap:10px;margin-bottom:16px">
      <button type="button" onclick="triggerSync()" style="flex:1;padding:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer">
        🔁 立即同步一次
      </button>
      <button type="button" onclick="runFootballReview(false)" style="flex:1;padding:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer">
        赛后复盘
      </button>
      <button type="button" onclick="runFootballReview(true)" style="flex:1;padding:10px;background:var(--card2);color:var(--warn);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer">
        复盘+修复
      </button>
      ${sync.failed > 0 ? `<button type="button" onclick="hideFailedRecords()" style="flex:1;padding:10px;background:var(--card2);color:var(--muted);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer">
        🧹 隐藏失败记录
      </button>` : ''}
    </div>`;
    
    // ── 预测记录列表 ──
    html += `<div class="section-title">📋 预测记录（共 ${records.length} 条）</div>`;
    
    if (records.length === 0) {
      html += `<div class="card">
        <div class="status" style="padding:20px">暂无预测记录。点击足球预测标签页查看比赛并进行预测。</div>
      </div>`;
    } else {
      records.forEach((record, idx) => {
        const statusMap = {
          'pending': { label: '等待自动同步', color: 'var(--muted)' },
          'ready': { label: '准备同步', color: 'var(--warn)' },
          'synced': { label: '已回填', color: 'var(--accent2)' },
          'retry': { label: '重试中', color: 'var(--warn)' },
          'failed': { label: '同步失败', color: 'var(--away)' },
          'ignored': { label: '已隐藏', color: 'var(--muted)' },
        };
        const status = statusMap[record.sync_status] || statusMap['pending'];
        
        // 获取预测比分Top1
        const predictedScores = record.predicted_scores || {};
        const topScore = Object.entries(predictedScores).sort((a, b) => b[1] - a[1])[0];
        const topScoreStr = topScore ? `${topScore[0]} (${(topScore[1] * 100).toFixed(1)}%)` : '-';
        
        html += `<div class="card" style="${idx > 0 ? 'margin-top:8px' : ''}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-weight:600;font-size:15px">${esc(record.home)} vs ${esc(record.away)}</div>
              <div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(record.league || '')} · ${esc(record.match_time || '')}</div>
            </div>
            <div style="text-align:right">
              <div style="color:${status.color};font-size:13px;font-weight:500">${status.label}</div>
              ${record.sync_attempts > 0 ? `<div style="color:var(--muted);font-size:11px">失败${record.sync_attempts}次</div>` : ''}
            </div>
          </div>`;
        
        if (record.settled) {
          // 已结算
          const hitTop1 = record.hit_top1 ? '✅' : '❌';
          const hitTop3 = record.hit_top3 ? '✅' : '❌';
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:16px;font-size:13px">
            <div><span style="color:var(--muted)">预测：</span>${topScoreStr}</div>
            <div><span style="color:var(--muted)">实际：</span><b style="color:var(--accent2)">${esc(record.actual_score || '-')}</b></div>
            <div><span style="color:var(--muted)">Top1：</span>${hitTop1}</div>
            <div><span style="color:var(--muted)">Top3：</span>${hitTop3}</div>
          </div>`;
        } else if (record.sync_status === 'failed') {
          // 同步失败
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px">
            <div style="color:var(--away)">失败原因：${esc(record.last_sync_error || '未知')}</div>
            ${record.next_sync_at ? `<div style="color:var(--muted);margin-top:2px">下次重试：${record.next_sync_at?.replace('T', ' ').slice(0, 16) || '-'}</div>` : ''}
          </div>`;
        } else {
          // 待同步
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px">
            <div><span style="color:var(--muted)">预测Top1：</span>${topScoreStr}</div>
            ${record.next_sync_at ? `<div style="color:var(--muted);margin-top:2px">预计同步：${record.next_sync_at?.replace('T', ' ').slice(0, 16) || '-'}</div>` : ''}
          </div>`;
        }
        
        html += `</div>`;
      });
    }
    
    app.innerHTML = html;
    updateSyncStampAges(app);
    startSyncStampTimer();
  } catch (e) {
    app.innerHTML = `<div class="status error">加载失败：${esc(e.message)}</div>`;
  }
}

async function triggerSync() {
  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = '同步中...';
  btn.disabled = true;
  
  try {
    const data = await fetchJson('/api/sync/trigger');
    if (data.result) {
      alert(`同步完成：${data.result.message || '同步成功'}`);
      loadPredictions();
    } else {
      alert('同步失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('同步失败：' + e.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function runFootballReview(repair = false) {
  if (repair && !confirm('确定执行复盘修复吗？会重置提前回填，并把低可信样本排除出校准。')) return;

  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = repair ? '修复中...' : '复盘中...';
  btn.disabled = true;

  try {
    const data = await fetchJson(`/api/football/review?repair=${repair ? 1 : 0}`);
    if (!data.result) {
      alert('复盘失败：' + (data.error || '未知错误'));
      return;
    }

    const result = data.result || {};
    const audit = result.audit || {};
    const rolling = result.rolling || {};
    const tuning = result.tuning || {};
    const plan = tuning.plan || {};
    const sync = result.sync || {};
    const message = [
      '复盘完成',
      `同步：${sync.message || '-'}`,
      `审计问题：${audit.issue_count || 0}`,
      `已修复：${audit.repaired_count || 0}`,
      `可用样本：${rolling.available_samples || 0}`,
      `调参预案：${plan.reason || tuning.error || '暂无'}`
    ].join('\n');

    alert(message);
    loadPredictions();
  } catch (e) {
    alert('复盘失败：' + e.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function hideFailedRecords() {
  if (!confirm('确定要隐藏所有失败记录吗？')) return;
  
  try {
    const data = await fetchJson('/api/sync/hide_failed');
    if (data.result?.success) {
      alert('已隐藏所有失败记录');
      loadPredictions();
    } else {
      alert('操作失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('操作失败：' + e.message);
  }
}

initPage();
</script>
</body>
</html>
