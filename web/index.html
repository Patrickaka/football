async function refreshLottery3d(withBacktest = false) {
  const btn = document.getElementById('refresh-3d');
  btn.style.opacity = '0.5';
  btn.style.cursor = 'not-allowed';
  
  app3d.innerHTML = `<div class="status"><span class="spinner"></span>${withBacktest ? '正在刷新数据并回测…' : '正在重新抓取数据并计算…'}</div>`;
  
  try {
    const result = await fetchJsonPost('/api/3d-refresh' + (withBacktest ? '?backtest=1' : ''));
    
    // 异步后台模式：轮询等待完成（避免504超时）
    if (result.processing && result.task_id) {
      const taskId = result.task_id;
      const startTime = Date.now();
      const pollInterval = 3000;
      const maxWaitSec = 1200;
      while ((Date.now() - startTime) / 1000 < maxWaitSec) {
        await new Promise(r => setTimeout(r, pollInterval));
        try {
          const statusData = await fetchJson('/api/lottery/task-status?_=' + Date.now());
          const taskInfo = statusData[taskId];
          if (!taskInfo) continue;  // 任务记录可能被清理，继续轮询
          const elapsedSec = Math.round((Date.now() - startTime) / 1000);
          if (taskInfo.status === 'processing') {
            let msg = `后台计算中…<br><small style="color:var(--muted)">已耗时 ${elapsedSec} 秒</small>`;
            if (taskInfo.message) msg += `<br><small style="color:var(--muted)">${esc(taskInfo.message)}</small>`;
            if (elapsedSec > 300) msg += `<br><small style="color:var(--muted)">计算量较大，请继续等待，关闭页面不影响后台运行</small>`;
            app3d.innerHTML = `<div class="status"><span class="spinner"></span>${msg}</div>`;
            continue;
          }
          if (taskInfo.status === 'done') {
            await loadLottery3d(true);
            return;
          }
          if (taskInfo.status === 'error') {
            app3d.innerHTML = `<div class="status error">✗ 刷新失败: ${esc(taskInfo.error || '未知错误')}</div>`;
            return;
          }
        } catch (e) {
          console.error('轮询3D任务状态失败:', e);
        }
      }
      app3d.innerHTML = `<div class="status error">✗ 刷新超时（已超过20分钟），请稍后手动刷新</div>`;
      return;
    }
    
    // 兜底：同步返回结果
    if (result.success) {
      console.log('3D缓存刷新成功:', result);
      // 刷新成功后重新加载数据
      await loadLottery3d(true);
    } else {
      app3d.innerHTML = `<div class="status error">✗ 刷新失败: ${esc(result.error || '未知错误')}</div>`;
    }
  } catch (error) {
    console.error('3D刷新失败:', error);
    app3d.innerHTML = `<div class="status error">✗ 刷新失败: ${esc(error.message)}</div>`;
  } finally {
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
  }
}

async function runMLPrediction() {
  app3d.innerHTML = `<div class="status"><span class="spinner"></span>正在运行 ML 预测（可能需要 30-60 秒）…</div>`;
  try {
    const data = await fetchJson('/api/3d-ml?_=' + Date.now());
    if (data.error) {
      app3d.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    if (data.result?.error) {
      app3d.innerHTML = `<div class="status error">✗ ${esc(data.result.error)}</div>`;
      return;
    }
    renderMLResult(data.result);
  } catch (e) {
    app3d.innerHTML = `<div class="status error">ML 预测失败：${esc(e.message)}</div>`;
  }
}

function renderMLResult(r) {
  let html = '';

  // 模型信息显示
  const modelInfo = r.model_info || (r.model_type === 'lightgbm' ? 'LightGBM (快)' : '纯 Python 随机森林 (慢)');
  // 性能仅标注速度；不写死"准确率"——3D为公平摇奖，真实命中以下方回测面板(对比随机基线+置换p值)为准。
  const speedInfo = r.model_type === 'lightgbm' ? '⚡ 3-8 秒' : '🐢 15-30 秒';

  // ── ML 预测标题 ──
  html += `<div class="section-title">【福彩 3D ML 预测结果】</div>`;
  html += `<div class="highlight">
    <div class="row"><span class="k">模型类型</span><span class="v">${esc(modelInfo)}</span></div>
    <div class="row"><span class="k">性能</span><span class="v">${esc(speedInfo)}</span></div>
    <div class="row"><span class="k">训练样本</span><span class="v">${r.total_samples} (正例：${r.pos_samples}, 负例：${r.neg_samples})</span></div>
    <div class="row"><span class="k">特征维度</span><span class="v">36 维</span></div>
  </div>`;

  // ── 直选推荐 ──
  const recs = r.recommendations || [];
  html += `<div class="section-title">【直选推荐 ${recs.length} 注】（按模型分排序）</div>`;
  html += `<div class="card">
    <div class="note" style="margin-bottom:10px">模型分：ML模型输出的原始分数 · 相对占比：在Top${recs.length}中的权重占比</div>`;
  recs.forEach((item, i) => {
    const marker = i < 3 ? '★' : ' ';
    const model_score = typeof item.model_score === 'number' ? item.model_score : 0;
    html += `<div class="zhixuan">
      <span class="rank">${marker} ${String(i + 1).padStart(2, '0')}</span>
      <span class="num">${esc(item.num || '---')}</span>
      <span class="bar"><i style="width:${(model_score * 100).toFixed(0)}%"></i></span>
      <span class="score">${model_score.toFixed(3)}</span></div>`;
  });
  html += `</div>`;

  // ── Top3 独立显示 ──
  const top3 = r.top3 || [];
  html += `<div class="section-title">【Top3 重点推荐】</div>`;
  html += `<div class="highlight" style="border-color:var(--warn)">`;
  top3.forEach((item, i) => {
    const model_score = typeof item.model_score === 'number' ? item.model_score : 0;
    const topk_share = typeof item.topk_score_share === 'number'
      ? item.topk_score_share
      : (typeof item.relative_prob === 'number' ? item.relative_prob : 0);
    html += `<div class="row"><span class="k">第${i + 1}推荐</span>
      <span class="v"><b style="font-size:22px;letter-spacing:4px;color:var(--accent2)">${esc(item.num || '---')}</b> · 模型分 ${model_score.toFixed(3)} · Top${recs.length}占比 ${(topk_share * 100).toFixed(1)}%</span></div>`;
  });
  html += `</div>`;

  // ── 诊断区 4: 规则 vs ML 对比 ──
  if (r.rule_recommendations) {
    const ruleSet = new Set(r.rule_recommendations.map(x => x.num));
    const mlSet = new Set(r.recommendations.map(x => x.num));
    const both = [...ruleSet].filter(x => mlSet.has(x));
    const ruleOnly = [...ruleSet].filter(x => !mlSet.has(x));
    const mlOnly = [...mlSet].filter(x => !ruleSet.has(x));
    
    html += `<div class="section-title">⚖️ 规则模型 vs ML 模型对比</div>`;
    html += `<div class="card">
      <div class="row"><span class="k">共同推荐</span><span class="v" style="color:var(--accent2)">${both.length} 注</span></div>
      <div class="row"><span class="k">仅规则推荐</span><span class="v">${ruleOnly.length} 注</span></div>
      <div class="row"><span class="k">仅 ML 推荐</span><span class="v">${mlOnly.length} 注</span></div>`;
    
    if (both.length > 0) {
      html += `<div class="row"><span class="k">共同号码</span><span class="v" style="color:var(--accent2);letter-spacing:2px">${both.join(' ')}</span></div>`;
    }
    if (ruleOnly.length > 0) {
      html += `<div class="row"><span class="k">规则独有</span><span class="v">${ruleOnly.join(' ')}</span></div>`;
    }
    if (mlOnly.length > 0) {
      html += `<div class="row"><span class="k">ML 独有（探索）</span><span class="v">${mlOnly.join(' ')}</span></div>`;
    }
    html += `<div class="note">共同推荐=高置信 · 规则独有=经验偏好 · ML独有=探索候选</div>`;
    html += `</div>`;
  }

  // ── 特征重要性 ──
  html += `<div class="section-title">【特征重要性】（36 维特征）</div>`;
  html += `<div class="card">`;
  html += `<div class="note" style="margin-bottom:8px">特征按重要性排序（前 10 个）</div>`;
  html += `<div class="digit-grid" style="grid-template-columns:repeat(2,1fr)">`;
  r.feature_importance.slice(0, 10).forEach((item, i) => {
    const featName = typeof item[0] === 'string' ? item[0] : '未知特征';
    const featScore = typeof item[1] === 'number' ? `(${(item[1]*100).toFixed(1)}%)` : '';
    html += `<div class="digit-cell"><div class="d">${i + 1}</div><div class="s" style="font-size:11px">${esc(featName)} ${esc(featScore)}</div></div>`;
  });
  html += `</div></div>`;

  // ── 返回按钮 ──
  html += `<div class="status" style="padding:12px 0;font-size:13px">
    <span style="cursor:pointer;color:var(--accent2)" id="back-to-3d">‹ 返回传统预测</span>
    <span style="margin:0 12px;color:var(--line)">|</span>
    <span style="cursor:pointer;color:var(--accent2)" id="run-ml-again">🔄 重新运行 ML</span>
  </div>`;

  app3d.innerHTML = html;
  document.getElementById('back-to-3d').onclick = () => loadLottery3d(true);
  document.getElementById('run-ml-again').onclick = () => runMLPrediction();
}

async function loadLottery3d(force) {
  if (lottery3dLoaded && !force) return;
  app3d.innerHTML = `<div class="status"><span class="spinner"></span>正在抓取开奖数据并计算…</div>`;
  try {
    console.log('开始加载3D数据...');
    const data = await fetchJson('/api/3d?_=' + Date.now());
    console.log('3D数据加载完成:', data);
    
    if (data.error) {
      app3d.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    if (!data.result) {
      app3d.innerHTML = `<div class="status error">✗ 未获取到数据</div>`;
      return;
    }
    if (data.result.error) {
      app3d.innerHTML = `<div class="status error">✗ ${esc(data.result.error)}</div>`;
      return;
    }
    
    lottery3dLoaded = true;
    renderLottery3d(data.result);
  } catch (e) {
    console.error('3D数据加载失败:', e);
    app3d.innerHTML = `<div class="status error">加载失败：${esc(e.message)}</div>`;
  }
}

// ── 排列五相关函数 ──
let pailie5Loaded = false;

async function loadPailie5() {
  if (pailie5Loaded) return;
  const appPailie5 = document.getElementById('app-pailie5');
  appPailie5.innerHTML = `<div class="status"><span class="spinner"></span>正在加载排列五数据…</div>`;
  try {
    const data = await fetchJson('/api/pailie5?_=' + Date.now());
    if (data.error) {
      appPailie5.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    pailie5Loaded = true;
    renderPailie5(data.result);
  } catch (e) {
    appPailie5.innerHTML = `<div class="status error">加载失败：${esc(e.message)}</div>`;
  }
}

async function fetchPailie5Data() {
  const appPailie5 = document.getElementById('app-pailie5');
  appPailie5.innerHTML = `<div class="status"><span class="spinner"></span>正在抓取最新开奖号码并重新分析…</div>`;
  
  try {
    const data = await fetchJson('/api/pailie5/fetch');
    if (data.error) {
      appPailie5.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    
    const result = data.result || {};
    const success = result.success || false;
    const message = result.message || '';
    const latestIssue = result.latest_issue || '';
    
    // 如果服务器返回了重新分析的数据，直接渲染分析结果
    if (result.analysis) {
      pailie5Loaded = true;
      renderPailie5(result.analysis);
      return;
    }
    
    // 备用：显示抓取结果和返回按钮
    let html = `<div class="card">`;
    html += `<div class="highlight">`;
    if (success) {
      html += `<div class="big">✓ ${esc(message)}</div>`;
      html += `<div class="sub">最新期号：${esc(latestIssue)}</div>`;
    } else {
      html += `<div class="big">⚠ ${esc(message)}</div>`;
      html += `<div class="sub">最新期号：${esc(latestIssue)}</div>`;
    }
    html += `</div>`;
    
    // 显示最新结果
    const results = result.results || [];
    if (results.length > 0) {
      html += `<div class="section-title" style="font-size:13px;margin:12px 0 8px">最新开奖结果</div>`;
      results.forEach((item, idx) => {
        const nums = (item.numbers || []).join(' ');
        html += `<div class="row" style="${idx > 0 ? 'border-top:1px solid var(--line);margin-top:8px;padding-top:8px' : ''}">
          <span class="k" style="width:100px">${esc(item.issue || '')}</span>
          <span class="v" style="font-size:18px;font-weight:700;letter-spacing:8px;color:#f85149">${nums}</span>
          <span style="color:var(--muted)">${esc(item.date || '')}</span>
        </div>`;
      });
    }
    
    html += `<button type="button" style="width:100%;margin-top:12px;padding:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer" onclick="event.stopPropagation(); pailie5Loaded=false; loadPailie5();">← 返回统计分析</button>`;
    html += `</div>`;
    
    appPailie5.innerHTML = html;
  } catch (e) {
    appPailie5.innerHTML = `<div class="status error">抓取失败：${esc(e.message)}</div>`;
  }
}

function renderPailie5(r) {
  const appPailie5 = document.getElementById('app-pailie5');
  const stats = r.statistics || {};
  const recent = r.recent_results || [];
  
  let html = '';
  
  // ── 标题 ──
  html += `<div class="section-title">【排列五数据分析】</div>`;
  
  // ── 数据提示 ──
  const latestDate = recent.length > 0 ? recent[0].date : '未知';
  const latestIssue = recent.length > 0 ? recent[0].issue : '未知';
  html += `<div class="highlight">
    <div style="font-size:14px;color:var(--muted);margin-bottom:4px">最新一期</div>
    <div class="big" style="font-size:24px;color:#f85149">${recent[0]?.numbers?.join(' ')}</div>
    <div class="sub">${latestIssue} 期 · ${latestDate}</div>
  </div>`;
  
  // ── 基本统计 ──
  html += `<div class="card">
    <div class="row"><span class="k">数据期数</span><span class="v">${stats.total_issues || 0} 期</span></div>
  </div>`;
  
  // ── 抓取按钮 ──
  html += `<button type="button" style="width:100%;margin:10px 0;padding:10px;background:#4493f8;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer" onclick="fetchPailie5Data()">🔄 抓取最新开奖号码</button>`;
  
  // ── 最近开奖结果 ───
  html += `<div class="section-title">最近开奖结果</div>`;
  html += `<div class="card">`;
  recent.forEach((item, i) => {
    const nums = item.numbers?.join(' ') || '-';
    html += `<div class="row" style="${i > 0 ? 'border-top:1px solid var(--line);margin-top:8px;padding-top:8px' : ''}">
      <span class="k" style="width:100px">${item.issue || '未知期'}</span>
      <span class="v" style="font-size:18px;font-weight:700;letter-spacing:8px;color:#f85149">${nums}</span>
      <span style="color:var(--muted)">${item.date || ''}</span>
    </div>`;
  });
  html += `</div>`;
  
  // ── 号码频率 ──
  html += `<div class="section-title">号码频率统计</div>`;
  html += `<div class="card">`;
  const freq = stats.frequency || {};
  for (let i = 0; i <= 9; i++) {
    const count = freq[i] || 0;
    const maxFreq = Math.max(...Object.values(freq), 1);
    const percent = (count / maxFreq * 100).toFixed(0);
    html += `<div class="zhixuan">
      <span class="rank">${i}</span>
      <span class="num">${count}次</span>
      <span class="bar"><i style="width:${percent}%"></i></span>
      <span class="score">${percent}%</span>
    </div>`;
  }
  html += `</div>`;
  
  // ── 位置频率 ──
  html += `<div class="section-title">位置频率（每位 Top3）</div>`;
  html += `<div class="card">`;
  const posFreq = stats.position_frequency || [];
  posFreq.forEach((freq, pos) => {
    const sorted = Object.entries(freq || {}).sort((a, b) => b[1] - a[1]).slice(0, 3);
    html += `<div class="pos-block"><div class="pos-name">第${pos + 1}位</div><div class="pos-tags">`;
    sorted.forEach(([num, count]) => {
      html += `<span>${num}(${count}次)</span>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  
  // ── 热冷号 ──
  html += `<div class="section-title">热冷号分析</div>`;
  html += `<div class="card">`;
  const hot = stats.hot_numbers || [];
  const cold = stats.cold_numbers || [];
  html += `<div class="row"><span class="k">🔥 热门号码</span><span class="v">${hot.map(x => x[0] + '(' + x[1] + '次)').join(' · ')}</span></div>`;
  html += `<div class="row"><span class="k">❄ 冷门号码</span><span class="v">${cold.map(x => x[0] + '(' + x[1] + '次)').join(' · ')}</span></div>`;
  html += `</div>`;
  
  // ── 遗漏分析 ──
  html += `<div class="section-title">遗漏分析</div>`;
  html += `<div class="card">`;
  const currentGaps = stats.current_gaps || {};
  const avgGaps = stats.average_gaps || {};
  html += `<div class="row"><span class="k">当前遗漏（期）</span><span class="v">${Object.entries(currentGaps).filter(([k, v]) => v > 0).map(([k, v]) => k + ':' + v).join(' · ') || '无'}</span></div>`;
  html += `<div class="row"><span class="k">平均遗漏（期）</span><span class="v">${Object.entries(avgGaps).map(([k, v]) => k + ':' + v).join(' · ') || '无'}</span></div>`;
  html += `</div>`;
  
  // ── 滚动回测 ──
  const bt = r.backtest || {};
  if (bt && bt.trials) {
    html += `<div class="section-title">滚动回测（仅供参考）</div>`;
    html += `<div class="card">
      <div class="row"><span class="k">回测期数</span><span class="v">${bt.trials}</span></div>

      <div class="row"><span class="k">推荐池至少中2个数字</span><span class="v">${bt.ge2_digit_rate ? (bt.ge2_digit_rate * 100).toFixed(1) : '0'}%</span></div>
      <div class="row"><span class="k">推荐池至少中3个数字</span><span class="v">${bt.ge3_digit_rate ? (bt.ge3_digit_rate * 100).toFixed(1) : '0'}%</span></div>
    </div>`;
  }
  
  // ── 和值分析 ──
  html += `<div class="section-title">和值分析</div>`;
  html += `<div class="card">`;
  const sumAnal = stats.sum_analysis || {};
  html += `<div class="row"><span class="k">和值范围</span><span class="v">${sumAnal.min || 0} ~ ${sumAnal.max || 0}</span></div>`;
  html += `<div class="row"><span class="k">平均和值</span><span class="v">${sumAnal.avg || 0}</span></div>`;
  html += `<div class="row"><span class="k">热门和值</span><span class="v">${(sumAnal.most_common || []).map(x => x[0] + '(' + x[1] + ')').join(' · ') || '无'}</span></div>`;
  html += `</div>`;
  
  // ── 跨度分析 ──
  html += `<div class="section-title">跨度分析</div>`;
  html += `<div class="card">`;
  const spanAnal = stats.span_analysis || {};
  html += `<div class="row"><span class="k">跨度范围</span><span class="v">${spanAnal.min || 0} ~ ${spanAnal.max || 0}</span></div>`;
  html += `<div class="row"><span class="k">平均跨度</span><span class="v">${spanAnal.avg || 0}</span></div>`;
  html += `<div class="row"><span class="k">热门跨度</span><span class="v">${(spanAnal.most_common || []).map(x => x[0] + '(' + x[1] + ')').join(' · ') || '无'}</span></div>`;
  html += `</div>`;
  
  // ── 奇偶/大小/012路 ──
  html += `<div class="section-title">形态分析</div>`;
  html += `<div class="card">`;
  const oddEven = stats.odd_even_analysis || {};
  const size = stats.size_analysis || {};
  const road = stats.road_analysis || {};
  html += `<div class="row"><span class="k">奇偶分布</span><span class="v">${Object.entries(oddEven.distribution || {}).map(([k, v]) => k + ':' + v).join(' · ') || '无'}</span></div>`;
  html += `<div class="row"><span class="k">大小分布</span><span class="v">${Object.entries(size.distribution || {}).map(([k, v]) => k + ':' + v).join(' · ') || '无'}</span></div>`;
  html += `<div class="row"><span class="k">012路</span><span class="v">0路(${road.total?.[0] || 0}) · 1路(${road.total?.[1] || 0}) · 2路(${road.total?.[2] || 0})</span></div>`;
  html += `</div>`;
  
  // ── 贝叶斯评分 ──
  html += `<div class="section-title">贝叶斯综合评分</div>`;
  html += `<div class="card">`;
  const bayesian = stats.bayesian_scores || {};
  const sortedBayesian = Object.entries(bayesian).sort((a, b) => b[1] - a[1]);
  for (const [num, score] of sortedBayesian) {
    html += `<div class="zhixuan">
      <span class="rank">${num}</span>
      <span class="num">${score.toFixed(4)}</span>
      <span class="bar"><i style="width:${score * 100}%"></i></span>
      <span class="score">${(score * 100).toFixed(1)}%</span>
    </div>`;
  }
  html += `</div>`;
  
  // ── 排名模型 TOP10 ──
  html += `<div class="section-title">🏆 排名模型（Top-10）</div>`;
  html += `<div class="card">
    <div class="note" style="margin-bottom:8px">基于频率、遗漏、位置、012路综合评分</div>
    <div id="pailie5-rank-result" style="display:none">
      <div class="digit-grid" style="grid-template-columns:repeat(5,1fr)">
        <div class="digit-cell"><div class="d">1</div><div class="s">-</div></div>
        <div class="digit-cell"><div class="d">2</div><div class="s">-</div></div>
        <div class="digit-cell"><div class="d">3</div><div class="s">-</div></div>
        <div class="digit-cell"><div class="d">4</div><div class="s">-</div></div>
        <div class="digit-cell"><div class="d">5</div><div class="s">-</div></div>
        <div class="digit-cell"><div class="d">6</div><div class="s">-</div></div>
        <div class="digit-cell"><div class="d">7</div><div class="s">-</div></div>
        <div class="digit-cell"><div class="d">8</div><div class="s">-</div></div>
        <div class="digit-cell"><div class="d">9</div><div class="s">-</div></div>
        <div class="digit-cell"><div class="d">10</div><div class="s">-</div></div>
      </div>
    </div>
    <button type="button" style="width:100%;padding:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer" onclick="getPailie5Rank()">📊 获取排名</button>
  </div>`;
  
  // ── 周期状态识别 ──
  html += `<div class="section-title">🔄 周期与状态识别</div>`;
  html += `<div class="card">
    <div id="pailie5-cycles-result">
      <div class="row"><span class="k">🔥 热门号码</span><span class="v">-</span></div>
      <div class="row"><span class="k">❄ 冷门号码</span><span class="v">-</span></div>
      <div class="row"><span class="k">📈 升温号码</span><span class="v">-</span></div>
      <div class="row"><span class="k">📉 降温号码</span><span class="v">-</span></div>
      <div class="row"><span class="k">⚖️ 稳定号码</span><span class="v">-</span></div>
    </div>
    <button type="button" style="width:100%;padding:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer;margin-top:10px" onclick="getPailie5Cycles()">🔍 识别状态</button>
  </div>`;
  
  // ── 特征贡献度 ──
  html += `<div class="section-title">🎯 特征贡献度分析</div>`;
  html += `<div class="card">
    <div id="pailie5-contribution-result">

// ── 大乐透相关函数 ──
let lotteryLoaded = false;

function lotteryWeightBars(weights, labels) {
  const entries = Object.entries(weights || {});
  if (!entries.length) return '<div class="note">暂无权重数据</div>';
  const maxWeight = Math.max(...entries.map(([, v]) => Number(v) || 0), 0.01);
  return entries.map(([name, weight]) => {
    const val = Number(weight) || 0;
    const percent = Math.max(val / maxWeight * 100, 2);
    return `<div class="zhixuan">
      <span class="rank">${esc(labels[name] || name)}</span>
      <span class="num">${val.toFixed(3)}</span>
      <span class="bar"><i style="width:${percent.toFixed(0)}%"></i></span>
      <span class="score">${percent.toFixed(0)}%</span>
    </div>`;
  }).join('');
}

function lotteryBaselineRows(comparison) {
  const labels = {
    front_ge2_rate: '前区 Top5 ≥2',
    front_ge3_rate: '前区 Top5 ≥3',
    front_ge4_rate: '前区 Top5 ≥4',
    back_ge1_rate: '后区 Top3 ≥1',
    back_ge2_rate: '后区 Top3 ≥2',
  };
  return Object.entries(labels).map(([key, label]) => {
    const row = comparison?.[key] || {};
    const lift = Number(row.lift || 0);
    const sig = row.significant === true;
    const color = sig ? (lift >= 0 ? 'var(--accent2)' : 'var(--away)') : 'var(--muted)';
    return `<div class="row">
      <span class="k">${label}</span>
      <span class="v" style="color:${color}">${pct(row.observed)} / 随机 ${pct(row.random_baseline)} / ${lift >= 0 ? '+' : ''}${pct(lift)}</span>
    </div>`;
  }).join('');
}

function lotteryRoadText(total) {
  const t = total || {};
  return `0路(${fmtNum(t[0])}) · 1路(${fmtNum(t[1])}) · 2路(${fmtNum(t[2])})`;
}

async function loadLottery() {
  if (lotteryLoaded) return;
  const appLottery = document.getElementById('app-lottery');
  appLottery.innerHTML = `<div class="status"><span class="spinner"></span>正在加载大乐透数据…</div>`;
  try {
    // 页面展示不等待抓取任务：后端保留上一份成功结果，刷新在后台继续。
    // task-status 由独立的轻量轮询负责，避免生产环境慢网络让整页空白。
    const data = await fetchJson('/api/lottery?_=' + Date.now());
    if (data.error) {
      appLottery.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    lotteryLoaded = true;
    renderLottery(data.result);
    _watchActiveLotteryRefresh();
  } catch (e) {
    appLottery.innerHTML = `<div class="status error">加载失败：${esc(e.message)}</div>`;
  }
}

async function _watchActiveLotteryRefresh() {
  try {
    const statusData = await fetchJson('/api/lottery/task-status?_=' + Date.now());
    const processingTask = Object.entries(statusData).find(([_, info]) => info.status === 'processing');
    if (!processingTask) return;
    const [taskId, taskInfo] = processingTask;
    _showToast('⚠️', taskInfo.message || '正在后台刷新', '当前先展示上次结果');
    _pollLotteryTask(taskId, document.getElementById('app-lottery'), null, 180, true);
  } catch (e) {
    console.warn('检查大乐透后台任务失败', e);
  }
}

async function refreshLottery() {
  const btn = document.getElementById('refresh-lottery');
  btn.style.opacity = '0.5';
  btn.style.cursor = 'not-allowed';
  
  const appLottery = document.getElementById('app-lottery');
  appLottery.innerHTML = `<div class="status"><span class="spinner"></span>正在后台重新抓取数据并计算…</div>`;
  
  try {
    const result = await fetchJsonPost('/api/lottery-refresh');
    
    // 异步后台模式：轮询等待完成
    if (result.processing && result.task_id) {
      const taskId = result.task_id;
      appLottery.innerHTML = `<div class="status"><span class="spinner"></span>${esc(result.message || '后台处理中…')}<br><small style="color:var(--muted)">已耗时 0 秒</small></div>`;
      await _pollLotteryTask(taskId, appLottery, btn);
      return;
    }
    
    // 兜底：同步返回结果
    if (result.success) {
      console.log('大乐透缓存刷新成功:', result);
      lotteryLoaded = false;
      await loadLottery();
    } else {
      appLottery.innerHTML = `<div class="status error">✗ 刷新失败: ${esc(result.error || '未知错误')}</div>`;
    }
  } catch (error) {
    console.error('大乐透刷新失败:', error);
    appLottery.innerHTML = `<div class="status error">✗ 刷新失败: ${esc(error.message)}</div>`;
  } finally {
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
  }
}

async function _pollLotteryTask(taskId, appLottery, btn, maxWaitSec = 180, preserveContent = false) {
  const startTime = Date.now();
  const pollInterval = 750; // 后台快速任务通常1秒内完成，避免固定多等3秒
  const longWaitThreshold = 300; // 5分钟后给出额外提示
  let longWaitShown = false;
  while ((Date.now() - startTime) / 1000 < maxWaitSec) {
    await new Promise(r => setTimeout(r, pollInterval));
    try {
      const statusData = await fetchJson('/api/lottery/task-status?_=' + Date.now());
      const taskInfo = statusData[taskId];
      if (!taskInfo) continue;
      
      const elapsedSec = Math.round((Date.now() - startTime) / 1000);
      if (taskInfo.status === 'processing') {
        let msg = `后台计算中…<br><small style="color:var(--muted)">已耗时 ${elapsedSec} 秒</small>`;
        if (taskInfo.message) {
          msg += `<br><small style="color:var(--muted)">${esc(taskInfo.message)}</small>`;
        }
        if (elapsedSec > longWaitThreshold && !longWaitShown) {
          msg += `<br><small style="color:var(--muted)">计算量较大，请继续等待，关闭页面不影响后台运行</small>`;
          longWaitShown = true;
        }
        if (!preserveContent) {
          appLottery.innerHTML = `<div class="status"><span class="spinner"></span>${msg}</div>`;
        }
        continue;
      }
      if (taskInfo.status === 'done') {
        // 后台任务完成，重新加载缓存数据
        lotteryLoaded = false;
        await loadLottery();
        _showToast(taskInfo.success ? '✅' : '⚠️', taskInfo.message || '计算完成', taskInfo.elapsed ? `耗时 ${taskInfo.elapsed}s` : '');
        return;
      }
      if (taskInfo.status === 'error') {
        if (preserveContent) {
          _showToast('⚠️', '后台刷新失败，已保留上次结果', taskInfo.error || '');
        } else {
          appLottery.innerHTML = `<div class="status error">✗ 后台任务失败: ${esc(taskInfo.error || '未知错误')}</div>`;
        }
        return;
      }
    } catch (e) {
      console.warn('轮询任务状态失败:', e);
    }
  }
  // 超时：任务仍在后台运行，允许用户继续等待或刷新页面
  const elapsedSec = Math.round((Date.now() - startTime) / 1000);
  if (preserveContent) {
    _showToast('⚠️', '后台刷新仍在继续', `已等待 ${elapsedSec} 秒，当前保留上次结果`);
    return;
  }
  appLottery.innerHTML = `
    <div class="status" style="flex-direction:column;gap:12px;">
      <div>后台任务仍在运行中，已等待 ${elapsedSec} 秒</div>
      <div style="color:var(--muted);font-size:13px;">计算量较大，关闭页面不影响后台运行，完成后刷新页面即可查看结果</div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button id="lottery-continue-wait" class="kl8-refresh-btn" style="padding:6px 14px;font-size:13px;background:#4493f8;">继续等待</button>
        <button id="lottery-reload-page" class="kl8-refresh-btn" style="padding:6px 14px;font-size:13px;background:#30363d;">刷新页面</button>
      </div>
    </div>
  `;
  document.getElementById('lottery-continue-wait').addEventListener('click', () => {
    _pollLotteryTask(taskId, appLottery, btn, 1200); // 再等待 20 分钟
  });
  document.getElementById('lottery-reload-page').addEventListener('click', () => {
    location.reload();
  });
}

function _showToast(icon, message, detail) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: ${icon === '✅' ? '#2ea043' : '#f85149'}; color: white;
    padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 1000;
    animation: fadeInUp 0.3s ease;
  `;
  toast.innerHTML = `${icon} ${esc(message)} ${detail ? '· ' + esc(detail) : ''}`;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'fadeOutDown 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

async function getLotteryRecommend() {
  const recommendDiv = document.getElementById('lottery-recommend');
  recommendDiv.innerHTML = `<div class="status"><span class="spinner"></span>正在生成推荐…</div>`;
  try {
    const data = await fetchJson('/api/lottery/recommend?_=' + Date.now());
    if (data.error) {
      recommendDiv.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    const result = data.result || {};
    const recommendations = result.recommendations || [];
    const backCoverage = result.back_coverage_profile || {};
    
    let html = `<div class="card">`;
    html += `<div class="note" style="margin-bottom:8px">多策略推荐 · 共 ${recommendations.length} 组</div>`;
    if (Number(backCoverage.unique_number_count || 0) > 0) {
      html += `<div class="note" style="margin-bottom:10px;color:#4493f8">后区组合覆盖：${esc(backCoverage.unique_number_count)} / 12 个不同号码 · 至少一组后区中≥1理论概率 ${pct(Number(backCoverage.at_least_one_group_ge1_probability || 0))} · 至少一组后区全中理论概率 ${pct(Number(backCoverage.at_least_one_group_ge2_probability || 0))}</div>`;
    }
    
    recommendations.forEach((rec, idx) => {
      const front = (rec.front || []).map(n => String(n).padStart(2, '0')).join(' ');
      const back = (rec.back || []).map(n => String(n).padStart(2, '0')).join(' ');
      const isPicked = rec.strategy === 'picked' || rec.method === '精选一注';
      const strategyName = isPicked ? '精选一注' : (rec.method || '推荐');
      const coreFront = (rec.core_front || []).map(n => String(n).padStart(2, '0')).join(' ');
      const coreBack = (rec.core_back || []).map(n => String(n).padStart(2, '0')).join(' ');
      const coreNote = (coreFront || coreBack)
        ? `<div style="text-align:center;font-size:10px;color:#93c5fd;margin-top:3px">核心 ${esc(coreFront)}${coreBack ? ` + ${esc(coreBack)}` : ''} · 基于 ${esc(rec.based_on_issue || '最新期')}</div>`
        : '';
      const voteNote = isPicked
        ? `<div style="text-align:center;font-size:10px;color:#93c5fd;margin-top:3px">五组投票聚合 · 前区 ${Object.entries(rec.front_vote_detail || {}).map(([k, v]) => `${String(k).padStart(2, '0')}:${v}票`).join(' ')} · 后区 ${Object.entries(rec.back_vote_detail || {}).map(([k, v]) => `${String(k).padStart(2, '0')}:${v}票`).join(' ')}</div>`
        : '';
      html += `<div class="highlight" style="margin-bottom:8px;${isPicked ? 'border:1px solid #f85149;background:rgba(248,81,73,0.08)' : ''}">
        <div style="display:flex;justify-content:center;align-items:center;gap:12px">
          <span style="font-size:12px;color:var(--muted)">${idx + 1}.</span>
          <span class="big" style="letter-spacing:4px;color:#f85149">${front}</span>
          <span style="color:var(--muted);font-size:24px">+</span>
          <span class="big" style="letter-spacing:4px;color:#4493f8">${back}</span>
        </div>
        <div style="text-align:center;font-size:11px;color:var(--muted);margin-top:2px">${isPicked ? '⭐ ' : ''}${strategyName}</div>
        ${coreNote}
        ${voteNote}
      </div>`;
    });
    
    html += `</div>`;
    recommendDiv.innerHTML = html;
  } catch (e) {
    recommendDiv.innerHTML = `<div class="status error">推荐失败：${esc(e.message)}</div>`;
  }
}

function buildKL8ShapeProfile(numbers, lastNumbers = []) {
  const nums = (numbers || []).map(Number).filter(n => Number.isFinite(n));
  const lastSet = new Set((lastNumbers || []).map(Number));
  const zone20 = [
    nums.filter(n => n >= 1 && n <= 20).length,
    nums.filter(n => n >= 21 && n <= 40).length,
    nums.filter(n => n >= 41 && n <= 60).length,
    nums.filter(n => n >= 61 && n <= 80).length,
  ];
  const zone10 = [];
  for (let start = 1; start <= 71; start += 10) {
    zone10.push(nums.filter(n => n >= start && n <= start + 9).length);
  }
  const odd = nums.filter(n => n % 2 === 1).length;
  const small = nums.filter(n => n <= 40).length;
  return {
    zone20,
    zone10,
    odd_even: { odd, even: nums.length - odd },
    big_small: { small, big: nums.length - small },
    sum: nums.reduce((acc, n) => acc + n, 0),
    repeat_from_last: nums.filter(n => lastSet.has(n)).length,
  };
}

function normalizeKL8ShapeProfile(profile, numbers = []) {
  if (profile && Array.isArray(profile.zone20)) return profile;
  return buildKL8ShapeProfile(numbers, kl8LastData?.statistics?.last_numbers || []);
}

function renderKL8ShapeProfile(profile, numbers = [], compact = false) {
  const p = normalizeKL8ShapeProfile(profile, numbers);
  const odd = p.odd_even || {};
  const bs = p.big_small || {};
  const total = (numbers || []).length || (p.zone20 || []).reduce((acc, n) => acc + Number(n || 0), 0);
  const oddDiff = Math.abs(Number(odd.odd || 0) - Number(odd.even || 0));
  const sizeDiff = Math.abs(Number(bs.small || 0) - Number(bs.big || 0));
  const maxZone = Math.max(...(p.zone20 || [0]).map(Number));
  const zoneOk = total <= 4 ? true : maxZone <= Math.ceil(total / 4) + 1;
  const oddOk = oddDiff <= 2;
  const sizeOk = sizeDiff <= 2;
  const chips = [
    { k: '四区间 1-20/21-40/41-60/61-80', v: (p.zone20 || []).join(':'), cls: zoneOk ? 'good' : 'warn' },
    { k: '奇偶比', v: `${odd.odd ?? '-'}:${odd.even ?? '-'}`, cls: oddOk ? 'good' : 'warn' },
    { k: '大小比 1-40/41-80', v: `${bs.small ?? '-'}:${bs.big ?? '-'}`, cls: sizeOk ? 'good' : 'warn' },
    { k: '和值', v: p.sum ?? '-', cls: '' },
    { k: '上期重号', v: p.repeat_from_last ?? '-', cls: '' },
  ];
  const visible = compact ? chips.slice(0, 3) : chips;
  return `<div class="kl8-shape-strip">${visible.map(item => `
    <div class="kl8-shape-chip ${item.cls}">
      <div class="shape-k">${esc(item.k)}</div>
      <div class="shape-v">${esc(item.v)}</div>
    </div>
  `).join('')}</div>`;
}

// 组合数 C(a,b)
function combCount(a, b) {
  if (b < 0 || b > a) return 0;
  b = Math.min(b, a - b);
  let r = 1;
  for (let i = 0; i < b; i++) r = r * (a - i) / (i + 1);
  return r;
}

// 超几何: 80选20, 选 pick 个, 命中所选 >= k 的概率
function kl8HypergeomPGe(pick, k) {
  const comb = combCount;
  const N = 80, K = 20;
  let p = 0;
  for (let j = k; j <= pick; j++) {
    p += comb(K, j) * comb(N - K, pick - j) / comb(N, pick);
  }
  return p;
}

function renderKL8(r) {

  let html = '';

  const fushiTypes = [

    { key: 'fu_shi_7', label: '选5复式 — 7码复式', field: 'top7_numbers', coreLabel: '7个核心号码', basePick: 5 },
    { key: 'fu_shi_10_11', label: '选10复式 — 11码复式', field: 'top11_numbers', coreLabel: '11个核心号码', basePick: 10 },
  ];

  html += `<div class="section-title">【快乐8数据分析】</div>`;
  html += `<div class="note" style="color:var(--accent2);margin-bottom:12px">⚠ 快乐8开奖具有随机性，以下号码仅为历史统计参考，不构成投注建议，也无法保证提升命中率。</div>`;

  // v9.2: 三种状态 — 补数中 / 验证中 / 已验证
  const signalStatus = r.statistics?.signal_status || 'unknown';
  const backfillProgress = r.statistics?.backfill_progress || {};
  const isBackfilling = !backfillProgress.is_complete;
  const currentPeriods = backfillProgress.current_periods || r.statistics?.total_periods || 0;
  const targetPeriods = backfillProgress.target_periods || 800;
  const progressPct = backfillProgress.progress_pct || 0;

  // 版本信息 + 补数进度
  html += `<div class="note" style="margin-bottom:8px">版本: ${esc(r.statistics?.version || 'unknown')} · 分析期数: ${currentPeriods} · 信号状态: ${esc(signalStatus)}</div>`;
  html += `<div class="note" style="margin-bottom:8px">基于期号: ${esc(r.based_on_issue || r.statistics?.based_on_issue || '-')} · 预测期号: ${esc(r.target_issue || r.statistics?.target_issue || '-')} · 生成时间: ${esc(r.prediction_generated_at || r.statistics?.prediction_generated_at || '-')}</div>`;
  html += renderKL8PerformanceSummary(r.statistics?.recent_settlement_performance);

  // ── 状态1：历史补数中 ──
  if (isBackfilling) {
    html += `<div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,#1a2230,#1a2a3a);border:1px solid #4493f8;padding:16px 18px">`;
    html += `<div style="font-size:15px;font-weight:700;color:#4493f8;margin-bottom:10px">📥 历史补数中</div>`;
    html += `<div style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px">${currentPeriods} / ${targetPeriods} 期</div>`;
    // 进度条
    html += `<div style="width:100%;height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-bottom:8px">`;
    html += `<div style="width:${progressPct}%;height:100%;background:linear-gradient(90deg,#4493f8,#3fb950);border-radius:4px;transition:width .3s"></div>`;
    html += `</div>`;
    html += `<div style="font-size:12px;color:var(--muted)">进度: ${progressPct}% · 系统正在分批抓取历史数据，每10分钟自动补一批</div>`;
    html += `<div style="font-size:12px;color:var(--muted);margin-top:4px">达到${targetPeriods}期后将自动开始策略验证</div>`;
    html += `</div>`;
  }

  // ── 状态2：验证中（历史已满800期，但尚无通过验证的策略）───
  if (!isBackfilling && (signalStatus === 'verification_pending' || signalStatus === 'unknown')) {
    // 检查是否有任何玩法已验证
    const allModes = selectTypes.map(st => r[`select_${st}`]?.prediction_mode);
    for (const f of fushiTypes) allModes.push(r[f.key]?.prediction_mode);
    const anyValidated = allModes.some(m => m === 'validated');

    if (!anyValidated) {
      // 检查是否全部都未发现可验证策略（所有候选均未通过）
      const allNotVerified = allModes.every(m => m === 'not_verified' || m === undefined);
      const anyWarning = selectTypes.some(st => r[`select_${st}`]?.warning) || fushiTypes.some(f => r[f.key]?.warning);

      if (allNotVerified && anyWarning) {
        // 验证失败状态
        html += `<div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,#2a1a1a,#1a2230);border:1px solid #f85149;padding:16px 18px">`;
        html += `<div style="font-size:15px;font-weight:700;color:#f85149;margin-bottom:10px">❌ 未发现可验证策略</div>`;
        html += `<div style="font-size:13px;color:var(--muted);margin-bottom:6px">当前候选均未超过随机基线</div>`;
        html += `<div style="font-size:12px;color:var(--muted);margin-top:6px">历史数据: ${currentPeriods} / ${targetPeriods} 期 · 本玩法不输出号码</div>`;
        html += `</div>`;
      } else {
        // 验证中状态
        html += `<div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,#1a2230,#2a2a1a);border:1px solid #d29922;padding:16px 18px">`;
        html += `<div style="font-size:15px;font-weight:700;color:#d29922;margin-bottom:10px">⏳ 验证中</div>`;
        html += `<div style="font-size:13px;color:var(--text);margin-bottom:6px">历史数据已达到 ${currentPeriods} 期，正在运行训练、验证、封存测试</div>`;
        html += `<div style="font-size:12px;color:var(--muted);margin-top:6px">当前状态: 暂不输出推荐 · 原因: 尚无通过验证的策略</div>`;
        html += `</div>`;
      }
    }
  }

  // ── 状态3：已验证（至少一个玩法有validated策略）───
  if (signalStatus === 'validated') {
    html += `<div class="note" style="color:#2ea043;margin-bottom:12px;font-weight:700">✅ 已验证策略：当前启用策略已通过严格回测验证。</div>`;
  }

  // 最近开奖结果（始终显示）
  if (r.recent_results && r.recent_results.length > 0) {
    const isMobile = window.innerWidth <= 768;
    const showCount = isMobile ? 3 : 5;
    html += `<div class="card" style="margin-bottom:16px">`;
    html += `<div class="section-title" style="font-size:14px;margin-bottom:8px">最近开奖结果 ${isMobile ? '(近' + showCount + '期)' : ''}</div>`;
    for (const rec of r.recent_results.slice(0, showCount)) {
      html += `<div class="lottery-row kl8-lottery-row">`;
      html += `<span class="lottery-issue">${esc(rec.issue)}</span>`;
      html += `<span class="lottery-numbers kl8-lottery-balls" style="font-size:13px;letter-spacing:1px;gap:4px">`;
      const nums = rec.numbers || [];
      const lastSet = new Set(r.statistics?.last_numbers || []);
      for (const n of nums) {
        const isHighlight = lastSet.has(n);
        html += `<span class="kl8-ball small-ball ${isHighlight ? 'highlight-ball' : ''}" style="width:26px;height:26px;font-size:10px;display:inline-flex">${String(n).padStart(2,'0')}</span>`;
      }
      html += `</span>`;
      html += `<span class="lottery-date">${esc(rec.date)}</span>`;
      html += `</div>`;
    }
    html += `</div>`;
  }

  // ── 本期变化对比信息（仅在有已验证策略时显示）───
  const changeInfo = r.change_info || {};
  if (changeInfo.has_previous && signalStatus === 'validated') {
    html += `<div class="card" style="margin-bottom:12px;padding:10px 14px;border-left:3px solid #4493f8">`;
    html += `<div style="font-size:13px;font-weight:600;margin-bottom:6px;color:#4493f8">📊 本期相较上期变化</div>`;
    html += `<div style="font-size:11px;color:#8b949e;margin-bottom:8px">`;
    html += `本期基准: ${esc(changeInfo.current_based_on)} · 上期基准: ${esc(changeInfo.previous_based_on)}`;
    html += `</div>`;
    const poolChanges = changeInfo.pool_changes || {};
    if (poolChanges.changed === 0) {
      html += `<div style="font-size:12px;color:#8b949e;margin-bottom:6px">候选池延续：当前数据更新后，前20排名未发生变化</div>`;
    } else {
      html += `<div style="font-size:12px;margin-bottom:6px">`;
      html += `<span style="color:#4493f8">候选池变化</span>: `;
      html += `<span style="color:#da3633;font-weight:600">${poolChanges.changed}</span>`;
      html += ` / <span style="color:#8b949e">${poolChanges.total_pool_size}</span>`;
      html += ` 号号替换`;
      html += `</div>`;
    }
    const playChanges = changeInfo.play_changes || {};
    for (const st of selectTypes) {
      const key = `select_${st}`;
      const pc = playChanges[key];
      if (!pc || pc.changed_count === 0) continue;
      html += `<div style="font-size:11px;margin-bottom:4px">`;
      html += `<span style="color:#4493f8">选${st}</span>: `;

        html += `<span style="color:#da3633">-${pc.removed.map(n=>String(n).padStart(2,'0')).join(',')}</span> `;
      }
      if (pc.added && pc.added.length > 0) {
        html += `<span style="color:#2ea043">+${pc.added.map(n=>String(n).padStart(2,'0')).join(',')}</span>`;
      }
      html += `</div>`;
    }
    for (const f of fushiTypes) {
      const fpc = playChanges[f.key];
      if (fpc && fpc.changed_count > 0) {
        html += `<div style="font-size:11px;margin-bottom:4px">`;
        html += `<span style="color:#4493f8">${esc(f.label)}</span>: `;
        if (fpc.removed && fpc.removed.length > 0) {
          html += `<span style="color:#da3633">-${fpc.removed.map(n=>String(n).padStart(2,'0')).join(',')}</span> `;
        }
        if (fpc.added && fpc.added.length > 0) {
          html += `<span style="color:#2ea043">+${fpc.added.map(n=>String(n).padStart(2,'0')).join(',')}</span>`;
        }
        html += `</div>`;
      }
    }
    html += `<div style="font-size:11px;color:#8b949e;margin-top:4px">变化原因: ${esc(changeInfo.change_reason || '数据更新')}</div>`;
    html += `<div style="font-size:11px;margin-top:4px">置信等级: <span style="font-weight:600;color:${changeInfo.confidence_level==='低'?'#9a6700':'#2ea043'}">${esc(changeInfo.confidence_level || '低')}</span> · 策略状态: ${esc(changeInfo.strategy_status || '验证中')}</div>`;
    html += `</div>`;
  }

  // 候选池（仅在有已验证策略时显示）
  if (signalStatus === 'validated') {
    const candidatePlays = [
      { key: 'select_5', label: '选5' },
      { key: 'select_6', label: '选6' },
      { key: 'select_10', label: '选10' },
    ].filter(item => r[item.key]?.candidates?.length > 0);

    if (candidatePlays.length > 0) {
      html += `<div class="card" style="margin-bottom:12px;padding:10px 14px">`;
      html += `<div style="font-size:13px;font-weight:600;margin-bottom:8px">候选号码池 <span style="font-size:11px;color:#8b949e">(按玩法独立展示)</span></div>`;
      html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">`;
      for (const play of candidatePlays) {
        const selectedSet = new Set(r[play.key]?.numbers || []);
        html += `<div style="padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card2)">`;
        html += `<div style="font-size:12px;font-weight:700;margin-bottom:6px">${esc(play.label)} Top15</div>`;
        html += `<div style="display:flex;flex-wrap:wrap;gap:4px;line-height:1.6">`;
        for (const item of r[play.key].candidates.slice(0, 15)) {
          const num = typeof item === 'object' ? item[0] : item;
          if (selectedSet.has(num)) {
            html += `<span class="kl8-ball highlight-ball" style="width:28px;height:28px;font-size:11px">${String(num).padStart(2,'0')}</span> `;
          } else {
            html += `<span class="kl8-ball small-ball">${String(num).padStart(2,'0')}</span> `;
          }
        }
        html += `</div></div>`;
      }
      html += `</div>`;
      html += `<div style="font-size:11px;color:var(--muted);margin-top:6px">高亮球为该玩法最终推荐号。</div>`;
      html += `</div>`;
    }
  }

  // 各玩法推荐号码 — v9.2: verification_pending状态不显示号码
  const hasAnyNumbers = selectTypes.some(st => {
    const sel = r[`select_${st}`];
    return sel && sel.numbers && sel.numbers.length > 0;
  });

  if (hasAnyNumbers) {
    html += `<div class="card" style="margin-bottom:16px">`;
    html += `<div class="section-title" style="font-size:15px;margin-bottom:12px">本期统计参考号码</div>`;
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">`;

    for (const st of selectTypes) {
      const key = `select_${st}`;
      const sel = r[key];
      if (!sel || !sel.numbers || sel.numbers.length === 0) continue;

      const isRef = sel.prediction_mode === 'reference_unvalidated';
      const isCoverage = sel.baseline_type === 'fair_deterministic_coverage';
      const borderColor = isRef ? '#ffcc02' : '#2ea043';
      const badgeText = isCoverage ? '公平覆盖' : (isRef ? '参考' : '已验证');
      const badgeColor = isRef ? '#9a6700' : '#2ea043';

      // 主推号码：选几个就是几个（直接显示预测的主推单组，不放大底）
      const kl8MinWin = { 3: 3, 4: 4, 5: 3, 6: 4, 7: 4, 8: 4, 9: 4, 10: 5 };
      const winTh = kl8MinWin[st] || st;
      html += `<div class="kl8-select-card" style="border-color:${borderColor}">`;
      html += `<div class="kl8-select-title">🎯 ${esc(sel.desc)} — 主推 ${sel.numbers.length}码 <span style="font-size:11px;color:${badgeColor};font-weight:700;margin-left:8px">[${badgeText}]</span></div>`;
      html += `<div style="font-size:11px;color:#8b949e;margin-bottom:4px">策略: ${esc(sel.strategy_id || '')}</div>`;
      html += `<div class="kl8-numbers-row">`;
      const playChangeInfo = (changeInfo.play_changes || {})[key];
      const addedSet = new Set(playChangeInfo ? playChangeInfo.added : []);
      for (const n of sel.numbers) {
        if (addedSet.has(n)) {
          html += `<span class="kl8-ball highlight-ball" style="border:2px solid #2ea043;box-shadow:0 0 3px #2ea043">${String(n).padStart(2,'0')}</span>`;
        } else {
          html += `<span class="kl8-ball highlight-ball">${String(n).padStart(2,'0')}</span>`;
        }
      }
      html += `</div>`;
      const kl8WR = (kl8HypergeomPGe(st, winTh) * 100).toFixed(1);          // 单注参考率
      html += `<div style="font-size:11px;color:#8b949e;margin:4px 0 2px">中${winTh}+约 <b style="color:${kl8WR >= 15 ? '#2ea043' : '#d29922'}">${kl8WR}%</b>/期 · 期望中${(sel.numbers.length * 0.25).toFixed(2)}个</div>`;
      html += renderKL8ShapeProfile(sel.shape_profile, sel.numbers);
      if (sel.repeat_profile) {
        const actualRepeats = sel.numbers.filter(n => (r.statistics?.last_numbers || []).includes(n)).length;
        const repeatRule = sel.repeat_profile.constraint_applied
          ? ` · 策略约束至少 ${esc(sel.repeat_profile.configured_minimum || 0)} 个`
          : ' · 仅统计观察，不强制换入重号';
        html += `<div style="font-size:11px;color:#8b949e;margin-top:4px">重号结构：本组 ${actualRepeats} 个 · 近${esc(sel.repeat_profile.sample_size || 0)}期相邻开奖平均 ${esc(sel.repeat_profile.mean_draw_overlap || 0)} 个${repeatRule}</div>`;
      }
      html += renderKL8AccuracyProfile(sel.accuracy_profile);
      // v9.6: 重新启用多注覆盖方案展示，这是选5/选6提升组合层面命中率的主要途径
      if (sel.multi_slips && sel.multi_slips.length > 0) {
        html += renderKL8MultiSlips(sel, st);
      }
      if (isRef && sel.warning) {
        html += `<div style="font-size:11px;color:#9a6700;margin-top:6px">⚠ ${esc(sel.warning)}</div>`;
      }
      html += `</div>`;
    }
    html += `</div></div>`;
  }

  // 复式玩法 — 仅在有号码时显示
  for (const f of fushiTypes) {
    const fushi = r[f.key];
    const coreNumbers = fushi ? (fushi[f.field] || fushi.core_numbers || []) : [];
    if (!fushi || coreNumbers.length === 0) continue;

    const isRef = fushi.prediction_mode === 'reference_unvalidated';
    const isCoverage = fushi.baseline_type === 'fair_deterministic_coverage';
    const border = isRef ? '#ffcc02' : '#2ea043';
    const badge = isCoverage ? '公平覆盖' : (isRef ? '参考' : '已验证');
    const badgeColor = isRef ? '#9a6700' : '#2ea043';
    const comboPick = fushi.combo_pick || (f.key === 'fu_shi_10_11' ? 10 : 5);
    const poolSize = fushi.pool_size || coreNumbers.length;

    html += `<div class="card" style="margin-bottom:16px;border:2px solid ${border}">`;
    html += `<div class="kl8-fushi-header">🎱 ${esc(f.label)} (共${fushi.total_combinations}组) <span style="font-size:11px;color:${badgeColor};font-weight:700;margin-left:8px">[${badge}]</span></div>`;
    if (fushi.strategy_id) {
      html += `<div style="font-size:11px;color:#8b949e;margin-bottom:4px">策略: ${esc(fushi.strategy_id)}</div>`;
    }
    html += `<div class="section-title" style="font-size:14px;margin-bottom:8px">${esc(f.coreLabel)}</div>`;
    html += `<div class="kl8-fushi-top7">`;
    const fushiBasePick = f.comboPick || f.basePick || (f.key === 'fu_shi_10_11' ? 10 : 5);
    const fushiWinTh = fushiBasePick <= 4 ? 2 : (fushiBasePick <= 7 ? 3 : 5);
    const fushiExpWins = (fushi.total_combinations * kl8HypergeomPGe(fushiBasePick, fushiWinTh)).toFixed(1);
    html += `<div style="font-size:12px;color:#8b949e;margin:6px 0">每注中奖门槛: 中${fushiWinTh}个 · 期望中奖注数 ≈ <b style="color:#2ea043">${fushiExpWins}</b> 注（共 ${fushi.total_combinations} 注）</div>`;
    for (const n of coreNumbers) {
      html += `<span class="kl8-ball highlight-ball" style="width:44px;height:44px;font-size:18px">${String(n).padStart(2,'0')}</span>`;
    }
    html += `</div>`;
    html += renderKL8ShapeProfile(fushi.shape_profile, coreNumbers);
    if (isRef && fushi.warning) {
      html += `<div style="font-size:11px;color:#9a6700;margin-top:6px">⚠ ${esc(fushi.warning)}</div>`;
    }
    html += `</div>`;
  }

  // 号码排名Top20（仅在有已验证策略时显示）
  if (signalStatus === 'validated' && r.ranking && r.ranking.length > 0) {
    html += `<div class="card" style="margin-bottom:16px">`;
    html += `<div class="section-title" style="font-size:14px;margin-bottom:8px">号码排名 (Top20) — 启发式排序值，非开出概率</div>`;
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px">`;
    for (const item of r.ranking) {
      const rankingScore = item.ranking_score?.toFixed(3) || item.score?.toFixed(3) || '0';
      html += `<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--card);border-radius:6px;font-size:13px">`;
      html += `<span class="kl8-ball" style="width:28px;height:28px;font-size:11px">${String(item.num).padStart(2,'0')}</span>`;
      html += `<span style="color:var(--muted)">排序: ${rankingScore}</span>`;
      html += `</div>`;
    }
    html += `</div>`;
    html += `</div>`;
  }

  // 刷新按钮
  html += `<div id="kl8-parameter-search-result"></div>`;
  html += `<div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap">`;
  html += `<button class="kl8-refresh-btn" onclick="refreshKL8()">↻ 重新计算</button>`;
  html += `<button class="kl8-refresh-btn" style="background:#d29922" onclick="openKL8ExcludeModal()">剔除号码重新计算</button>`;
  html += `<button class="kl8-refresh-btn" style="background:#f85149" onclick="openKL8KillModal()">杀号计算</button>`;
  html += `<button class="kl8-refresh-btn" style="background:#4493f8" onclick="fetchKL8Data()">🔄 抓取最新开奖数据</button>`;
  html += `<button class="kl8-refresh-btn" style="background:#2ea043" onclick="openKL8RecordsModal()">📋 预测记录</button>`;
  html += `</div>`;
  html += `<div id="kl8-exclude-modal"></div>`;
  html += `<div id="kl8-records-modal"></div>`;

  appKL8.innerHTML = html;
}

  const r = kl8LastData || {};
  return [
    { key: 'select_5', label: '选5', numbers: r.select_5?.numbers || [], resultField: 'numbers' },
    { key: 'select_6', label: '选6', numbers: r.select_6?.numbers || [], resultField: 'numbers' },
    { key: 'select_10', label: '选10', numbers: r.select_10?.numbers || [], resultField: 'numbers' },
    { key: 'fu_shi_7', label: '选5复式7码', numbers: r.fu_shi_7?.top7_numbers || r.fu_shi_7?.core_numbers || [], resultField: 'top7_numbers' },
  ].filter(item => item.numbers && item.numbers.length > 0);
}

function renderPredictionsPager(total, page, totalPages, start, end) {
  const prevDisabled = page <= 1;
  const nextDisabled = page >= totalPages;
  const pageButtons = [];
  const from = Math.max(1, page - 2);
  const to = Math.min(totalPages, page + 2);
  for (let p = from; p <= to; p++) {
    const active = p === page;
    pageButtons.push(`<button type="button" onclick="setPredictionsPage(${p})" style="padding:6px 10px;border:1px solid ${active ? 'var(--accent2)' : 'var(--line)'};background:${active ? 'var(--accent2)' : 'var(--card2)'};color:${active ? '#fff' : 'var(--text)'};border-radius:6px;cursor:pointer">${p}</button>`);
  }

  return `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0;padding:10px 12px">
    <div style="font-size:12px;color:var(--muted)">显示 ${esc(start)}-${esc(end)} / ${esc(total)} 条 · 第 ${esc(page)} / ${esc(totalPages)} 页</div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <button type="button" onclick="setPredictionsPage(${page - 1})" ${prevDisabled ? 'disabled' : ''} style="padding:6px 10px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:6px;cursor:${prevDisabled ? 'not-allowed' : 'pointer'};opacity:${prevDisabled ? '.5' : '1'}">上一页</button>
      ${pageButtons.join('')}
      <button type="button" onclick="setPredictionsPage(${page + 1})" ${nextDisabled ? 'disabled' : ''} style="padding:6px 10px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:6px;cursor:${nextDisabled ? 'not-allowed' : 'pointer'};opacity:${nextDisabled ? '.5' : '1'}">下一页</button>
    </div>
  </div>`;
}

function setPredictionsPage(page) {
  predictionsPage = Math.max(1, Number(page) || 1);
  loadPredictions().then(() => {
    document.getElementById('app-predictions')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function renderKL8Balls(numbers, size = 36) {
  return (numbers || []).map(n =>
    `<span class="kl8-ball highlight-ball" style="width:${size}px;height:${size}px;font-size:${size >= 40 ? 16 : 13}px">${String(n).padStart(2,'0')}</span>`
  ).join('');
}

function renderKL8AccuracyProfile(profile) {
  if (!profile || typeof profile !== 'object') return '';
  const expected = Number(profile.expected_hits_random || 0).toFixed(2);
  const zero = pct(Number(profile.zero_hit_probability_random || 0));
  const probs = profile.theoretical_probabilities || {};
  const keys = Array.isArray(profile.key_thresholds) ? profile.key_thresholds : [];
  const keyText = keys.map(k => `${esc(k)} ${pct(Number(probs[k] || 0))}`).join(' | ');
  const targetText = profile.target_hits
    ? ` | target ${esc(profile.target_hits)} hit=${pct(Number(profile.target_probability_random || 0))}`
    : '';
  const mode = profile.selected_mode ? ` | mode ${esc(profile.selected_mode)}` : '';
  return `<div style="font-size:11px;color:#8b949e;margin-top:6px;line-height:1.5">
    random E=${expected} | P(0 hit)=${zero}${targetText}${keyText ? ` | ${keyText}` : ''}${mode}
  </div>`;
}

function renderKL8PerformanceSummary(performance) {
  const available = Number(performance?.available_count || 0);
  if (!available) {
    return `<div class="note" style="margin:8px 0 12px;color:#d29922">实际效果：等待下一期开奖自动结算；当前页面概率均为随机理论值，不代表模型准确率。</div>`;
  }
  const windows = Array.isArray(performance.windows) ? performance.windows : [];
  const current = windows.find(w => Number(w.settled_count || 0) > 0) || {};
  const rows = Object.values(current.play_stats || {}).filter(x => /^select_(5|6)$/.test(x.play_type || ''));
  if (!rows.length) return '';
  const cells = rows.map(stat => {
    const delta = Number(stat.hit_delta_vs_random || 0);
    const color = delta > 0 ? '#2ea043' : delta < 0 ? '#f85149' : '#8b949e';
    let line = `<span style="margin-right:18px">${esc(stat.label)}：实际均中 <b>${Number(stat.avg_hits || 0).toFixed(2)}</b>，随机 ${Number(stat.random_expected_hits || 0).toFixed(2)}，<b style="color:${color}">${delta >= 0 ? '+' : ''}${delta.toFixed(2)}</b></span>`;
    // v9.6: 同时展示多注组合层面的实际命中率
    const ms = stat.multi_slip;
    if (ms && ms.settled_count > 0) {
      line += `<span style="margin-right:18px">${esc(stat.label)}多注：最佳组均中 <b>${Number(ms.avg_best_hits || 0).toFixed(2)}</b> · ≥3 <b>${(ms.ge3_rate * 100).toFixed(0)}%</b> · ≥4 <b>${(ms.ge4_rate * 100).toFixed(0)}%</b> · ≥5 <b>${(ms.ge5_rate * 100).toFixed(0)}%</b></span>`;
    }
    return line;
  }).join('');
  return `<div class="card" style="padding:10px 14px;margin:8px 0 12px;border-left:3px solid #4493f8">
    <div style="font-size:12px;color:#8b949e;margin-bottom:5px">最近 ${esc(current.settled_count || available)} 期实际结算（与随机基线比较）</div>
    <div style="font-size:12px;line-height:1.7">${cells}</div>
  </div>`;
}

// 多注覆盖方案（v9.6）：渲染 N 组覆盖最大化号码，诚实展示组合层面命中率
function renderKL8MultiSlips(sel, st) {
  const slips = sel.multi_slips;
  if (!Array.isArray(slips) || slips.length === 0) return '';
  const nSlips = slips.length;
  const pick = slips[0].length || sel.pick || st;
  const coverage = sel.multi_slip_coverage || {};
  const unique = Number(coverage.unique_number_count || 0);
  const maxOverlap = coverage.max_pair_overlap != null ? coverage.max_pair_overlap : '-';
  const sims = coverage.simulations || 0;

  // 每组多少注 = C(pick, st)
  const betsPerGroup = combCount(pick, st);
  const cost = nSlips * betsPerGroup * 2;
  const playLabel = `选${st}`;

  // 不同玩法关注的中奖档位
  const thresholds = [];
  if (st >= 5) thresholds.push({ k: 3, label: '中3+', val: Number(coverage.at_least_one_ge3 || 0) * 100 });
  if (st >= 4) thresholds.push({ k: 4, label: '中4+', val: Number(coverage.at_least_one_ge4 || 0) * 100 });
  if (st >= 5) thresholds.push({ k: 5, label: '中5+', val: Number(coverage.at_least_one_ge5 || 0) * 100 });
  if (st >= 6) thresholds.push({ k: 6, label: '中6+', val: Number(coverage.at_least_one_ge6 || 0) * 100 });
  const probLine = thresholds.map(t => `${t.label} <b style="color:#2ea043">${t.val.toFixed(1)}%</b>`).join(' · ');

  let cards = '';
  slips.forEach((s, i) => {
    cards += `<div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">`;
    cards += `<span style="font-size:11px;color:#8b949e;min-width:34px">第${i + 1}组</span>`;
    for (const n of s) {
      cards += `<span class="kl8-ball highlight-ball" style="width:28px;height:28px;font-size:11px">${String(n).padStart(2,'0')}</span>`;
    }
    cards += `</div>`;
  });

  return `<div style="margin-top:10px;border-top:1px dashed var(--line);padding-top:8px">
    <div style="font-size:12px;font-weight:700;color:#4493f8;margin-bottom:5px">🎯 多注覆盖方案（${nSlips}组 × ${pick}码，打${playLabel}）</div>
    <div style="font-size:11px;color:#8b949e;margin-bottom:7px;line-height:1.6">
      每组 ${pick} 个号打${playLabel} = C(${pick},${st})=${betsPerGroup} 注，共 ${nSlips} 组。v9.6 起采用“覆盖最大化”结构：12 组号码互不重复，最多覆盖 72/80 个号码，组间最大重复 ${esc(maxOverlap)} 个。
      按实际重叠结构模拟 ${esc(sims)} 次公平开奖，${playLabel} 组合层面：${probLine}。每期成本约 <b>${cost}</b> 元。
    </div>
    ${cards}
    <div style="font-size:11px;color:#9a6700;margin-top:6px">⚠ 这是“多买几组”的覆盖率杠杆，不保证单组必中；单注期望命中仍为 ${(pick * 0.25).toFixed(2)} 个。请理性投注。</div>
  </div>`;
}

function initKL8ExcludeState(options) {
  kl8ExcludeState = {
    options: options.map(item => ({
      ...item,
      currentNumbers: [...item.numbers],
      excludedNumbers: [],
      requiredPick: item.numbers.length,
      round: 0,
    })),
  };
}

function getKL8ExcludeOption(key) {
  return kl8ExcludeState?.options?.find(item => item.key === key);
}

function renderKL8ExcludeCards(selectedKey) {
  const options = kl8ExcludeState?.options || [];
  return options.map((item, idx) => {
    const checked = item.key === (selectedKey || options[0]?.key) || (!selectedKey && idx === 0);
    const disabled = !item.currentNumbers.length || item.currentNumbers.length < item.requiredPick;
    let html = `<label class="kl8-select-card" style="cursor:${disabled ? 'not-allowed' : 'pointer'};margin:0;opacity:${disabled ? '.58' : '1'}">`;
    html += `<div class="kl8-select-title"><input type="radio" name="kl8-exclude-play" value="${esc(item.key)}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}> ${esc(item.label)}</div>`;
    html += `<div class="kl8-numbers-row" style="margin-top:8px">${renderKL8Balls(item.currentNumbers, 32)}</div>`;

function parseKL8NumberInput(value) {
  const invalid = [];
  const seen = new Set();
  const numbers = [];
  String(value || '')
    .split(/[\s,，、;；]+/)
    .map(x => x.trim())
    .filter(Boolean)
    .forEach(raw => {
      if (!/^\d+$/.test(raw)) {
        invalid.push(raw);
        return;
      }
      const num = Number(raw);
      if (num < 1 || num > 80) {
        invalid.push(raw);
        return;
      }
      if (!seen.has(num)) {
        seen.add(num);
        numbers.push(num);
      }
    });
  numbers.sort((a, b) => a - b);
  return { numbers, invalid };
}

function initKL8KillState(options) {
  kl8KillState = {
    options: options.map(item => ({
      ...item,
      currentNumbers: [...item.numbers],
      excludedNumbers: [],
      manualKillNumbers: [],
      requiredPick: item.numbers.length,
      round: 0,
      initialized: false,
    })),
  };
}

function getKL8KillOption(key) {
  return kl8KillState?.options?.find(item => item.key === key);
}

function renderKL8KillCards(selectedKey) {
  const options = kl8KillState?.options || [];
  return options.map((item, idx) => {
    const checked = item.key === (selectedKey || options[0]?.key) || (!selectedKey && idx === 0);
    const disabled = !item.currentNumbers.length || item.currentNumbers.length < item.requiredPick;
    let html = `<label class="kl8-select-card" style="cursor:${disabled ? 'not-allowed' : 'pointer'};margin:0;opacity:${disabled ? '.58' : '1'}">`;
    html += `<div class="kl8-select-title"><input type="radio" name="kl8-kill-play" value="${esc(item.key)}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}> ${esc(item.label)}</div>`;
    html += `<div class="kl8-numbers-row" style="margin-top:8px">${renderKL8Balls(item.currentNumbers, 32)}</div>`;
    if (item.manualKillNumbers.length) {
      html += `<div style="font-size:12px;color:#f85149;margin-top:8px">杀号: ${item.manualKillNumbers.map(n => String(n).padStart(2,'0')).join(', ')}</div>`;

  list.innerHTML = pageRecords.map(renderKL8RecordCard).join('');

  if (records.length > KL8_RECORDS_PAGE_SIZE) {
    const prevDisabled = kl8RecordsPage <= 1;
    const nextDisabled = kl8RecordsPage >= totalPages;
    let btns = '';
    const from = Math.max(1, kl8RecordsPage - 2);

  html += `<div style="font-size:11px;color:var(--muted);margin:2px 0 8px">基于第 ${esc(rec.based_on_issue || '?')} 期 · 模型 ${esc(rec.version || '?')}</div>`;

  // 预测主推号码
  const plays = [['select_5', '选5'], ['select_6', '选6'], ['select_10', '选10'], ['fu_shi_7', '选5复式7码']];
  let predHtml = '';
  for (const [key, label] of plays) {
    const pool = rec.main_pool && rec.main_pool[key];
    const nums = (rec.predicted && rec.predicted[key]) || pool || [];
    if (nums && nums.length) {
      predHtml += `<div style="margin-top:6px"><span style="font-size:12px;color:var(--muted);display:inline-block;min-width:78px">${label}</span>${renderKL8Balls(nums, 26)}</div>`;
    }
  }
  if (predHtml) {
    html += `<div style="font-size:12px;color:#8b949e;margin:6px 0 2px">预测主推</div>${predHtml}`;
  }

  if (settled) {
    html += `<div style="font-size:12px;color:#8b949e;margin:10px 0 4px">开奖号码（第 ${esc(st.actual_issue || rec.target_issue)} 期）</div>`;
    html += `<div class="kl8-numbers-row">${renderKL8Balls(st.actual_numbers || [], 28)}</div>`;

    const ps = st.prize_settlement || {};
    const fs = st.fushi_settlement || {};
    const rows = [];
    for (const [key, label] of [['select_5', '选5'], ['select_6', '选6'], ['select_10', '选10']]) {
      const p = ps[key];
      if (p) rows.push(`${label}：中 <b>${p.hits}</b> 个${p.placed ? ` · 投 ${p.bet} 元 / 奖 ${p.prize} 元` : ' · 未投注'}`);
    }
    const f7 = fs['fu_shi_7'];
    if (f7 && f7.placed) {
      rows.push(`选5复式7码：池命中 <b>${f7.pool_hits}</b> 个 → 最高单组 ${f7.max_combo_hits} 个 · 投 ${f7.total_bet} 元 / 奖 ${f7.total_prize} 元`);
    }
    if (rows.length) {
      html += `<div style="margin-top:8px;font-size:13px;line-height:1.7">${rows.map(r => `<div>${r}</div>`).join('')}</div>`;
    }

    const roi = st.cumulative_profit_roi || 0;
    const roiColor = roi >= 0 ? '#2ea043' : '#f85149';
    html += `<div style="margin-top:8px;font-size:13px;border-top:1px dashed var(--line);padding-top:8px">
      累计投注 <b>${st.cumulative_bet || 0}</b> 元 · 奖金 <b>${st.cumulative_prize || 0}</b> 元 ·
      ROI <b style="color:${roiColor}">${(roi * 100).toFixed(1)}%</b>
    </div>`;
  } else {
    html += `<div class="note" style="margin-top:10px">该期尚未开奖，开奖后系统会自动结算并在此显示中奖情况。</div>`;
  }

  html += `</div>`;
  return html;
}

async function runKL8KillRecalculate() {
  const resultTarget = document.getElementById('kl8-kill-result');
  const selected = document.querySelector('input[name="kl8-kill-play"]:checked');
  if (!resultTarget || !selected) return;
  const option = getKL8KillOption(selected.value);
  if (!option) return;

  const parsed = parseKL8NumberInput(document.getElementById('kl8-kill-input')?.value || '');
  if (parsed.invalid.length) {
    resultTarget.innerHTML = `<div class="status error">杀号格式错误或超出1-80: ${esc(parsed.invalid.join(', '))}</div>`;
    return;
  }
  if (!option.initialized && !parsed.numbers.length) {
    resultTarget.innerHTML = `<div class="status error">请先输入至少1个杀号</div>`;
    return;
  }

  const removeNow = option.initialized ? [...(option.currentNumbers || [])] : [];
  if (option.initialized && (!removeNow.length || removeNow.length < option.requiredPick)) {
    resultTarget.innerHTML = `<div class="status error">${esc(option.label)} 剩余号码不足，不能继续杀号计算</div>`;
    refreshKL8KillCards(option.key);
    return;
  }

  const manualKillNumbers = option.initialized ? option.manualKillNumbers : parsed.numbers;
  const excludeNumbers = [...new Set([
    ...(option.excludedNumbers || []),
    ...manualKillNumbers,
    ...removeNow,
  ])].sort((a, b) => a - b);

  resultTarget.innerHTML = `<div class="status"><span class="spinner"></span>正在排除杀号并重新计算 ${esc(option.label)}...</div>`;
  try {
    const url = '/api/kl8/exclude-recalculate?play_type='
      + encodeURIComponent(option.key)
      + '&numbers=' + encodeURIComponent(excludeNumbers.join(','))
      + '&_=' + Date.now();
    const data = await fetchJson(url);
    if (data.error) throw new Error(data.error);
    const result = data.result || {};
    if (result.error) throw new Error(result.error);
    const newNumbers = result.numbers || result.top7_numbers || result.core_numbers || [];
    const quality = result.quality || {};
    if (!newNumbers.length || newNumbers.length < option.requiredPick) {
      option.currentNumbers = [];
      option.excludedNumbers = result.excluded_numbers || excludeNumbers;
      option.manualKillNumbers = manualKillNumbers;
      option.initialized = true;
      refreshKL8KillCards(option.key);
      throw new Error(`${option.label} 候选号码不足，已停止输出新结果`);
    }

    option.currentNumbers = newNumbers;
    option.excludedNumbers = result.excluded_numbers || excludeNumbers;
    option.manualKillNumbers = manualKillNumbers;
    option.initialized = true;
    option.round = (option.round || 0) + 1;
    const candidates = (result.candidates || []).map(item => Array.isArray(item) ? item[0] : item).slice(0, 12);
    refreshKL8KillCards(option.key);

    let html = `<div class="kl8-select-card" style="border-color:#f85149">`;
    html += `<div class="kl8-select-title">${esc(option.label)} 杀号计算第 ${option.round} 次结果</div>`;
    html += `<div style="font-size:12px;color:#f85149;margin-bottom:8px">杀号: ${manualKillNumbers.map(n => String(n).padStart(2,'0')).join(', ')}</div>`;
    if (removeNow.length) {
      html += `<div style="font-size:12px;color:var(--muted);margin-bottom:8px">本次继续排除: ${removeNow.map(n => String(n).padStart(2,'0')).join(', ')}</div>`;
    }
    html += `<div style="font-size:12px;color:var(--muted);margin-bottom:8px">累计排除: ${option.excludedNumbers.map(n => String(n).padStart(2,'0')).join(', ')}</div>`;
    html += `<div class="kl8-numbers-row">${renderKL8Balls(newNumbers, 40)}</div>`;
    html += renderKL8ShapeProfile(quality.shape_profile, newNumbers);
    if (quality.quality_score !== undefined) {
      const modeLabels = { concentrated: '高分集中', balanced: '均衡分散', repeat_follow: '适度跟重', zone_spread: '区间扩散', shape_balanced: '形态均衡', prize_floor: '奖级冲击' };
      html += `<div style="font-size:12px;color:var(--muted);margin-top:8px">质量分: ${esc(quality.quality_score)} · 模式: ${esc(modeLabels[quality.selection_mode] || quality.selection_mode || '-')} · 重号: ${esc(quality.repeat_count ?? '-')} / ${esc(quality.repeat_cap ?? '-')} · 区间: ${esc(quality.zone_count ?? '-')} · 路数: ${esc(quality.road_count ?? '-')}</div>`;
    }
    if (candidates.length) {
      html += `<div style="font-size:12px;color:var(--muted);margin-top:8px">候补池: ${candidates.map(n => String(n).padStart(2,'0')).join(', ')}</div>`;
    }
    if (result.total_combinations) {
      html += `<div style="font-size:12px;color:var(--muted);margin-top:6px">组合数: ${esc(result.total_combinations)}</div>`;
    }
    html += `</div>`;
    resultTarget.innerHTML = html;
  } catch (e) {
    resultTarget.innerHTML = `<div class="status error">${esc(e.message)}</div>`;
  }
}

function renderKL8ParameterSearch(result) {
  const target = document.getElementById('kl8-parameter-search-result');
  if (!target) return;

  if (!result || result.error) {
    target.innerHTML = `<div class="status error" style="margin-top:16px">${esc(result?.error || '参数搜索失败')}</div>`;
    return;
  }

  const bestByPlay = result.best_by_play || {};
  const playTypes = result.play_types || Object.keys(bestByPlay);
  let html = `<div class="card" style="margin-top:16px;margin-bottom:16px">`;
  html += `<div class="section-title" style="font-size:15px;margin-bottom:10px">快乐8参数搜索结果</div>`;
  html += `<div class="note" style="margin-bottom:10px">用途: 自动回测不同窗口、重号方向、候选池分散等参数，按玩法找历史表现更好的候选策略；它不直接预测开奖，也不会自动激活。</div>`;
  html += `<div class="note" style="margin-bottom:10px">候选数: ${esc(result.candidate_count || 0)} · 数据期数: ${esc(result.total_periods || '-')} · 两阶段快速搜索：先验证段筛选，再给优先候选补封存测试</div>`;
  if (result.honest_note) {
    html += `<div class="note" style="margin-bottom:10px;color:var(--accent2);border-left:3px solid var(--accent2);padding-left:8px">⚠ ${esc(result.honest_note)}</div>`;
  }
  if (result.any_significant === false) {
    html += `<div class="note" style="margin-bottom:10px;color:#8b949e">本轮无任一候选在验证段显著高于随机基线（与随机不可区分）——属公平摇奖的预期结果，排名仅供参考。</div>`;
  }
  if (result.report_file) {
    html += `<div class="note" style="margin-bottom:10px">报告文件: ${esc(result.report_file)}</div>`;
  }
  html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">`;

  for (const playType of playTypes) {
    const item = bestByPlay[playType];
    if (!item) continue;
    const strategy = item.strategy || {};
    const label = playType.startsWith('select_') ? `选${playType.replace('select_', '')}` : playType;
    const valLift = Number(item.validation_lift || 0);
    const finalLift = Number(item.final_test_lift || 0);
    const valHitScore = Number(item.validation_hit_rate_score || 0);
    const finalHitScore = Number(item.final_test_hit_rate_score || 0);
    const formatHitLifts = (lifts) => {
      if (!lifts || typeof lifts !== 'object') return '-';
      return Object.entries(lifts)
        .map(([k, v]) => `${esc(k)}:${Number(v || 0).toFixed(3)}`)
        .join(' / ') || '-';
    };
    // 公平摇奖下正 lift 多为噪声：仅当验证段显著高于随机才标绿，否则一律按噪声呈现(灰色)。
    const isSignificant = item.validation_is_significant === true;
    const liftColor = isSignificant ? '#2ea043' : '#8b949e';
    const noiseTag = (item.likely_noise !== false && !isSignificant)
      ? `<span style="font-size:10px;color:#8b949e;border:1px solid #8b949e;border-radius:3px;padding:0 4px;margin-left:6px">≈随机噪声</span>`
      : '';
    html += `<div class="kl8-select-card" style="border-color:${liftColor}">`;
    html += `<div class="kl8-select-title">${esc(label)} · ${esc(item.candidate || '-')}${noiseTag}</div>`;
    html += `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">score ${esc(item.score ?? '-')} · window ${esc(strategy.window_size || '-')} · 显著: ${isSignificant ? '是' : '否'}</div>`;
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px">`;
    html += `<div>命中率评分: <span style="color:#2ea043;font-weight:700">${valHitScore.toFixed(4)}</span></div>`;
    html += `<div>封存命中率: <span style="color:${finalHitScore > 0 ? '#2ea043' : '#8b949e'};font-weight:700">${finalHitScore.toFixed(4)}</span></div>`;
    html += `<div style="grid-column:1/-1;color:var(--muted)">验证关键档: ${formatHitLifts(item.validation_hit_rate_lifts)}</div>`;
    html += `<div style="grid-column:1/-1;color:var(--muted)">封存关键档: ${formatHitLifts(item.final_test_hit_rate_lifts)}</div>`;
    html += `<div>验证Lift: <span style="color:${liftColor};font-weight:700">${valLift.toFixed(4)}</span></div>`;
    html += `<div>封存Lift: <span style="color:${finalLift > 0 && isSignificant ? '#2ea043' : '#8b949e'};font-weight:700">${finalLift.toFixed(4)}</span></div>`;
    html += `<div>均值命中: ${esc(item.validation_mean_hits ?? '-')}</div>`;
    html += `<div>随机基线: ${esc(item.expected_random ?? '-')}</div>`;
    html += `<div>重号方向: ${esc(strategy.repeat_direction || 'neutral')}</div>`;
    html += `<div>重号上限: ${esc(strategy.pool_max_last_numbers ?? 'auto')}</div>`;
    html += `<div>候选池分散: ${strategy.pool_diversify === false ? '关闭' : '开启'}</div>`;
    html += `<div>ROI: ${esc(item.validation_profit_roi ?? '-')}</div>`;
    html += `</div>`;
    html += `</div>`;
  }

  html += `</div></div>`;
  target.innerHTML = html;
}

async function pollKL8ParameterSearch(jobId) {
  const target = document.getElementById('kl8-parameter-search-result');
  for (let attempt = 0; attempt < 900; attempt++) {
    const data = await fetchJson('/api/kl8/parameter-search/status?job_id=' + encodeURIComponent(jobId) + '&_=' + Date.now());
    if (data.error) {
      renderKL8ParameterSearch({ error: data.error });
      return;
    }

    const job = data.result || {};
    if (job.status === 'completed') {
      const result = job.result || {};
      result.report_file = job.report_file;
      renderKL8ParameterSearch(result);
      return;
    }

    if (job.status === 'failed') {
      renderKL8ParameterSearch({ error: job.error || job.message || '参数搜索失败' });
      return;
    }

    if (target) {
      target.innerHTML = `<div class="status" style="margin-top:16px"><span class="spinner"></span>参数搜索${esc(job.status || 'running')} · 已用 ${esc(job.elapsed_seconds ?? 0)} 秒</div>`;
    }
    await new Promise(resolve => setTimeout(resolve, 2000));
  }
  renderKL8ParameterSearch({ error: '参数搜索超时' });
}

async function runKL8ParameterSearch() {
  const target = document.getElementById('kl8-parameter-search-result');
  if (target) {
    target.innerHTML = `<div class="status" style="margin-top:16px"><span class="spinner"></span>正在启动快乐8参数搜索...</div>`;
  }

  try {
    const data = await fetchJson('/api/kl8/parameter-search/start?max_candidates=24&top_n=3&_=' + Date.now());
    if (data.error) {
      renderKL8ParameterSearch({ error: data.error });
      return;
    }
    const job = data.result || {};
    if (!job.job_id) {
      renderKL8ParameterSearch({ error: '未返回任务ID' });
      return;
    }
    await pollKL8ParameterSearch(job.job_id);
  } catch (e) {
    const errText = String(e.message || '');
    const msg = errText.includes('504') || errText.includes('Gateway Time-out') || errText.includes('接口不存在')
      ? `${e.message}；请确认后端服务已重启到最新版本，然后再点参数搜索`
      : e.message;
    renderKL8ParameterSearch({ error: msg });
  }
}

async function fetchKL8Data() {
  const appKL8 = document.getElementById('app-kl8');
  const originalContent = appKL8.innerHTML;
  appKL8.innerHTML = `<div class="status"><span class="spinner"></span>正在抓取最新快乐8开奖数据…</div>`;

  try {
    const data = await fetchJson('/api/kl8/fetch');
    if (data.error) {
      appKL8.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }

    const success = data.success || false;
    const message = data.message || '';
    const latestIssue = data.latest_issue || '';

    if (data.result) {
      renderKL8(data.result);
    }

    // Toast
    const toast = document.createElement('div');
    toast.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:${success ? '#2ea043' : '#f85149'};color:white;padding:12px 24px;border-radius:8px;font-size:14px;z-index:1000;`;
    toast.innerHTML = `${success ? '✅' : '❌'} ${message}${latestIssue ? ' · 最新期号: ' + latestIssue : ''}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  } catch (e) {
    appKL8.innerHTML = `<div class="status error">抓取失败: ${esc(e.message)}</div>`;
    setTimeout(() => { appKL8.innerHTML = originalContent; }, 2000);
  }
}

let basketballLoaded = false;
let basketballLastResult = null;
let basketballPage = 1;

function switchBasketballSource(source) {
  basketballSource = source || 'okooo';
  basketballLoaded = false;
  basketballLastResult = null;
  loadBasketball(true);
}

async function loadBasketball(force) {
  if (!force && basketballLoaded && basketballLastResult) {
    renderBasketball(basketballLastResult);
    return;
  }
  appBasketball.innerHTML = '<div class="status">加载中…</div>';
  try {
    const qs = new URLSearchParams({
      _: Date.now().toString(),
      source: basketballSource || 'okooo',
    });
    const data = await fetchJson('/api/basketball?' + qs.toString());
    if (data.error) {
      appBasketball.innerHTML = `<div class="status error">✗ ${esc(data.error)}</div>`;
      return;
    }
    basketballLoaded = true;
    renderBasketball(data.result);
  } catch (e) {
    appBasketball.innerHTML = `<div class="status error">网络请求失败：${esc(e.message)}</div>`;
  }
}

function basketballMatchPassesSearch(m) {
  const kw = (basketballSearchFilter || '').trim().toLowerCase();
  if (!kw) return true;
  return [
    m.home,
    m.away,
    m.league,
    m.time,
    m.spf?.prediction,
    m.rqspf?.prediction,
    m.daxiao?.prediction,
  ].filter(Boolean).join(' ').toLowerCase().includes(kw);
}

function attachBasketballSearchListeners() {

    handleBasketballSearch({ target: input });

}
