function preparePredictionCalendar(records) {
  const dates = [...new Set(records.map(predictionSessionKey).filter(Boolean))].sort((a, b) => b.localeCompare(a));
  predictionAvailableDates = dates;
  predictionDateCounts = records.reduce((counts, record) => {
    const session = predictionSessionKey(record);
    if (session) counts[session] = (counts[session] || 0) + 1;
    return counts;
  }, {});
  const anchor = predictionDateFilter || dates[0] || new Date().toISOString().slice(0, 10);
  if (!predictionCalendarMonth || predictionDateFilter) predictionCalendarMonth = anchor.slice(0, 7);
}

function footballMarketDirectionsCompatible(standardPick, handicapPick, handicap) {
  const line = handicap === null || handicap === undefined || handicap === ''
    || typeof handicap === 'boolean' ? NaN : Number(handicap);
  const bounds = {'胜':[1, Infinity], '平':[0, 0], '负':[-Infinity, -1]}[standardPick];
  const rqBounds = {'让胜':[1 - line, Infinity], '让平':[-line, -line], '让负':[-Infinity, -1 - line]}[handicapPick];
  if (!Number.isInteger(line) || Math.abs(line) > 5 || !bounds || !rqBounds) return null;
  return Math.max(bounds[0], rqBounds[0]) <= Math.min(bounds[1], rqBounds[1]);
}

function predictionRecordActualScore(record) {
  if (record.settled !== true) return null;
  const match = String(record.actual_score || '').trim().match(/^(\d+)\s*[-:]\s*(\d+)$/);
  return match ? [Number(match[1]), Number(match[2])] : null;
}

function renderPredictionMarketOutcome(record, key, state, probabilities) {
  if (record.settled !== true) return '';
  const score = predictionRecordActualScore(record);
  const aliases = {H:'胜', D:'平', A:'负', home:'胜', draw:'平', away:'负', '主胜':'胜', '平局':'平', '客胜':'负'};
  const selected = state.status === 'selected';
  const ranked = Object.entries(probabilities).filter(([, value]) =>
    value !== null && value !== '' && typeof value !== 'boolean'
    && Number.isFinite(Number(value)) && Number(value) >= 0 && Number(value) <= 1)
    .sort((a, b) => Number(b[1]) - Number(a[1]));
  const pick = selected ? (aliases[state.pick] || state.pick) : ranked[0]?.[0];
  const label = selected ? '推荐结果' : '模型参考（非推荐）';
  let actual = null;
  if (score) {
    if (key === 'spf') actual = score[0] > score[1] ? '胜' : score[0] < score[1] ? '负' : '平';
    else {
      const raw = record.lottery_handicap;
      const line = raw == null || raw === '' || typeof raw === 'boolean' ? NaN : Number(raw);
      if (Number.isInteger(line)) {
        const margin = score[0] + line - score[1];
        actual = margin > 0 ? '让胜' : margin < 0 ? '让负' : '让平';
      }
    }
  }
  const validPick = (key === 'spf' ? ['胜','平','负'] : ['让胜','让平','让负']).includes(pick);
  const verdict = actual && validPick ? (pick === actual ? '✅ 命中' : '❌ 未命中') : '暂无法判定';
  return `<p class="market-reason">${label}：${validPick ? esc(pick) : '无有效预测'} · <b>${verdict}</b>${actual ? ` · 实际${esc(actual)}` : ''}</p>`;
}

function renderPredictionRecordMarkets(record) {
  const aliases = {H:'胜', D:'平', A:'负', home:'胜', draw:'平', away:'负', '胜':'胜', '平':'平', '负':'负'};
  const savedStandard = Object.fromEntries(Object.entries(record.predicted_1x2 || {})
    .filter(([key]) => aliases[key]).map(([key, value]) => [aliases[key], value]));
  const standard = Object.keys(savedStandard).length
    ? (record.lottery_analysis?.standard?.probabilities || savedStandard) : {};
  const handicap = Object.keys(record.predicted_rqspf || {}).length
    ? (record.lottery_analysis?.handicap?.probabilities || record.predicted_rqspf) : {};
  const snapshot = record.recommendation_snapshot || {};
  const lottery = {
    offer_matched: record.lottery_offer_matched === true,
    spf_available: record.lottery_spf_available,
    spf_odds: record.lottery_spf_odds || {},
    standard: {probabilities: standard, prediction: record.lottery_direction_analysis?.standard_prediction},
    handicap: {handicap: record.lottery_handicap, probabilities: handicap},
    direction_analysis: record.lottery_direction_analysis,
    accuracy_gate: snapshot.accuracy_gate || {},
  };
  // 使用赛事推荐页的同一状态计算与组件；不从概率最大值推导“已推荐”。
  const states = getFootballResultTier({result: {lottery, decision_gate: snapshot.decision_gate}}).markets;
  const spfEnabled = Object.keys(standard).length > 0;
  const direction = getFootballDirectionState(lottery, spfEnabled);
  const rows = [];
  for (const [key, label, probabilities, keys] of [
    ['spf', '胜平负', standard, ['胜', '平', '负']],
    ['rqspf', `让球胜平负${record.lottery_handicap == null ? '' : `（主队 ${Number(record.lottery_handicap) > 0 ? '+' : ''}${record.lottery_handicap}）`}`, handicap, ['让胜', '让平', '让负']],
  ]) {
    if (!Object.keys(probabilities).length) continue;
    const state = states[key];
    if (!snapshot.accuracy_gate?.[key]) {
      state.reasons = ['该记录未保存当时的推荐筛选结果，仅展示赛前概率'];
    }
    const distribution = key === 'rqspf'
      ? renderFootballHandicapProbabilities(lottery, spfEnabled)
      : `<p class="market-direction-label">${esc(direction.available
        ? `分析方向：${direction.standardName}（${direction.standard}） · 全场概率`
        : '胜平负 · 全场概率')}</p>${renderProbabilityStrip(probabilities, keys)}`;
    rows.push(renderWebMarketRecommendation(label, state, state.pick,
      distribution
      + renderPredictionMarketOutcome(record, key, state, probabilities)));
  }
  if (Object.keys(handicap).length) {
    rows.push(`<details class="football-direction-reference"><summary>胜平负与让球的对应分析</summary>${renderFootballDirectionAnalysis(lottery, spfEnabled)}</details>`);
  }
  return rows.join('');
}

function renderPredictionScoreReference(record) {
  const scores = Object.entries(record.predicted_scores || {})
    .filter(([score, probability]) => /^\d+-\d+$/.test(score)
      && probability !== null && probability !== '' && typeof probability !== 'boolean'
      && Number.isFinite(Number(probability))
      && Number(probability) > 0 && Number(probability) <= 1)
    .sort((a, b) => Number(b[1]) - Number(a[1]))
    .slice(0, 3);
  const detail = scores.length
    ? scores.map(([score, probability]) =>
      `<span style="white-space:nowrap"><b>${esc(score)}</b> <span style="color:var(--muted)">${(Number(probability) * 100).toFixed(1)}%</span></span>`
    ).join('<span style="color:var(--muted)"> · </span>')
    : '<span style="color:var(--muted)">暂无已保存的比分预测</span>';
  const actual = predictionRecordActualScore(record);
  let verdict = '';
  if (record.settled === true) {
    if (actual && scores.length) {
      const rank = scores.findIndex(([score]) => score.split('-').map(Number).every((v, i) => v === actual[i]));
      verdict = `<div style="margin-top:4px">比分 Top1：${rank === 0 ? '✅ 命中' : '❌ 未命中'} · Top3：${rank >= 0 ? `✅ 命中（第${rank + 1}位）` : '❌ 未命中'}</div>`;
    } else {
      verdict = '<div style="margin-top:4px;color:var(--muted)">比分命中：暂无法判定</div>';
    }
  }
  return `<div style="margin-top:8px;font-size:12px"><span style="color:var(--muted)">比分参考 Top3（非主推）：</span>${detail}${verdict}</div>`;
}

async function loadPredictions() {
  const app = document.getElementById('app-predictions');
  app.innerHTML = `<div class="status"><span class="spinner"></span>正在加载预测记录…</div>`;
  
  try {
    // 预测记录是主数据；同步状态和导出诊断是辅助数据。辅助接口失败时也必须
    // 展示已保存记录，不能因为当前没有赛程或诊断暂不可用把历史一起隐藏。
    const optionalResult = async promise => {
      try {
        const data = await promise;
        return data?.error ? { error: data.error } : data;
      } catch (error) {
        return { error: error.message || String(error) };
      }
    };
    const [recordsData, syncStatus, diagnosticsData] = await Promise.all([
      fetchJson('/api/predictions'),
      optionalResult(fetchJsonWithTimeout('/api/sync/status', 5000)),
      optionalResult(fetchJsonWithTimeout('/api/football/diagnostics', 5000))
    ]);
    if (recordsData.error) throw new Error(recordsData.error);
    
    const sync = syncStatus.result || {};
    const allRecords = recordsData.result?.records || [];
    const availableDates = [...new Set(allRecords.map(predictionRecordDateKey).filter(Boolean))]
      .sort((a, b) => b.localeCompare(a));
    predictionAvailableDates = availableDates;
    predictionDateCounts = allRecords.reduce((counts, record) => {
      const date = predictionRecordDateKey(record);
      if (date) counts[date] = (counts[date] || 0) + 1;
      return counts;
    }, {});
    const calendarAnchor = predictionDateFilter || availableDates[0]
      || new Date().toISOString().slice(0, 10);
    if (!predictionCalendarMonth || predictionDateFilter) {
      predictionCalendarMonth = calendarAnchor.slice(0, 7);

      predictionDateFilter

      ${predictionDateFilter ? `<button type="button" class="prediction-date-action" onclick="setPredictionDateFilter('')">查看全部</button>` : ''}
      <button type="button" class="prediction-date-action" onclick="togglePredictionSortOrder()"
        title="按赛事编号排序">编号 ${predictionSortAscending ? '↑' : '↓'}</button>
      <span class="prediction-date-result">${predictionDateFilter ? `${esc(predictionSessionLabel(predictionDateFilter))} · ${records.length} 场` : `全部期次 · ${records.length} 场`}</span>
    </div>`;
    html += `<div class="section-title">📋 预测记录（共 ${records.length} 条）</div>`;
    
    const totalPages = Math.max(1, Math.ceil(records.length / PREDICTIONS_PAGE_SIZE));
    predictionsPage = Math.max(1, Math.min(predictionsPage, totalPages));
    const pageStart = (predictionsPage - 1) * PREDICTIONS_PAGE_SIZE;
    const pageRecords = records.slice(pageStart, pageStart + PREDICTIONS_PAGE_SIZE);
    const pageEnd = pageStart + pageRecords.length;
    if (records.length > PREDICTIONS_PAGE_SIZE) {
      html += renderPredictionsPager(records.length, predictionsPage, totalPages, pageStart + 1, pageEnd);
    }

    if (records.length === 0) {
      html += `<div class="card">
        <div class="status" style="padding:20px">暂无预测记录。点击足球预测标签页查看比赛并进行预测。</div>
      </div>`;
    } else {
      pageRecords.forEach((record, idx) => {
        const statusMap = {
          'pending': { label: '等待自动同步', color: 'var(--muted)' },
          'ready': { label: '准备同步', color: 'var(--warn)' },
          'synced': { label: '已回填', color: 'var(--accent2)' },
          'retry': { label: '重试中', color: 'var(--warn)' },
          'failed': { label: '同步失败', color: 'var(--away)' },
          'ignored': { label: '已隐藏', color: 'var(--muted)' },
        };
        const status = statusMap[record.sync_status] || statusMap['pending'];
        
        const spfLabels = { H: '胜', D: '平', A: '负', home: '胜', draw: '平', away: '负', '胜': '胜', '平': '平', '负': '负' };
        const hasSpf = Object.keys(record.predicted_1x2 || {}).length > 0;
        const hasRqspf = Object.keys(record.predicted_rqspf || {}).length > 0;
        const lotteryUnverified = record.lottery_offer_matched === false;
        const actualSpf = spfLabels[record.actual_result] || record.actual_result || '-';
        const marketVerificationNote = lotteryUnverified
          ? `<div style="margin-top:4px;color:var(--warn)">⚠ 竞彩玩法暂未核验，本条不展示未核验的模型赛果；数据源恢复后会自动重算。</div>`
          : (!hasSpf && !hasRqspf
            ? `<div style="margin-top:4px;color:var(--muted)">暂无可核验的竞彩胜平负玩法预测</div>`
            : '');
        
        html += `<div class="card" style="${idx > 0 ? 'margin-top:8px' : ''}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-weight:600;font-size:15px">${record.match_num ? `<span style="display:inline-block;margin-right:7px;padding:2px 6px;border-radius:5px;background:rgba(68,147,248,.14);color:var(--color-info);font-size:12px;vertical-align:1px">${esc(record.match_num)}</span>` : ''}${esc(record.home)} vs ${esc(record.away)}</div>
              <div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(record.league || '')} · ${esc(record.match_time || '')}</div>
            </div>
            <div style="text-align:right">
              <div style="color:${status.color};font-size:13px;font-weight:500">${status.label}</div>
              ${record.sync_attempts > 0 ? `<div style="color:var(--muted);font-size:11px">失败${record.sync_attempts}次</div>` : ''}
            </div>
          </div>`;
        
        html += renderPredictionRecordMarkets(record);

        if (record.settled) {
          // 已结算
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px">
            ${marketVerificationNote}
            <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px">
            <div><span style="color:var(--muted)">赛后比分：</span><b style="color:var(--accent2)">${esc(record.actual_score || '-')}</b></div>
            <div><span style="color:var(--muted)">实际胜平负：</span>${esc(actualSpf)}</div>
            ${record.actual_rqspf ? `<div><span style="color:var(--muted)">实际让球赛果：</span>${esc(record.actual_rqspf)}</div>` : ''}
            </div>
          </div>`;
        } else if (record.sync_status === 'failed') {
          // 同步失败
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px">
            <div style="color:var(--away)">失败原因：${esc(record.last_sync_error || '未知')}</div>
            ${record.next_sync_at ? `<div style="color:var(--muted);margin-top:2px">下次重试：${record.next_sync_at?.replace('T', ' ').slice(0, 16) || '-'}</div>` : ''}
          </div>`;
        } else {
          // 待同步
          html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px">
            ${marketVerificationNote}
            ${record.sync_status === 'retry' && record.last_sync_error ? `<div style="color:var(--warn);margin-top:2px">上次失败：${esc(record.last_sync_error)}</div>` : ''}
            ${record.next_sync_at ? `<div style="color:var(--muted);margin-top:2px">预计同步：${record.next_sync_at?.replace('T', ' ').slice(0, 16) || '-'}</div>` : ''}
          </div>`;
        }
        
        html += renderPredictionScoreReference(record);
        html += `</div>`;
      });
      if (records.length > PREDICTIONS_PAGE_SIZE) {
        html += renderPredictionsPager(records.length, predictionsPage, totalPages, pageStart + 1, pageEnd);
      }
    }
    
    app.innerHTML = html;
    updateSyncStampAges(app);
    startSyncStampTimer();
  } catch (e) {
    app.innerHTML = `<div class="status error">加载失败：${esc(e.message)}</div>`;
  }
}

async function exportPredictionRecords() {
  let payload;
  try {
    if (!payload) {
      const data = await fetchJson('/api/predictions/export');
      if (!data.result) throw new Error(data.error || '导出接口未返回数据');
      payload = data.result;
    }
  } catch (error) {
    alert('导出失败：' + error.message);
    return;
  }
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  link.href = url;
  link.download = `football-predictions-${stamp}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function triggerSync() {
  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = '同步中...';
  btn.disabled = true;
  
  try {
    const data = await fetchJson('/api/sync/trigger');
    if (data.result) {
      alert(`同步完成：${data.result.message || '同步成功'}`);
      loadPredictions();
    } else {
      alert('同步失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('同步失败：' + e.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function runFootballReview(repair = false) {
  if (repair && !confirm('确定执行复盘修复吗？会重置提前回填，并把低可信样本排除出校准。')) return;

  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = repair ? '修复中...' : '复盘中...';
  btn.disabled = true;

  try {
    const data = await fetchJson(`/api/football/review?repair=${repair ? 1 : 0}`);
    if (!data.result) {
      alert('复盘失败：' + (data.error || '未知错误'));
      return;
    }

    const result = data.result || {};
    const audit = result.audit || {};
    const rolling = result.rolling || {};
    const tuning = result.tuning || {};
    const plan = tuning.plan || {};
    const sync = result.sync || {};
    const auditBreakdown = getFootballAuditBreakdown(audit);
    const message = [
      '复盘完成',
      `同步：${sync.message || '-'}`,
      `审计问题：${audit.issue_count || 0}`,
      ...(auditBreakdown.length ? [`问题明细：${auditBreakdown.join('、')}`] : []),
      `已修复：${audit.repaired_count || 0}`,
      `可用样本：${rolling.available_samples || 0}`,
      `调参预案：${plan.reason || tuning.error || '暂无'}`
    ].join('\n');

    alert(message);
    loadPredictions();
  } catch (e) {
    alert('复盘失败：' + e.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function hideFailedRecords() {
  if (!confirm('确定要隐藏所有失败记录吗？')) return;
  
  try {
    const data = await fetchJson('/api/sync/hide_failed');
    if (data.result?.success) {
      alert('已隐藏所有失败记录');
      loadPredictions();
    } else {
      alert('操作失败：' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('操作失败：' + e.message);
  }
}

initPage();

/* ===== 深度报告弹窗 ===== */
function openBayesModal(url, title) {
  let backdrop = document.getElementById('bayes-modal-backdrop');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'bayes-modal-backdrop';
    backdrop.className = 'bayes-modal-backdrop';
    backdrop.innerHTML =
      '<div class="bayes-modal">' +
        '<div class="bayes-modal-header">' +
          '<div class="bayes-modal-title" id="bayes-modal-title">📊 深度报告</div>' +
          '<button class="bayes-modal-close" onclick="closeBayesModal()" title="关闭">×</button>' +
        '</div>' +
        '<iframe class="bayes-modal-iframe" id="bayes-modal-iframe" ' +
          'sandbox="allow-same-origin allow-scripts" referrerpolicy="no-referrer"></iframe>' +
      '</div>';
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeBayesModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBayesModal(); });
  }
  document.getElementById('bayes-modal-title').innerHTML =
    '📊 深度报告 <small>' + esc(title || '') + '</small>';
  const iframe = document.getElementById('bayes-modal-iframe');
  iframe.src = url;
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeBayesModal() {
  const backdrop = document.getElementById('bayes-modal-backdrop');
  if (!backdrop) return;
  backdrop.classList.remove('open');
  const iframe = document.getElementById('bayes-modal-iframe');
  if (iframe) iframe.src = 'about:blank';
  document.body.style.overflow = '';
}
